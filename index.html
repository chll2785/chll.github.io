<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>조공부터 소장까지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: 화면 전체를 채우는 심해 공사현장 캔버스 + 그 위에 뜨는 '현장 사무소' 서류형 오버레이. 의도적으로 다크 단일 테마. */
:root{
  --abyss:#020c15;
  --panel:#0a1b29;
  --panel-2:#0f2536;
  --line:#23435a;
  --ink:#e9f2f7;
  --muted:#8fb0c4;
  --hazard:#ffc21a;
  --hazard-ink:#1b1506;
  --rust:#f0612d;
  --ok:#5fd39a;
  --atk:#ff7a4d; --rng:#4dc3ff; --srv:#5fd39a; --mob:#ffd24d; --fort:#c79bff;
  --f-display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--abyss);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#wrap{position:relative;width:100%;height:100%;overflow:hidden;-webkit-user-select:none;user-select:none}
#cv{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none}
input{-webkit-user-select:text;user-select:text}

#btnPause{position:absolute;top:52px;right:14px;width:40px;height:40px;border-radius:6px;border:1px solid var(--line);background:rgba(6,22,36,.7);color:var(--ink);display:grid;place-items:center;cursor:pointer;z-index:5}
#btnSound{position:absolute;top:52px;right:62px;width:40px;height:40px;border-radius:6px;border:1px solid var(--line);background:rgba(6,22,36,.7);color:var(--ink);display:grid;place-items:center;cursor:pointer;z-index:5;padding:0}
#btnPause[hidden]+#btnSound{display:none}
@media (min-width:641px){#btnSound{top:100px;right:14px}}
.sndico{width:20px;height:20px;display:block}
.sndico .x{display:none}.muted .sndico .w{display:none}.muted .sndico .x{display:inline}
#btnOfSnd{padding:6px 9px;display:inline-grid;place-items:center}
.vol{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;margin:12px 0;font-size:13px}
.vol input{width:100%;accent-color:var(--gold,#ffc21a)}
.vol output{min-width:3ch;text-align:right;color:var(--muted)}
#btnPause span{display:block;width:12px;height:14px;border-left:4px solid var(--ink);border-right:4px solid var(--ink)}
button:focus-visible,input:focus-visible,.node:focus-visible{outline:3px solid var(--hazard);outline-offset:2px}

.overlay{position:absolute;inset:0;z-index:10;display:grid;place-items:center;padding-block:16px;padding-left:16px;padding-right:16px;background:rgba(2,10,18,.74);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);overflow:auto}
.panel{width:min(620px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.panel::before,.office::before{content:"";display:block;height:10px;flex:none;background:repeating-linear-gradient(-45deg,var(--hazard) 0 14px,var(--hazard-ink) 14px 28px)}
.panel-body{padding:22px 22px 24px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--hazard);font-weight:700}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:400;text-wrap:balance;letter-spacing:.01em}
h2{font-size:30px;line-height:1.15}
h3{font-size:18px}
p{margin:0;line-height:1.6;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{appearance:none;border:0;border-radius:4px;padding:12px 18px;font-family:var(--f-display);font-size:17px;cursor:pointer;background:var(--hazard);color:var(--hazard-ink);transition:transform .08s ease}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{font-size:14px;padding:8px 12px}
.btn.warn{background:var(--rust);color:#fff}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.linkbtn{appearance:none;background:none;border:0;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:4px 0}

.report{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:4px;overflow:hidden}
.report div{padding:10px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.report div:last-child{border-right:0}
.report small{font-size:11px;color:var(--muted);letter-spacing:.06em}
.report b{font-size:20px;font-variant-numeric:tabular-nums;font-weight:700}
@media (max-width:520px){.report{grid-template-columns:repeat(2,minmax(0,1fr))}.report div:nth-child(2){border-right:0}.report div:nth-child(-n+2){border-bottom:1px solid var(--line)}}

.promo{border:2px solid var(--hazard);border-radius:4px;padding:14px 16px;background:linear-gradient(180deg,rgba(255,194,26,.14),rgba(255,194,26,.03));display:flex;gap:14px;align-items:center}
.promo .big{font-family:var(--f-display);font-size:24px;color:var(--hazard)}
.promo canvas{flex:none}
.req{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border:1px dashed var(--line);border-radius:4px}
.req ul{margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.req li{list-style:none;display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.chk{width:16px;height:16px;border-radius:3px;border:1px solid var(--line);display:inline-grid;place-items:center;font-size:11px;flex:none}
.chk.on{background:var(--ok);border-color:var(--ok);color:#06210f}
.warnline{padding:10px 14px;border-radius:4px;background:rgba(240,97,45,.14);border:1px solid rgba(240,97,45,.5);color:#ffd2c2;font-size:14px}
.note{padding:10px 14px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);font-size:13px;color:var(--muted);line-height:1.55}

/* 로그인 */
#login{background:linear-gradient(180deg,rgba(2,10,18,.15),rgba(2,10,18,.88));place-items:center start}
.title-box{width:min(560px,100%);display:flex;flex-direction:column;gap:16px}
.title-box h1{font-size:clamp(44px,9vw,84px);line-height:1;color:var(--ink)}
.title-box h1 em{font-style:normal;color:var(--hazard)}
.ranks-line{display:flex;flex-wrap:wrap;gap:4px 6px;font-size:12px;color:var(--muted)}
.ranks-line span:not(:last-child)::after{content:"›";margin-left:6px;color:var(--line)}
.ranks-line span:first-child{color:var(--hazard);font-weight:700}
.ranks-line span:last-child{color:var(--ink);font-weight:700}
.authcard{background:rgba(10,27,41,.92);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);letter-spacing:.04em}
.field input{padding:11px 12px;border-radius:4px;border:1px solid var(--line);background:#06131e;color:var(--ink);font:inherit;font-size:16px}
.two-in{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:460px){.two-in{grid-template-columns:1fr}}
.msg{font-size:13px;min-height:1.2em;color:var(--muted)}
.msg.err{color:#ff9d84}
.msg.ok{color:var(--ok)}
.mode{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.mode i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.mode.cloud i{background:var(--ok)}
.controls{font-size:12px;color:var(--muted);line-height:1.7}
kbd{font-family:var(--f-body);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px;color:var(--ink)}
details.dev{font-size:12px;color:var(--muted)}
details.dev summary{cursor:pointer}
.devrow{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-top:8px}
.devrow label{display:flex;flex-direction:column;gap:4px}
.devrow input{width:76px;padding:7px;border-radius:4px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}

/* 현장 사무소 */
#office{place-items:stretch center}
.office{width:min(1000px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.office-head{display:flex;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.office-head .who{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.office-head .who b{font-family:var(--f-display);font-weight:400;font-size:22px}
.office-head .who small{color:var(--muted);font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:flex;flex-direction:column;padding:6px 10px;border:1px solid var(--line);border-radius:4px;min-width:72px}
.chip small{font-size:10px;color:var(--muted);letter-spacing:.08em}
.chip b{font-variant-numeric:tabular-nums;font-size:16px}
.chip.gold b{color:#ffd84a}
.chip.sp b{color:var(--ok)}
.office-cta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.office-cta .btn{font-size:20px;padding:14px 22px}
.office-cta p{font-size:13px;flex:1;min-width:200px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs button{appearance:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:inherit;font-weight:700;font-size:14px;padding:12px 16px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--hazard)}
.tabs .badge{display:inline-block;margin-left:6px;background:var(--ok);color:#06210f;border-radius:8px;font-size:11px;padding:0 6px}
.tabbody{overflow:auto;padding:16px 18px 20px;min-height:0;flex:1}
.saveinfo{font-size:11px;color:var(--muted)}

/* 스킬 트리 */
.skillwrap{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px}
@media (max-width:820px){.skillwrap{grid-template-columns:1fr}}
.mapbox{overflow:auto;border:1px solid var(--line);border-radius:6px;background:radial-gradient(circle at 50% 50%,#10293c 0,#071622 70%);min-width:0}
.mapbox svg{display:block;width:max(100%,620px);height:auto}
.node{cursor:pointer}
.node text{font-family:var(--f-body);pointer-events:none}
.skilldetail{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:6px;padding:14px;align-self:start}
.skilldetail .lvl{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.effect{font-size:14px;line-height:1.55}
.effect span{color:var(--ok)}
.pips{display:flex;gap:3px;flex-wrap:wrap}
.pips i{width:12px;height:5px;border-radius:1px;background:var(--line)}
.pips i.on{background:var(--hazard)}

/* 현장 지원 카드 */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:600px){.cards{grid-template-columns:1fr}}
.card{appearance:none;text-align:left;cursor:pointer;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:14px;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:6px;min-width:0}
.card:hover{border-color:var(--hazard)}
.card .key{font-size:11px;color:var(--muted);letter-spacing:.1em}
.card .nm{font-family:var(--f-display);font-size:19px}
.card .ds{font-size:13px;color:var(--muted);line-height:1.5}
.card .st{font-size:11px;color:var(--ok)}
/* 인벤토리 / 강화 */
.invwrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px}
@media (max-width:760px){.invwrap{grid-template-columns:1fr}}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:4px;min-width:0}
.slot .meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.slot small{font-size:11px;color:var(--muted)}
.slot.empty{border-style:dashed;opacity:.55}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.item{appearance:none;cursor:pointer;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:8px;display:flex;flex-direction:column;gap:4px;align-items:center;color:var(--ink);font:inherit;font-size:12px;min-width:0}
.item.sel{border-color:var(--hazard);box-shadow:0 0 0 1px var(--hazard) inset}
.item.eq{border-color:var(--ok)}
.item .nm{font-weight:700;text-align:center}
.item .sub{color:var(--muted);font-size:11px}
.item canvas{width:96px;height:32px}
.idetail{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:6px;padding:14px}
.stats{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.stats dt{color:var(--muted)}
.stats dd{margin:0;font-variant-numeric:tabular-nums}
.enhbig{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.enhbig canvas{width:240px;height:80px;max-width:100%}
.rate{font-family:var(--f-display);font-size:28px}
.result{font-family:var(--f-display);font-size:22px;min-height:1.3em}
.result.ok{color:var(--ok)}
.result.fail{color:#ff9d84}

/* 세이브 코드 */
.codebox{box-sizing:border-box;width:100%;max-width:100%;min-height:96px;resize:vertical;padding:10px 12px;border-radius:4px;border:1px solid var(--line);background:#06131e;color:var(--ink);font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all;-webkit-user-select:text;user-select:text}
/* 직급 */
.ladder{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.rankcard{border:1px solid var(--line);border-radius:4px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.rankcard.cur{border-color:var(--hazard);background:rgba(255,194,26,.08)}
.rankcard.lock{opacity:.6}
.rankcard b{font-family:var(--f-display);font-weight:400;font-size:17px}
.rankcard small{font-size:11px;color:var(--muted)}
.tag{font-size:11px;padding:2px 7px;border-radius:3px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.done{background:var(--ok);border-color:var(--ok);color:#06210f}
.tag.now{background:var(--hazard);border-color:var(--hazard);color:var(--hazard-ink)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:8px}
.two>*,.invwrap>*,.skillwrap>*{min-width:0}
.dmgrep{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border:1px solid var(--line);border-radius:4px;background:var(--panel-2)}
.dmgrow{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) 3em;gap:10px;align-items:center;font-size:13px}
.dmgrow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.dmgrow i{display:block;height:8px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden}
.dmgrow b{display:block;height:100%;border-radius:4px}
.dmgrow em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
/* 스킬 목록 보기 (모바일 기본) */
.skillhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.viewtoggle{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.viewtoggle button{appearance:none;background:none;border:0;color:var(--muted);font:inherit;font-size:13px;font-weight:700;padding:8px 14px;cursor:pointer}
.viewtoggle button[aria-pressed="true"]{background:var(--hazard);color:var(--hazard-ink)}
.spsum{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.spsum b{color:var(--ok);font-size:16px}
.skgroup{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.skgroup h4{margin:0 0 2px;font-family:var(--f-display);font-weight:400;font-size:17px}
.skrow{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:4px;background:var(--panel-2)}
.skrow[data-d="2"]{margin-left:14px}.skrow[data-d="3"]{margin-left:28px}.skrow[data-d="4"]{margin-left:42px}
.skrow.locked{opacity:.55}
.skrow.maxed{border-color:var(--c)}
.skinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.sktop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sktop b{font-size:14px}
.sklv{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.skeff{font-size:12px;color:var(--muted);line-height:1.45}
.skeff span{color:var(--ok)}
.skbtns{display:flex;gap:6px;flex:none}
.skbtns .btn{min-width:46px;padding:10px 8px;font-size:15px}
.tabs .short{display:none}

/* 모바일 사무소: 전체 화면, 상단 정보 한 줄, 탭 균등 분할, 출근 버튼은 하단 고정 */
@media (max-width:640px){
  #office{padding:0;place-items:stretch}
  .office{width:100%;height:100%;max-height:none;border:0;border-radius:0;box-shadow:none}
  .office::before{height:6px}
  .office-head{order:1;padding:8px 12px;gap:10px;flex-wrap:nowrap}
  #officeAvatar{width:38px!important;height:42px!important;flex:none}
  .office-head .who b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .office-head .who small{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chips{gap:6px;flex-wrap:nowrap;flex:none}
  .chip{min-width:0;padding:5px 8px;flex-direction:row;align-items:baseline;gap:3px}
  .chip small{display:none}
  .chip b{font-size:13px;white-space:nowrap}
  .chip.gold b::after{content:" G";font-size:11px}
  .chip.sp b::before{content:"SP ";font-size:11px}
  #btnLogout{padding:6px 8px;font-size:12px}
  .tabs{order:2}
  .tabs button{flex:1 1 0;padding:12px 2px;font-size:13px;text-align:center}
  .tabs .long{display:none}.tabs .short{display:inline}
  .tabs .badge{margin-left:3px;padding:0 5px}
  .tabbody{order:3;padding:12px 12px 16px}
  .office-cta{order:4;flex-direction:column;align-items:stretch;gap:6px;padding:8px 12px 10px;border-top:1px solid var(--line);border-bottom:0}
  .office-cta .btn{width:100%;font-size:18px;padding:13px}
  .office-cta p{order:-1;min-width:0;font-size:12px;text-align:center}
  .saveinfo{text-align:center;font-size:10px}
  .slot.empty{display:none}
  .invwrap,.skillwrap{gap:12px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
  .item canvas{width:84px;height:28px}
  h3{font-size:16px}
}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>

<div id="wrap">
  <canvas id="cv" aria-label="게임 화면"></canvas>
  <button id="btnPause" type="button" aria-label="일시정지" hidden><span></span></button>
  <button id="btnSound" type="button" aria-label="소리 끄기/켜기"><svg class="sndico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><g class="w" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/></g><g class="x" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 9l6 6M22 9l-6 6"/></g></svg></button>

  <section id="login" class="overlay">
    <div class="title-box">
      <div class="eyebrow">수심 800m 배관공사 서바이벌</div>
      <h1>조공부터<br><em>소장</em>까지</h1>

<script>
(()=>{
'use strict';
/* =====================================================================
   0. 공용 도구
   ===================================================================== */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
/* =====================================================================
   0-1. 사운드 — Web Audio로 직접 합성 (외부 음원 파일 없음)
   배경음: 심해의 압력·고래 울음·소나·선체 삐걱임·먼 곳의 두드림이 겹치는 공포 분위기
   ===================================================================== */
const SND=(()=>{
  const AC=window.AudioContext||window.webkitAudioContext;
  const pref={bgm:.7,sfx:.8,mute:false};
  try{ Object.assign(pref,JSON.parse(localStorage.getItem('jogong_audio')||'{}')); }catch(e){}
  const savePref=()=>{ try{ localStorage.setItem('jogong_audio',JSON.stringify(pref)); }catch(e){} };
  let ac=null, out, bgmBus, sfxBus, musicGain, bossGain, verb, sverb, echo, noiseBuf, brownBuf;
  let mood='title', depth=0, danger=0, nextEvt=0, nextBeat=0, ducked=false, voices=0, drone=null;
  const last={};
  const quiet=()=>!ac||(typeof SIM!=='undefined'&&SIM.on);
  const ok=(k,ms)=>{ const n=performance.now(); if(n-(last[k]||0)<ms) return false; last[k]=n; return true; };
  const R=(a,b)=>a+Math.random()*(b-a);

  function makeNoise(sec,brown){
    const len=Math.floor(ac.sampleRate*sec), b=ac.createBuffer(1,len,ac.sampleRate), d=b.getChannelData(0); let l=0;
    for(let i=0;i<len;i++){ const w=Math.random()*2-1; if(brown){ l=(l+.02*w)/1.02; d[i]=l*3.5; } else d[i]=w; }
    return b;
  }
  function impulse(sec,decay){
    const len=Math.floor(ac.sampleRate*sec), b=ac.createBuffer(2,len,ac.sampleRate);
    for(let c=0;c<2;c++){ const d=b.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay); }
    return b;
  }
  function init(){
    if(ac) return true; if(!AC) return false;
    try{ ac=new AC(); }catch(e){ ac=null; return false; }
    const comp=ac.createDynamicsCompressor(); comp.threshold.value=-16; comp.knee.value=12; comp.ratio.value=5; comp.attack.value=.004; comp.release.value=.2;
    out=ac.createGain(); out.gain.value=pref.mute?0:1; out.connect(comp); comp.connect(ac.destination);
    bgmBus=ac.createGain(); bgmBus.gain.value=pref.bgm*.45; bgmBus.connect(out);
    sfxBus=ac.createGain(); sfxBus.gain.value=pref.sfx*3.2; sfxBus.connect(out);
    musicGain=ac.createGain(); musicGain.gain.value=0; musicGain.connect(bgmBus);
    bossGain=ac.createGain(); bossGain.gain.value=0; bossGain.connect(musicGain);
    verb=ac.createConvolver(); verb.buffer=impulse(5,2.4); const vg=ac.createGain(); vg.gain.value=.8; verb.connect(vg); vg.connect(musicGain);
    sverb=ac.createConvolver(); sverb.buffer=impulse(1.6,3); const sg=ac.createGain(); sg.gain.value=.5; sverb.connect(sg); sg.connect(sfxBus);
    // 물속 메아리: 어두운 피드백 딜레이
    echo=ac.createDelay(2); echo.delayTime.value=.52; const fb=ac.createGain(); fb.gain.value=.42; const el=ac.createBiquadFilter(); el.type='lowpass'; el.frequency.value=1400;
    echo.connect(el); el.connect(fb); fb.connect(echo); el.connect(verb);
    noiseBuf=makeNoise(2,false); brownBuf=makeNoise(6,true);
    startDrone();
    document.addEventListener('visibilitychange',()=>{ if(!ac) return; if(document.hidden) ac.suspend(); else ac.resume(); });
    setInterval(sched,120);
    applyMood(true);
    return true;
  }
  function unlock(){ if(!init()) return; if(ac.state==='suspended') ac.resume(); }
  ['pointerdown','keydown','touchend'].forEach(ev=>addEventListener(ev,unlock,{passive:true,capture:true}));

  /* ---------- 상시 배경층 ---------- */
  function lfo(freq,depthV,target){ const o=ac.createOscillator(), g=ac.createGain(); o.frequency.value=freq; g.gain.value=depthV; o.connect(g); g.connect(target); o.start(); return {o,g}; }
  function startDrone(){
    const t=ac.currentTime;
    // 1) 저음 드론: 미세하게 어긋난 톱니파 두 개 + 트라이톤, 공명 로우패스가 천천히 숨쉬듯 열리고 닫힘
    const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=150; lp.Q.value=7;
    const dg=ac.createGain(); dg.gain.value=.14;
    const fs=[36.7,36.95,51.9]; const oscs=fs.map((f,i)=>{ const o=ac.createOscillator(); o.type=i<2?'sawtooth':'triangle'; o.frequency.value=f; const g=ac.createGain(); g.gain.value=i<2?.5:.35; o.connect(g); g.connect(lp); o.start(t); return o; });
    const cut=lfo(.045,70,lp.frequency);
    lp.connect(dg); dg.connect(musicGain); dg.connect(verb);
    // 2) 수압: 브라운 노이즈를 아주 낮게 걸러 파도처럼 부풀었다 가라앉음
    const ns=ac.createBufferSource(); ns.buffer=brownBuf; ns.loop=true;
    const nl=ac.createBiquadFilter(); nl.type='lowpass'; nl.frequency.value=110;
    const ng=ac.createGain(); ng.gain.value=.4; lfo(.07,.26,ng.gain);
    ns.connect(nl); nl.connect(ng); ng.connect(musicGain); ns.start(t);
    // 3) 불협 패드: 단2도(D-Eb)와 트라이톤(G#)이 겹친 차가운 화음, 아주 작게 떨림
    const pl=ac.createBiquadFilter(); pl.type='lowpass'; pl.frequency.value=700;
    const pg=ac.createGain(); pg.gain.value=.028; lfo(.11,.018,pg.gain);
    [146.8,155.6,207.7,293.7].forEach((f,i)=>{ const o=ac.createOscillator(); o.type='triangle'; o.frequency.value=f; o.detune.value=R(-8,8); lfo(R(.05,.15),R(2,5),o.detune); o.connect(pl); o.start(t); });
    pl.connect(pg); pg.connect(verb); pg.connect(musicGain);
    // 4) 보스층: 낮은 맥동 + 높은 불협 현(보스전에서만 bossGain으로 올라옴)
    const bl=ac.createBiquadFilter(); bl.type='bandpass'; bl.frequency.value=900; bl.Q.value=6; lfo(.09,400,bl.frequency);
    const bg=ac.createGain(); bg.gain.value=.05;
    [880,932.3].forEach(f=>{ const o=ac.createOscillator(); o.type='sawtooth'; o.frequency.value=f; lfo(5.5,6,o.frequency); o.connect(bl); o.start(t); });
    bl.connect(bg); bg.connect(verb); bg.connect(bossGain);
    const pulse=ac.createOscillator(); pulse.type='sine'; pulse.frequency.value=41.2; const pgain=ac.createGain(); pgain.gain.value=0; lfo(1.6,.35,pgain.gain);
    pulse.connect(pgain); pgain.connect(bossGain); pulse.start(t);
    drone={lp,cut};
  }
  function applyMood(instant){
    if(!ac) return;
    const t=ac.currentTime, tc=instant?.05:1.2;
    const lv={title:.75,office:.55,play:.9,boss:1,calm:.5,off:0}[mood]??.7;
    musicGain.gain.setTargetAtTime(ducked?lv*.35:lv,t,tc);
    bossGain.gain.setTargetAtTime(mood==='boss'?1:0,t,tc*1.5);
    // 깊이(어종 단계)가 깊을수록 드론이 더 어둡고 낮게
    drone.lp.frequency.setTargetAtTime(mood==='boss'?230:mood==='office'?110:150-depth*5,t,2);
  }

  /* ---------- 합성 도구 ---------- */
  function tone(o){
    if(voices>40) return; voices++;
    const t=ac.currentTime+(o.when||0), dur=o.dur||.2, a=o.a||.005;
    const osc=ac.createOscillator(); osc.type=o.type||'sine';
    osc.frequency.setValueAtTime(o.f,t); if(o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2,t+(o.glide||dur));
    if(o.det) osc.detune.value=o.det;
    let node=osc;
    if(o.ff){ const fl=ac.createBiquadFilter(); fl.type=o.ft||'lowpass'; fl.frequency.setValueAtTime(o.ff,t); if(o.ff2) fl.frequency.exponentialRampToValueAtTime(o.ff2,t+dur); fl.Q.value=o.q||1; node.connect(fl); node=fl; }
    const g=ac.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(o.vol||.2,t+a);
    if(o.hold) g.gain.setValueAtTime(o.vol||.2,t+a+o.hold);
    g.gain.exponentialRampToValueAtTime(.0001,t+a+(o.hold||0)+dur);
    node.connect(g); g.connect(o.bus||sfxBus); if(o.wet){ const w=ac.createGain(); w.gain.value=o.wet; g.connect(w); w.connect(o.bus===musicGain?verb:sverb); }
    if(o.echo){ const e=ac.createGain(); e.gain.value=o.echo; g.connect(e); e.connect(echo); }
    if(o.vib){ const v=ac.createOscillator(), vg=ac.createGain(); v.frequency.value=o.vib; vg.gain.value=o.vibD||4; v.connect(vg); vg.connect(osc.frequency); v.start(t); v.stop(t+a+(o.hold||0)+dur+.05); }
    osc.start(t); osc.stop(t+a+(o.hold||0)+dur+.05); osc.onended=()=>voices--;
  }
  function noise(o){
    if(voices>40) return; voices++;
    const t=ac.currentTime+(o.when||0), dur=o.dur||.2, a=o.a||.003;
    const s=ac.createBufferSource(); s.buffer=o.brown?brownBuf:noiseBuf; s.loop=true; s.playbackRate.value=o.rate||1;
    const fl=ac.createBiquadFilter(); fl.type=o.ft||'bandpass'; fl.frequency.setValueAtTime(o.f||1000,t); if(o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2,t+dur); fl.Q.value=o.q||1;
    const g=ac.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(o.vol||.2,t+a); if(o.hold) g.gain.setValueAtTime(o.vol||.2,t+a+o.hold); g.gain.exponentialRampToValueAtTime(.0001,t+a+(o.hold||0)+dur);
    s.connect(fl); fl.connect(g); g.connect(o.bus||sfxBus); if(o.wet){ const w=ac.createGain(); w.gain.value=o.wet; g.connect(w); w.connect(o.bus===musicGain?verb:sverb); }
    s.start(t,Math.random()*1.5); s.stop(t+a+(o.hold||0)+dur+.05); s.onended=()=>voices--;
  }
  const M=o=>tone(Object.assign({bus:musicGain},o)), MN=o=>noise(Object.assign({bus:musicGain},o));

  /* ---------- 배경 이벤트 (무작위로 들려오는 심해의 소리) ---------- */
  const EVENTS={
    whale(){ const b=R(70,120); M({type:'triangle',f:b,f2:b*R(1.3,1.7),glide:R(1.6,2.6),dur:R(3,4.5),a:1.4,vol:0.176,ff:600,wet:1.4,vib:R(3,6),vibD:3});
      M({type:'sine',f:b*R(1.4,1.8),f2:b*R(.7,.9),when:R(2.2,3),dur:3.2,a:1,vol:0.112,wet:1.6,vib:4,vibD:5}); },
    sonar(){ M({type:'sine',f:R(1050,1300),dur:1.4,a:.01,vol:0.112,wet:.9,echo:.8}); },
    groan(){ const f=R(55,90); M({type:'sawtooth',f,f2:f*R(.8,1.25),dur:R(1.8,3),a:.6,vol:0.144,ff:R(250,350),ff2:R(500,800),ft:'bandpass',q:9,wet:.8,vib:R(7,11),vibD:R(2,6)}); },
    knock(){ const n=Math.random()<.5?2:3; for(let i=0;i<n;i++){ M({type:'sine',f:70,f2:38,dur:.4,a:.004,vol:0.448,when:i*R(.3,.42),wet:1.2}); MN({f:300,ft:'lowpass',dur:.18,vol:0.288,when:i*R(.3,.42),wet:1}); } },
    bubbles(){ const n=Math.floor(R(5,11)); for(let i=0;i<n;i++){ const f=R(300,700); M({type:'sine',f,f2:f*R(1.6,2.4),dur:.06,a:.004,vol:0.064,when:i*R(.05,.13),wet:.6}); } },
    whisper(){ MN({f:R(1500,2600),f2:R(700,1200),q:14,dur:R(2,3.4),a:1.2,vol:0.08,wet:1.6}); },
    scrape(){ MN({f:R(2400,3400),f2:R(900,1400),q:18,dur:R(1.4,2.2),a:.5,vol:0.056,wet:1.3}); M({type:'sawtooth',f:R(1400,1800),f2:R(1300,1700),dur:1.6,a:.4,vol:0.019,ff:2500,wet:1.4,vib:9,vibD:15}); },
    shriek(){ M({type:'sawtooth',f:R(620,700),f2:R(900,1100),dur:1.6,a:.9,vol:0.048,ff:1600,ft:'bandpass',q:4,wet:1.6,vib:6,vibD:12}); M({type:'sawtooth',f:R(655,740),f2:R(950,1150),dur:1.6,a:.9,vol:0.04,ff:1600,ft:'bandpass',q:4,wet:1.6,vib:6.6,vibD:12}); },
  };
  const POOL={title:['whale','sonar','groan','bubbles','whisper'],office:['sonar','bubbles','groan','whale'],calm:['sonar','bubbles'],
    play:['whale','sonar','groan','knock','bubbles','whisper','scrape'],boss:['groan','knock','shriek','scrape','whale','knock']};
  function sched(){
    if(!ac||ac.state!=='running'||mood==='off') return;
    const t=ac.currentTime;
    if(t>=nextEvt){
      const p=POOL[mood]||POOL.play; EVENTS[p[Math.floor(Math.random()*p.length)]]();
      const busy=mood==='boss'?R(2.5,5):mood==='play'?R(4.5,9)-Math.min(2.5,depth*.25):R(7,13);
      nextEvt=t+busy;
    }
    // 심장 박동: 보스전, 또는 체력이 낮을 때 점점 빨라짐
    const beat=mood==='boss'||danger>0;
    if(beat&&t>=nextBeat){
      const iv=danger>0?Math.max(.42,.95-danger*.5):.88, v=danger>0?.18+danger*.2:.13;
      M({type:'sine',f:62,f2:40,dur:.22,a:.006,vol:v}); M({type:'sine',f:58,f2:38,dur:.26,a:.006,vol:v*.75,when:.2});
      nextBeat=t+iv;
    }
  }

  /* ---------- 효과음 ---------- */
  const FX={
    click(){ tone({type:'triangle',f:900,f2:700,dur:.05,vol:.05}); },
    throw(){ noise({f:1700,f2:500,q:1.4,dur:.12,vol:.16}); },
    hit(){ tone({type:'sine',f:230,f2:110,dur:.06,vol:.08}); noise({f:2500,q:2,dur:.025,vol:.05}); },
    crit(){ tone({type:'square',f:520,f2:260,dur:.07,vol:.05,ff:1800}); noise({f:3200,q:3,dur:.04,vol:.08}); },
    kill(){ const f=R(480,700); tone({type:'sine',f,f2:f*.28,dur:.1,vol:.09}); tone({type:'sine',f:f*1.6,f2:f*2.4,dur:.05,vol:.03,when:.05}); },
    elite(){ tone({type:'sawtooth',f:73.4,dur:.7,a:.12,vol:.12,ff:500,wet:.6}); tone({type:'sawtooth',f:77.8,dur:.7,a:.12,vol:.1,ff:500}); },
    eliteDie(){ noise({f:900,f2:120,ft:'lowpass',dur:.5,vol:.25,wet:.5}); tone({type:'sine',f:110,f2:45,dur:.45,vol:.25}); [784,988,1319].forEach((f,i)=>tone({type:'triangle',f,dur:.18,vol:.06,when:.12+i*.07,wet:.5})); },

const XPC={a:14,s1:1.3, s2:5, g3:1.0125, s4:30};
const XP_SEGMENTS=[
  {from:1,  to:60,  name:'빠른 성장'},
  {from:61, to:150, name:'빌드 구축'},
  {from:151,to:240, name:'무기 진화'},
  {from:241,to:300, name:'화면 쓸기'},
];
function xpToNext(L){
  if(L>=CFG.MAX_LEVEL) return Infinity;
  const e1=XPC.a+XPC.s1*59;                       // 구간1 끝값
  if(L<=60) return Math.round(XPC.a+XPC.s1*(L-1)); // 구간1: 완만한 직선
  const e2=e1+XPC.s2*90;
  if(L<=150) return Math.round(e1+XPC.s2*(L-60));  // 구간2: 가파른 직선
  const e3=e2*Math.pow(XPC.g3,90);
  if(L<=240) return Math.round(e2*Math.pow(XPC.g3,L-150)); // 구간3: 지수
  return Math.round(e3+XPC.s4*(L-240));            // 구간4: 직선
}

async function hashPw(pw,salt){
  const enc=new TextEncoder();
  if(window.crypto&&crypto.subtle){
    try{
      const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
      const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:60000,hash:'SHA-256'},key,256);
      return Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }catch(e){}
  }
  let h=2166136261; const s=salt+':'+pw; for(let r=0;r<2000;r++) for(let i=0;i<s.length;i++){h^=s.charCodeAt(i)+r; h=Math.imul(h,16777619);}
  return 'f'+(h>>>0).toString(16);
}
const randHex=n=>Array.from(crypto.getRandomValues(new Uint8Array(n))).map(b=>b.toString(16).padStart(2,'0')).join('');

function fbError(e){
  const c=e&&e.code||'';
  if(c.includes('email-already-in-use')) return '이미 사용 중인 아이디입니다. 다른 아이디를 입력하세요.';
  if(c.includes('weak-password')) return '비밀번호는 6자 이상이어야 합니다.';
  if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found')||c.includes('invalid-login')) return '아이디 또는 비밀번호가 맞지 않습니다.';
  if(c.includes('too-many-requests')) return '로그인 시도가 너무 많습니다. 잠시 후 다시 시도하세요.';
  if(c.includes('network')) return '인터넷 연결을 확인한 뒤 다시 시도하세요.';
  if(c.includes('operation-not-allowed')) return 'Firebase에서 이메일/비밀번호 로그인이 꺼져 있습니다. 설정 안내의 2단계를 확인하세요.';
  if(c.includes('unauthorized-domain')) return '이 주소가 Firebase 승인 도메인에 없습니다. 설정 안내의 5단계를 확인하세요.';
  if(c.includes('permission-denied')) return '저장 권한이 없습니다. Firestore 보안 규칙(설정 안내 3단계)을 확인하세요.';
  return '처리하지 못했습니다. 잠시 후 다시 시도하세요. ('+(c||'unknown')+')';
}
async function fbLoadSave(user,id){
  const ref=Store.fb.fs.collection('saves').doc(user.uid);
  const snap=await ref.get();
  if(snap.exists) return {id:snap.data().id||id,uid:user.uid,save:snap.data().save,created:snap.data().created};
  const acct={id,uid:user.uid,save:freshSave(),created:Date.now()};
  await ref.set({id,save:acct.save,created:acct.created,updated:Date.now()});
  return acct;
}

  if(!ID_RE.test(id)) throw new Error('아이디는 영문, 숫자, 밑줄(_)로 3~16자여야 합니다.');
  if(pw.length<Store.minPw) throw new Error(`비밀번호는 ${Store.minPw}자 이상이어야 합니다.`);
  if(Store.mode==='firebase'){
    let cred; try{ cred=await Store.fb.auth.createUserWithEmailAndPassword(Store.key(id)+FB_DOMAIN,pw); }catch(e){ throw new Error(fbError(e)); }
    const carry=guest?save:freshSave(), created=Date.now();
    try{ await Store.fb.fs.collection('saves').doc(cred.user.uid).set({id,save:JSON.parse(JSON.stringify(carry)),created,updated:created}); }catch(e){ throw new Error(fbError(e)); }
    return {id,uid:cred.user.uid,save:carry,created};
  }
  if(await Store.get(id)) throw new Error('이미 사용 중인 아이디입니다. 다른 아이디를 입력하세요.');
  const salt=randHex(12), hash=await hashPw(pw,salt);
  const carry=guest?save:freshSave();
  const acct={id,salt,hash,save:carry,created:Date.now(),updated:Date.now()};
  await Store.put(id,acct);
  return acct;
}
async function login(id,pw){
  if(!ID_RE.test(id)) throw new Error('아이디 형식이 맞지 않습니다.');
  if(Store.mode==='firebase'){
    let cred; try{ cred=await Store.fb.auth.signInWithEmailAndPassword(Store.key(id)+FB_DOMAIN,pw); }catch(e){ throw new Error(fbError(e)); }
    try{ return await fbLoadSave(cred.user,id); }catch(e){ throw new Error(fbError(e)); }
  }
  const acct=await Store.get(id);
  if(!acct) throw new Error('등록되지 않은 아이디입니다. 계정 만들기를 눌러 주세요.');
  if(await hashPw(pw,acct.salt)!==acct.hash) throw new Error('비밀번호가 맞지 않습니다.');
  return acct;
}
function useAccount(acct){
  session={id:acct.id,uid:acct.uid,salt:acct.salt,hash:acct.hash,created:acct.created};
  save=normalizeSave(acct.save);
  guest=false; testMode=false;
  try{localStorage.setItem('jogong_last_id',acct.id)}catch(e){}
}
function normalizeSave(s){
  const d=Object.assign(freshSave(),s||{});
  if(!Array.isArray(d.inv)||!d.inv.length){d.inv=[{uid:'w1',type:'scrap',plus:0}]; d.equip={weapon:'w1'};}
  d.inv=d.inv.filter(it=>WEAPON[it.type]);
  if(!d.inv.find(it=>it.uid===d.equip.weapon)) d.equip.weapon=d.inv[0]?d.inv[0].uid:null;
  if(!s||!s.v||s.v<3){ // v2(최대 레벨 100) → v3(최대 레벨 300): 레벨을 3배로 옮기고 스킬은 포인트로 돌려줌
    d.v=3; d.level=clamp(Math.round((d.level||1)*3)-2,1,CFG.MAX_LEVEL); d.xp=0; d.skills={}; d.sp=d.level-1;
  }
  for(const k in d.skills) if(!SKILL[k]){ d.sp+=d.skills[k]; delete d.skills[k]; }
  for(const k in d.skills) if(d.skills[k]>SKILL[k].max){ d.sp+=d.skills[k]-SKILL[k].max; d.skills[k]=SKILL[k].max; }
  return d;
}

let saving=false, pendingSave=false, lastSaved=0, saveError='';
function persist(){
  if(!session||testMode||guest) return;
  pendingSave=true; flushSave();
}
async function flushSave(){
  if(saving) return; saving=true;
  while(pendingSave){
    pendingSave=false;
    const snapshot=JSON.parse(JSON.stringify(save));
    try{
      if(Store.mode==='firebase'&&session.uid) await Store.fb.fs.collection('saves').doc(session.uid).set({id:session.id,save:snapshot,created:session.created||Date.now(),updated:Date.now()});
      else await Store.put(session.id,{id:session.id,salt:session.salt,hash:session.hash,created:session.created||Date.now(),updated:Date.now(),save:snapshot});
      lastSaved=Date.now(); saveError=''; }
    catch(e){ saveError=(e&&e.code==='quota_exceeded')?'저장 공간이 가득 찼습니다.':'저장하지 못했습니다. 잠시 후 다시 시도합니다.'; await sleep(3000); pendingSave=true; if(e&&(e.code==='revoked'||e.code==='invalid_argument'||e.code==='not_granted')){Store.mode='local'; saveError='온라인 저장 권한이 없어 이 브라우저에 저장합니다.';} }
    if(typeof updateSaveInfo==='function') updateSaveInfo();
  }
  saving=false;
}

/* =====================================================================
   7. 능력치 계산
   ===================================================================== */
/* 세이브 코드: 다른 기기·사이트로 진행을 옮기기 위한 문자열 (JOGONG3-본문-검사값) */
function codeSum(str){ let h=7; for(let i=0;i<str.length;i++) h=(Math.imul(h,31)+str.charCodeAt(i))|0; return (h>>>0).toString(36); }
function exportCode(){ const b=btoa(unescape(encodeURIComponent(JSON.stringify(save)))); return `JOGONG3-${b}-${codeSum(b)}`; }
function importCode(code){
  code=String(code||'').replace(/\s+/g,'');
  const m=code.match(/^JOGONG\d-([A-Za-z0-9+/=]+)-([a-z0-9]+)$/);
  if(!m) throw new Error('세이브 코드 형식이 아닙니다. JOGONG3- 로 시작하는 코드를 통째로 붙여넣으세요.');
  if(codeSum(m[1])!==m[2]) throw new Error('코드 일부가 잘렸거나 바뀌었습니다. 처음부터 끝까지 다시 복사해 주세요.');
  let d; try{ d=JSON.parse(decodeURIComponent(escape(atob(m[1])))); }catch(e){ throw new Error('코드를 읽을 수 없습니다. 다시 복사해 주세요.'); }
  if(!d||typeof d!=='object'||!d.level||!Array.isArray(d.inv)) throw new Error('올바른 세이브 데이터가 아닙니다.');
  return normalizeSave(d);
}
function rankBonus(){ let dmg=0,hp=0; for(let i=1;i<=save.rank;i++){dmg+=RANKS[i].bonus.dmg; hp+=RANKS[i].bonus.hp;} return {dmg,hp}; }
function equipped(){ return save.inv.find(it=>it.uid===save.equip.weapon)||{uid:'_',type:'scrap',plus:0}; }
function stats(){
  const lv=save.level, rb=rankBonus(), w=equipped(), wd=WEAPON[w.type];
  const B=(typeof run!=='undefined'&&run&&run.boons)||{}, bn=k=>B[k]||0;
  const base=CFG.BASE_DMG*(1+CFG.DMG_PER_LEVEL*(lv-1))*(1+rb.dmg);
  const dmg=base*wCoef(w)*(1+.03*sk('a1'))*(1+.2*bn('dmg'));
  return {
    weapon:w, wdef:wd, dmg,
    magicDmg:dmg*wMagic(w)*(1+.05*sk('g1'))*(1+.4*bn('magic')),
    cd:CFG.BASE_COOLDOWN/((1+.03*sk('a2'))*(1+.2*bn('rate'))),
    count:1+sk('a3')+bn('count'), volley:.04*sk('a7'),
    pierce:CFG.BASE_PIERCE+sk('a4')+bn('pierce'), crit:.03*sk('a5'), critMul:2+.15*sk('a6'),
    range:CFG.BASE_RANGE*(1+.04*sk('r1'))*(1+.2*bn('range')),
    shotSpeed:CFG.SHOT_SPEED*(1+.05*sk('r2')),
    orbit:sk('r3')+bn('orbit'), orbitMul:1.0*(1+.15*sk('r4')), orbitSpd:3.2*(1+.06*sk('r4')),
    knock:5+4*sk('r5'),
    elemDur:1+.1*sk('g2'), extraTargets:sk('g3'), shock:sk('g4'), bolt:sk('g5'),
    maxHp:Math.round((CFG.BASE_HP+CFG.HP_PER_LEVEL*(lv-1)+rb.hp)*(1+.03*sk('s1'))*(1+.15*bn('heal'))),
    regen:.001*sk('s2'), armor:.02*sk('s3'), revive:sk('s4'), lifeOnKill:.0015*sk('s5'), shield:sk('s6'),
    speed:CFG.PLAYER_SPEED*(1+.025*sk('m1'))*(1+.15*bn('speed')), iframe:CFG.IFRAME+.05*sk('m2'),
    dodge:.02*sk('m3'), aura:.03*sk('m4'),
    goldMul:(1+.1*sk('f1'))*(1+.5*bn('gold')), dropMul:1+.15*sk('f2'), crateMul:1+.15*sk('f4'),
    xpMul:1+.02*sk('f3'), bonusGold:1+.1*sk('f5'),
  };
}
function skillUnlocked(s){ if(!s.req) return true; return sk(s.req[0])>=s.req[1]; }
function canLearn(s){ return save.sp>0&&sk(s.id)<s.max&&skillUnlocked(s); }
function learnSkill(id){ const s=SKILL[id]; if(!s||!canLearn(s)) return false; save.skills[id]=sk(id)+1; save.sp--; return true; }
function resetSkills(){ let n=0; for(const k in save.skills) n+=save.skills[k]; save.skills={}; save.sp+=n; }
function meetsRank(r){ return save.level>=r.minLevel&&save.maxCleared>=r.minStage&&r.conditions.every(c=>c.check(save)); }
function checkPromotion(){ const got=[]; while(save.rank<RANKS.length-1&&meetsRank(RANKS[save.rank+1])){save.rank++; got.push(save.rank);} return got; }
function addWeapon(type,plus){
  if(save.inv.length>=CFG.INVENTORY_MAX) return null;
  const it={uid:'w'+(save.nextUid++),type,plus:plus||0}; save.inv.push(it); return it;
}
const tierIdx=type=>WEAPONS.findIndex(w=>w.id===type);
/* 정리 대상: 장착 무기보다 낮은 등급이거나, 같은 종류인데 강화 수치가 같거나 낮은 무기 (장착 중인 무기는 제외) */
function isJunk(it,eq){ eq=eq||equipped(); if(it.uid===eq.uid) return false;
  return tierIdx(it.type)<tierIdx(eq.type)||(it.type===eq.type&&it.plus<=eq.plus); }
function junkItems(){ const eq=equipped(); return save.inv.filter(it=>isJunk(it,eq)); }
/* 착용 가능한 무기 중 가장 좋은 것 (등급 → 강화 순). 장착 무기보다 좋을 때만 돌려준다 */
function betterWeapon(){ const eq=equipped(); const b=save.inv.filter(it=>WEAPON[it.type].req<=save.level).sort((a,c)=>tierIdx(c.type)-tierIdx(a.type)||c.plus-a.plus)[0];
  return b&&b.uid!==eq.uid&&(tierIdx(b.type)>tierIdx(eq.type)||(b.type===eq.type&&b.plus>eq.plus))?b:null; }
function sellItems(list){ let g=0; const ids=new Set(list.map(i=>i.uid)); for(const it of list) g+=sellPrice(it); save.inv=save.inv.filter(i=>!ids.has(i.uid)); save.gold+=g; return g; }
function rollWeaponType(stage){
  const el=WEAPONS.filter(w=>w.req<=Math.max(save.level,stage*CFG.EXPECTED_LV_PER_STAGE)+15);
  if(Math.random()<.55) return el[el.length-1].id;
  return el[Math.floor(Math.random()*el.length)].id;
}

/* =====================================================================
   8. 그림 — 어류 스프라이트, 홍어, 작업자, 파이프, 심해 배경
   ===================================================================== */
const SPR=2, FRAMES=8;
const spriteCache=new Map();

function bodyPath(c,L,H,f){
  const hb=H*(f.hump||1), sn=f.snout?1:0;
  c.beginPath();
  c.moveTo(L,H*.06);
  c.bezierCurveTo(L*(.95-sn*.05),-hb*(.5-sn*.15),L*.45,-hb*1.02,-L*.1,-hb*.94);
  c.bezierCurveTo(-L*.5,-hb*.78,-L*.76,-H*.32,-L*.9,-H*.15);
  c.lineTo(-L*.9,H*.15);
  c.bezierCurveTo(-L*.74,H*.36,-L*.45,H*.86,-L*.05,H*.9);
  c.bezierCurveTo(L*.45,H*.92,L*.9,H*.5,L,H*.06);
  c.closePath();
}
function paintFish(c,f,ph){
  if(f.kind==='plankton') return paintPlankton(c,f,ph);
  if(f.kind==='flat') return paintFlatfish(c,f,ph);
  const r=f.r, L=r*f.len, H=r*f.ht, hb=H*(f.hump||1), sw=Math.sin(ph);
  // 꼬리
  c.save(); c.translate(-L*.88,0); c.rotate(sw*.3);
  const tg=c.createLinearGradient(0,0,-L*.45,0); tg.addColorStop(0,f.tailColor||f.back); tg.addColorStop(1,f.fin);
  c.fillStyle=tg; c.beginPath();
  if(f.tail==='crescent'){c.moveTo(0,-H*.12); c.quadraticCurveTo(-L*.18,-H*.4,-L*.42,-H*1.2); c.quadraticCurveTo(-L*.3,-H*.25,-L*.22,0); c.quadraticCurveTo(-L*.3,H*.25,-L*.42,H*1.2); c.quadraticCurveTo(-L*.18,H*.4,0,H*.12);}
  else if(f.tail==='round'){c.moveTo(0,-H*.22); c.quadraticCurveTo(-L*.42,-H*.95,-L*.44,0); c.quadraticCurveTo(-L*.42,H*.95,0,H*.22);}
  else {c.moveTo(0,-H*.16); c.lineTo(-L*.4,-H*.95); c.quadraticCurveTo(-L*.3,-H*.25,-L*.22,0); c.quadraticCurveTo(-L*.3,H*.25,-L*.4,H*.95); c.lineTo(0,H*.16);}
  c.closePath(); c.fill();
  c.strokeStyle='rgba(0,0,0,.18)'; c.lineWidth=.5;
  for(let i=-3;i<=3;i++){c.beginPath(); c.moveTo(0,i*H*.04); c.lineTo(-L*.36,i*H*.28); c.stroke();}
  c.restore();
  // 등지느러미
  c.fillStyle=f.fin; c.globalAlpha=.9; c.beginPath();
  if(f.spiny){
    c.moveTo(-L*.5,-hb*.82);
    for(let i=0;i<=7;i++){const x=-L*.45+i*L*.11; c.lineTo(x+L*.03,-hb*(1.32+(i%2)*.06-i*.015)); c.lineTo(x+L*.06,-hb*.95);}
    c.lineTo(L*.35,-hb*.9);
  }else if(f.tail==='crescent'){
    c.moveTo(-L*.05,-hb*.95); c.quadraticCurveTo(L*.05,-hb*1.6,L*.22,-hb*.92);
    c.moveTo(-L*.42,-hb*.72); c.quadraticCurveTo(-L*.38,-hb*1.2,-L*.28,-hb*.78);
  }else{
    c.moveTo(-L*.38,-hb*.82); c.quadraticCurveTo(-L*.12,-hb*1.45,L*.18,-hb*.92);
  }
  c.fill();
  if(f.adipose){c.beginPath(); c.ellipse(-L*.62,-H*.42,L*.06,H*.16,0,0,TAU); c.fill();}
  // 뒷지느러미·배지느러미
  c.beginPath(); c.moveTo(-L*.42,H*.66); c.quadraticCurveTo(-L*.36,H*1.12,-L*.18,H*.82); c.fill();
  c.beginPath(); c.moveTo(L*.1,H*.85); c.quadraticCurveTo(L*.05,H*1.25,-L*.06,H*.88); c.fill();
  c.globalAlpha=1;
  if(f.finlets){c.fillStyle=f.finlets; for(let i=0;i<5;i++){const x=-L*.42-i*L*.09; c.beginPath(); c.moveTo(x,-H*.42+i*H*.05); c.lineTo(x-L*.035,-H*.62+i*H*.06); c.lineTo(x-L*.07,-H*.38+i*H*.05); c.fill(); c.beginPath(); c.moveTo(x,H*.42-i*H*.05); c.lineTo(x-L*.035,H*.6-i*H*.06); c.lineTo(x-L*.07,H*.38-i*H*.05); c.fill();}}
  // 몸통 (역그림자: 등은 어둡고 배는 밝게)
  bodyPath(c,L,H,f);
  const g=c.createLinearGradient(0,-hb,0,H); g.addColorStop(0,f.back); g.addColorStop(.42,f.mid); g.addColorStop(.62,f.belly); g.addColorStop(1,f.belly);
  c.fillStyle=g; c.fill();
  c.save(); c.clip();
  const pr=rng(f.r*977+f.id.length);
  switch(f.pattern){
    case 'silver': {const sg=c.createLinearGradient(0,-H*.2,0,H*.12); sg.addColorStop(0,'rgba(255,255,255,0)'); sg.addColorStop(.5,'rgba(220,240,255,.75)'); sg.addColorStop(1,'rgba(255,255,255,0)'); c.fillStyle=sg; c.fillRect(-L,-H*.2,L*2,H*.32); break;}
    case 'blotch': c.fillStyle=f.mark; c.globalAlpha=.7; for(let i=0;i<9;i++){c.beginPath(); c.ellipse(L*.45-i*L*.16,-H*.02+(pr()-.5)*H*.15,L*.1,H*.17,pr(),0,TAU); c.fill();} break;
    case 'wave': c.strokeStyle=f.mark; c.lineWidth=Math.max(1,r*.07); for(let i=0;i<9;i++){const x=-L*.75+i*L*.18; c.beginPath(); c.moveTo(x,-hb); for(let k=1;k<=4;k++) c.lineTo(x+(k%2?L*.07:-L*.02),-hb+k*hb*.2); c.stroke();} break;
    case 'spots': c.fillStyle=f.blush; c.globalAlpha=.35; c.fillRect(-L,-H*.05,L*2,H*.3); c.globalAlpha=1; c.fillStyle=f.mark; for(let i=0;i<22;i++){c.beginPath(); c.arc(-L*.8+pr()*L*1.5,-hb*.85+pr()*hb*.7,Math.max(.7,r*.035),0,TAU); c.fill();} break;
    case 'mottle': for(let i=0;i<16;i++){c.fillStyle=pr()<.6?f.mark:'rgba(150,140,125,.5)'; c.globalAlpha=.55; c.beginPath(); c.ellipse(-L*.8+pr()*L*1.6,-hb+pr()*H*1.6,r*(.08+pr()*.12),r*(.06+pr()*.08),pr()*3,0,TAU); c.fill();} break;
    case 'dots': c.fillStyle=f.mark; for(let i=0;i<26;i++){c.globalAlpha=.85; c.beginPath(); c.arc(-L*.75+pr()*L*1.45,-hb*.9+pr()*hb*.95,Math.max(.6,r*.03),0,TAU); c.fill();} break;
    case 'stripe': {const yg=c.createLinearGradient(0,-H*.18,0,H*.06); yg.addColorStop(0,'rgba(242,201,53,0)'); yg.addColorStop(.5,f.mark); yg.addColorStop(1,'rgba(242,201,53,0)'); c.fillStyle=yg; c.fillRect(-L,-H*.18,L*2,H*.24); break;}
    case 'bars': c.fillStyle=f.mark; c.globalAlpha=.25; for(let i=0;i<10;i++){c.fillRect(-L*.7+i*L*.14,H*.15,L*.035,H*.7);} break;
  }
  c.globalAlpha=.07; c.strokeStyle='#fff'; c.lineWidth=.5;
  for(let y=-hb;y<H;y+=r*.16) for(let x=-L;x<L;x+=r*.16){c.beginPath(); c.arc(x+((y/r*6|0)%2)*r*.08,y,r*.08,Math.PI*.15,Math.PI*.85); c.stroke();}
  c.globalAlpha=.35; c.strokeStyle=f.belly; c.lineWidth=.7; c.beginPath(); c.moveTo(L*.4,-H*.25); c.quadraticCurveTo(0,-H*.32,-L*.85,-H*.02); c.stroke();
  c.globalAlpha=1; c.restore();
  bodyPath(c,L,H,f); c.lineWidth=1; c.strokeStyle='rgba(0,0,0,.45)'; c.stroke();
  c.strokeStyle='rgba(255,255,255,.18)'; c.beginPath(); c.moveTo(L*.6,-hb*.62); c.quadraticCurveTo(L*.1,-hb*.98,-L*.4,-hb*.78); c.stroke();
  // 아가미, 가슴지느러미
  c.strokeStyle='rgba(0,0,0,.35)'; c.lineWidth=1; c.beginPath(); c.arc(L*.3,0,H*.66,-1.0,1.0); c.stroke();
  c.save(); c.translate(L*.18,H*.22); c.rotate(.5+sw*.15); c.fillStyle=f.fin; c.globalAlpha=.6; c.beginPath(); c.ellipse(-L*.12,0,L*.16,H*.12,0,0,TAU); c.fill(); c.restore();
  // 입
  c.strokeStyle='rgba(0,0,0,.55)'; c.lineWidth=1; c.beginPath(); c.moveTo(L*.99,H*.08); c.lineTo(L*(f.bigMouth?.72:.86),H*(f.bigMouth?.2:.14)); c.stroke();
  // 눈
  const er=Math.max(1.8,r*(f.bigEye?.17:.13)), ex=L*.62, ey=-H*.2;
  c.fillStyle=f.iris||'#d8d2b8'; c.beginPath(); c.arc(ex,ey,er,0,TAU); c.fill();
  c.fillStyle='#0a0a0a'; c.beginPath(); c.arc(ex+er*.12,ey,er*.62,0,TAU); c.fill();
  c.fillStyle='rgba(255,255,255,.9)'; c.beginPath(); c.arc(ex-er*.15,ey-er*.3,er*.22,0,TAU); c.fill();
}
function paintPlankton(c,f,ph){
  const r=f.r, a=Math.sin(ph);
  const gl=c.createRadialGradient(0,0,0,0,0,r*2.2); gl.addColorStop(0,'rgba(127,227,212,.35)'); gl.addColorStop(1,'rgba(127,227,212,0)');
  c.fillStyle=gl; c.beginPath(); c.arc(0,0,r*2.2,0,TAU); c.fill();
  c.strokeStyle='rgba(190,255,240,.75)'; c.lineWidth=.8;
  for(const s of [-1,1]){c.beginPath(); c.moveTo(r*.7,s*r*.2); c.bezierCurveTo(r*1.1,s*r*(.9+a*.2),r*.2,s*r*1.6,-r*(.9+a*.15),s*r*(1.5+a*.2)); c.stroke();}
  const bg=c.createLinearGradient(0,-r*.6,0,r*.6); bg.addColorStop(0,'rgba(170,250,235,.75)'); bg.addColorStop(1,'rgba(80,190,180,.55)');
  c.fillStyle=bg; c.beginPath(); c.moveTo(r*.85,0); c.bezierCurveTo(r*.8,-r*.65,-r*.3,-r*.62,-r*.6,-r*.2); c.lineTo(-r*.6,r*.2); c.bezierCurveTo(-r*.3,r*.62,r*.8,r*.65,r*.85,0); c.fill();
  c.strokeStyle='rgba(40,130,130,.5)'; c.lineWidth=.6; for(let i=0;i<4;i++){c.beginPath(); c.moveTo(r*.45-i*r*.25,-r*.5); c.lineTo(r*.45-i*r*.25,r*.5); c.stroke();}

/* ---------- 심해 배경: 높이맵 지형 + 조명 계산 (입체감) ---------- */

// 값 노이즈 (월드 좌표 기준이라 타일 경계가 이어짐)

  c.restore();

    const g=c.createLinearGradient(0,-12,0,12); g.addColorStop(0,'#a07a58'); g.addColorStop(.35,'#7a5638'); g.addColorStop(.7,'#4a3020'); g.addColorStop(1,'#24170f'); c.fillStyle=g; rr(c,-62,-12,124,24,6); c.fill();
    c.shadowColor='transparent';
    c.fillStyle='rgba(170,80,30,.55)'; c.fillRect(-30,-12,25,24); c.fillRect(22,-5,18,15);
    const fl=c.createLinearGradient(0,-16,0,16); fl.addColorStop(0,'#6a4a35'); fl.addColorStop(1,'#2a1c13'); c.fillStyle=fl; c.fillRect(-66,-16,8,32); c.fillRect(58,-16,8,32);
    c.fillStyle='#120c08'; c.beginPath(); c.ellipse(66,0,3,11,0,0,TAU); c.fill();
    c.fillStyle='rgba(120,160,140,.4)'; for(let i=0;i<10;i++){c.beginPath(); c.arc(-50+R()*100,-10+R()*20,1.5+R()*3,0,TAU); c.fill();}
    c.fillStyle='rgba(255,255,255,.12)'; c.fillRect(-58,-8,116,3);
    c.fillStyle='rgba(78,92,86,.85)'; c.beginPath(); c.ellipse(-10,12,48,7,0,0,Math.PI); c.fill(); // 모래에 묻힌 아랫부분
  }else if(roll<.27){ // 공사용 라바콘

  }else if(roll<.62){ // 불가사리
    const x=80+R()*350,y=80+R()*350,rot=R()*TAU; c.shadowBlur=2; c.shadowOffsetX=1.2; c.shadowOffsetY=1.6;
    const g=c.createRadialGradient(x-3,y-3,1,x,y,26); g.addColorStop(0,'#f0a07c'); g.addColorStop(1,'#a0482c'); c.fillStyle=g; c.beginPath();

    for(let i=0;i<4;i++){const x=R()*TILE,y=R()*TILE; c.fillStyle='rgba(0,0,0,.4)'; c.fillRect(x+1.5,y+2,5,5); const g=c.createLinearGradient(x,y,x+5,y+5); g.addColorStop(0,'#9aa2a6'); g.addColorStop(1,'#3e4448'); c.fillStyle=g; c.fillRect(x,y,5,5); c.fillStyle='#2a2e31'; c.beginPath(); c.arc(x+2.5,y+2.5,1.2,0,TAU); c.fill();}}

/* 일렁이는 빛 무늬(코스틱): 반복되는 셀 노이즈 텍스처 하나를 두 겹으로 흘려서 그림 */
let causticPat=null;
function buildCaustics(){
  const N=256, cv2=document.createElement('canvas'); cv2.width=cv2.height=N; const c=cv2.getContext('2d'), img=c.createImageData(N,N), D=img.data;
  const G=7, R=rng(9173), pts=[]; for(let j=0;j<G;j++)for(let i=0;i<G;i++) pts.push([(i+R())/G,(j+R())/G]);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const u=x/N, v=y/N; let f1=9,f2=9;
    const ci=Math.floor(u*G), cj=Math.floor(v*G);
    for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){ const cx2=ci+di, cy2=cj+dj, ii=((cx2%G)+G)%G, jj=((cy2%G)+G)%G, p=pts[jj*G+ii];
      const d=Math.hypot(u-(p[0]+(cx2-ii)/G),v-(p[1]+(cy2-jj)/G));
      if(d<f1){f2=f1; f1=d;} else if(d<f2) f2=d; }
    const e=f2-f1, k=Math.max(0,1-e*G*3.4), a=Math.pow(k,3);
    const o=(y*N+x)*4; D[o]=170; D[o+1]=235; D[o+2]=255; D[o+3]=Math.round(a*255);
  }
  c.putImageData(img,0,0); return cv2;
}
function drawCaustics(cx,cy,time){
  if(!causticPat){ causticPat=ctx.createPattern(buildCaustics(),'repeat'); }
  const z=V.zoom, hw=V.w/2/z, hh=V.h/2/z, x0=cx-hw, y0=cy-hh;
  ctx.save(); ctx.globalCompositeOperation='lighter';
  const tm=reduceMotion?0:time;
  for(const L of [{sc:1.85,vx:7,vy:9,a:.11}]){ // 한 겹만 흘려서 성능 확보
    ctx.globalAlpha=L.a*(.85+.15*Math.sin(tm*.9+L.sc));
    ctx.save(); const ox=tm*L.vx, oy=tm*L.vy; ctx.scale(L.sc,L.sc); ctx.translate(ox,oy);
    ctx.fillStyle=causticPat; ctx.fillRect(x0/L.sc-ox,y0/L.sc-oy,hw*2/L.sc,hh*2/L.sc); ctx.restore();
  }
  ctx.restore(); ctx.globalAlpha=1;
}

const wrap=$('#wrap'), cv=$('#cv'), ctx=cv.getContext('2d');
const V={w:1,h:1,dpr:1,zoom:1};
let dark=null;
function resize(){
  const r=wrap.getBoundingClientRect();
  V.w=Math.max(1,r.width); V.h=Math.max(1,r.height);
  V.dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(V.w*V.dpr); cv.height=Math.round(V.h*V.dpr);
  V.zoom=clamp(Math.min(V.w,V.h)/760,.62,1.15);
  const m=Math.min(V.w,V.h);
  dark=ctx.createRadialGradient(V.w/2,V.h/2,m*.22,V.w/2,V.h/2,Math.hypot(V.w,V.h)*.62);
  dark.addColorStop(0,'rgba(1,5,12,0)'); dark.addColorStop(.45,'rgba(1,5,12,.22)'); dark.addColorStop(1,'rgba(1,5,12,.7)');
  initSnow();
}
const snow=[];
function initSnow(){snow.length=0; const n=Math.round(V.w*V.h/9000); for(let i=0;i<n;i++) snow.push({x:Math.random(),y:Math.random(),z:rand(.35,1.25),s:rand(.6,1.8),ph:rand(0,TAU)});}

const keys=new Set();
window.addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT') return;
  const k=e.key.toLowerCase();
  if(state==='play'&&['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  keys.add(k);
  if((k==='escape'||k==='p')&&(state==='play'||state==='pause')) togglePause();
  if(state==='boon'&&['1','2','3'].includes(k)){const b=document.querySelectorAll('#boonBody .card')[+k-1]; if(b) b.click();}
});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));

const joy={id:null,ox:0,oy:0,x:0,y:0};
cv.addEventListener('pointerdown',e=>{ if(state!=='play'||joy.id!==null) return; joy.id=e.pointerId; joy.ox=joy.x=e.clientX; joy.oy=joy.y=e.clientY; try{cv.setPointerCapture(e.pointerId)}catch(_){} });
cv.addEventListener('pointermove',e=>{ if(e.pointerId===joy.id){joy.x=e.clientX; joy.y=e.clientY;} });

    const before=ST.maxHp; ST=stats(); P.hp=Math.min(ST.maxHp,P.hp+(ST.maxHp-before));

function dropWeapon(x,y){
  const type=rollWeaponType(run.stage);
  if(save.inv.length>=CFG.INVENTORY_MAX){ // 가방이 가득 차면 하위 무기를 자동으로 팔아 자리를 만든다
    const nw={uid:'_new',type,plus:0};
    if(isJunk(nw)){ const g=sellPrice(nw); save.gold+=g; run.goldEarned+=g; floater(x,y-30,`${WEAPON[type].name} → +${fmt(g)} G`,'#ffd84a',16); toast('하위 무기 자동 판매',`인벤토리가 가득 차 ${WEAPON[type].name}을(를) ${fmt(g)}G에 팔았습니다.`,'#ffd84a'); return; }
    const junk=junkItems().sort((a,b)=>sellPrice(a)-sellPrice(b))[0];
    if(junk){ const g=sellItems([junk]); run.goldEarned+=g; toast('하위 무기 자동 판매',`${WEAPON[junk.type].name} +${junk.plus}을(를) ${fmt(g)}G에 팔고 자리를 만들었습니다.`,'#ffd84a'); }
  }
  const it=addWeapon(type,0);
  if(!it){toast('인벤토리가 가득 찼습니다',`${WEAPON[type].name}을(를) 놓쳤습니다. 사무소에서 정리하세요.`,'#ff9d84'); return;}
  run.weaponsFound.push(it); SND.play('weapon');
  floater(x,y-30,WEAPON[type].name,WEAPON[type].color,18);
  toast(`무기 획득 · ${WEAPON[type].name}`,`착용 레벨 ${WEAPON[type].req} · 인벤토리에 보관됨`,WEAPON[type].color,it);
}

function killEnemy(e){
  if(e.dead) return;
  e.dead=true; run.kills++; save.totalKills++;
  if(!SIM.on) burst(e.x,e.y,e.boss?'#ffd2dc':'#bfefff',e.boss?40:6,e.r);
  // 처치 연출: 물고기가 하얗게 번쩍이며 부풀었다 사라지는 잔상 (뱀서류의 '터지는' 처치감), 보스·정예는 짧은 슬로 모션
  if(!SIM.on){
    if(!e.boss&&run.fx.length<240) run.fx.push({type:'corpse',x:e.x,y:e.y,f:e.f,ang:e.ang,sc:e.r/e.f.r,fr:Math.floor((e.wob/TAU*FRAMES)%FRAMES+FRAMES)%FRAMES,t:0,life:e.elite?.32:.2});
    if(!reduceMotion&&(e.boss||e.elite)) run.slowmo=Math.max(run.slowmo||0,e.boss?1.1:.18);
  }
  SND.play(e.boss?'bossDie':e.elite?'eliteDie':'kill');
  if(e.boss){
    save.bossKills++;
    gainXp(Math.round(e.xp*ST.xpMul));
    run.fx.push({type:'chest',x:e.x,y:e.y,t:0,life:2.4});
    addGold(Math.round(e.def.gold*ST.goldMul*ST.bonusGold),e.x,e.y,36);
    if(Math.random()<CFG.BOSS_WEAPON_DROP*ST.dropMul) dropWeapon(e.x,e.y);
    run.ending=true; run.endT=2.6;
    for(const o of run.enemies) if(!o.dead){o.dead=true; if(!SIM.on) burst(o.x,o.y,'#bfefff',3,o.r);}
    run.shake=reduceMotion?0:14;
    return;
  }
  gainXp(e.xp*ST.xpMul);
  if(!SIM.on&&run.fx.length<260) run.fx.push({type:'xp',x:e.x,y:e.y,t:0,life:.5,sx:e.x,sy:e.y});
  if(ST.lifeOnKill>0) P.hp=Math.min(ST.maxHp,P.hp+ST.maxHp*ST.lifeOnKill);
  run.combo++; run.comboT=2; run.bestCombo=Math.max(run.bestCombo,run.combo);
  if(run.combo%50===0){ const bonus=Math.round(run.combo/20*(1+run.tier*CFG.GOLD_TIER_MUL)*ST.goldMul); SND.play('combo'); addGold(bonus,P.x,P.y-40,6); toast(`${run.combo} 콤보!`,`연속 처치 보너스 +${fmt(bonus)}G`,'#ff9d5c'); }
  const g=e.f.gold, tier=run.tier+1, gt=1+run.tier*CFG.GOLD_TIER_MUL;
  if(e.elite){
    run.elitesKilled++; dropChest(e.x,e.y);
    addGold(Math.round(20*Math.pow(tier,1.3)*ST.goldMul*ST.bonusGold),e.x,e.y,12);
    if(Math.random()<CFG.ELITE_WEAPON_DROP*ST.dropMul) dropWeapon(e.x,e.y);
    if(!SIM.on) burst(e.x,e.y,'#ffd84a',18,e.r);
    return;
  }
  if(Math.random()<g.p*(1+.1*sk('f1'))) addGold(Math.round((g.a[0]+Math.floor(Math.random()*(g.a[1]-g.a[0]+1)))*gt*(1+.5*(run.boons.gold||0))),e.x,e.y,1);
  if(Math.random()<CFG.WEAPON_DROP*ST.dropMul) dropWeapon(e.x,e.y);
}
function burst(x,y,color,n,r){
  for(let i=0;i<n;i++){const a=rand(0,TAU),s=rand(30,140); run.fx.push({type:'bub',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-20,r:rand(1.5,3.5)+r*.06,t:0,life:rand(.4,.8),color});}
}

function nearestK(k,range,x,y,exclude){
  const best=[], r2=range*range; x=x??P.x; y=y??P.y;
  for(const e of run.enemies){
    if(e.dead||(exclude&&exclude.has(e))) continue;
    const d=(e.x-x)**2+(e.y-y)**2; if(d>r2) continue;
    if(best.length<k){best.push([d,e]); best.sort((a,b)=>a[0]-b[0]);}
    else if(d<best[k-1][0]){best[k-1]=[d,e]; best.sort((a,b)=>a[0]-b[0]);}
  }
  return best.map(b=>b[1]);
}
function fire(){
  let targets=nearestK(ST.count,ST.range);
  const b=run.bossRef; // 보스가 범위 안에 있으면 첫 파이프는 보스를 노림
  if(b&&!b.dead&&(b.x-P.x)**2+(b.y-P.y)**2<(ST.range+b.r*.6)**2){ targets=[b,...targets.filter(t=>t!==b)].slice(0,Math.max(1,ST.count)); }
  if(!targets.length) return false;
  const life=ST.range*1.3/ST.shotSpeed;
  run.throwN++; const shockShot=ST.shock>0&&run.throwN%6===0;
  const n=ST.count+(Math.random()<ST.volley?ST.count:0);
  for(let i=0;i<n;i++){
    const t=targets[i%targets.length];
    let a=Math.atan2(t.y-P.y,t.x-P.x);
    if(i>=targets.length) a+=Math.ceil((i-targets.length+1)/2)*.2*((i%2)?1:-1);
    run.shots.push({kind:'pipe',x:P.x,y:P.y-8,vx:Math.cos(a)*ST.shotSpeed,vy:Math.sin(a)*ST.shotSpeed,rot:rand(0,TAU),
      dmg:ST.dmg,pierce:ST.pierce,bounce:0,life,r:10,hit:new Set(),crit:Math.random()<ST.crit,trail:[],shock:shockShot&&i===0});
  }
  P.face=Math.cos(Math.atan2(targets[0].y-P.y,targets[0].x-P.x))>=0?1:-1;
  P.throwT=.18; SND.play('throw');
  return true;
}
function damage(e,d,crit,src){
  if(run&&run.dmg){ const k=src||'pipe'; run.dmg[k]=(run.dmg[k]||0)+Math.min(d,Math.max(0,e.hp)); }
  e.hp-=d; e.flash=.08;
  if(!SIM.on){
    if(crit) floater(e.x+rand(-6,6),e.y-e.r-8,fmt(d)+'!','#ffe066',e.boss?22:17,.7);
    else if(UIP.dmgNum&&d>=1&&src!=='lvl'&&run.floaters.length<(e.boss?110:80)){ // 일반 타격: 작고 짧게, 보스는 조금 크게
      const c=src==='magic'?'#bcd4ff':src==='orbit'?'#9fe2ff':src==='bolt'||src==='shock'?'#d6dcff':'#eef4f8';
      floater(e.x+rand(-e.r*.5,e.r*.5),e.y-e.r*.6-rand(0,8),fmt(d),c,e.boss?15:12,.5); }
  }
  if(e.hp<=0) killEnemy(e);
}
function enemiesNear(x,y,rad){
  const out=[], cx=Math.floor(x/64), cy=Math.floor(y/64), n=Math.ceil(rad/64);
  for(let ox=-n;ox<=n;ox++)for(let oy=-n;oy<=n;oy++){const cell=grid.get(gk(cx+ox,cy+oy)); if(!cell) continue; for(const e of cell) if(!e.dead&&(e.x-x)**2+(e.y-y)**2<(rad+e.r)**2) out.push(e);}
  const b=run.bossRef; if(b&&!b.dead&&(b.x-x)**2+(b.y-y)**2<(rad+b.r)**2) out.push(b);
  return out;
}
function onPipeHit(e,s){
  damage(e,s.crit?s.dmg*ST.critMul:s.dmg,s.crit,s.kind==='pipe'?'pipe':'magic'); SND.play(s.crit?'crit':'hit');
  if(!e.boss&&!e.elite&&!e.dead&&s.kind!=='shard'){const sp=Math.hypot(s.vx,s.vy)||1; e.x+=s.vx/sp*ST.knock; e.y+=s.vy/sp*ST.knock;}
  if(s.shock){ const r=60; for(const t of enemiesNear(e.x,e.y,r)) damage(t,ST.dmg*(.4+.1*ST.shock),false,'shock'); SND.play('shock'); if(!SIM.on) run.fx.push({type:'ring',x:e.x,y:e.y,t:0,life:.35,r,color:'#7f8cff'}); }
  if(s.kind!=='pipe') return;
  const m=ST.magicDmg;
  switch(ST.wdef.magic){
    case 'rust': e.dotDps=Math.max(e.dotDps,m); e.dotT=3*ST.elemDur; break;
    case 'shard': if(Math.random()<.25){const a0=Math.atan2(s.vy,s.vx), k=3+ST.extraTargets; for(let i=0;i<k;i++){const a=a0+(i-(k-1)/2)*.6+rand(-.2,.2); run.shots.push({kind:'shard',x:e.x,y:e.y,vx:Math.cos(a)*420,vy:Math.sin(a)*420,rot:a,dmg:m,pierce:0,bounce:0,life:.35,r:6,hit:new Set([e]),crit:false,trail:[]});}} break;
    case 'bounce': {const nx=nearestK(1,220,e.x,e.y,new Set([e]))[0]; if(nx){const a=Math.atan2(nx.y-e.y,nx.x-e.x); run.shots.push({kind:'bounce',x:e.x,y:e.y,vx:Math.cos(a)*460,vy:Math.sin(a)*460,rot:a,dmg:m,pierce:0,bounce:ST.extraTargets,life:.6,r:8,hit:new Set([e]),crit:false,trail:[]});}} break;
    case 'chain': {const ts=nearestK(2+ST.extraTargets,160,e.x,e.y,new Set([e])); if(ts.length) SND.play('zap'); for(const t of ts){damage(t,m,false,'magic'); if(!SIM.on) run.fx.push({type:'bolt',x1:e.x,y1:e.y,x2:t.x,y2:t.y,t:0,life:.18});}} break;
    case 'frost': if(!e.dead) {e.slowT=1.5*ST.elemDur;} damage(e,m,false,'magic'); break;
    case 'burst': {SND.play('boom'); for(const t of enemiesNear(e.x,e.y,80)) damage(t,m,false,'magic'); if(!SIM.on) run.fx.push({type:'boom',x:e.x,y:e.y,t:0,life:.45});} break;
  }
}
function hurtPlayer(dmg){
  if(P.inv>0||run.ending||run.dead) return;
  if(ST.dodge>0&&Math.random()<ST.dodge){ P.inv=.25; SND.play('dodge'); floater(P.x,P.y-40,'회피','#ffd24d',15); return; }
  if(P.shield){ P.shield=false; SND.play('shield'); P.shieldT=14-1.5*ST.shield; P.inv=.4; floater(P.x,P.y-40,'보호막','#9fe8ff',15); if(!SIM.on) run.fx.push({type:'ring',x:P.x,y:P.y,t:0,life:.3,r:40,color:'#9fe8ff'}); return; }
  dmg=Math.max(1,Math.round(dmg*(1-ST.armor)));
  P.hp-=dmg; P.inv=ST.iframe; SND.play('hurt');
  floater(P.x+rand(-10,10),P.y-34,`-${dmg}`,'#ff7a5a',15);
  run.shake=reduceMotion?0:6;
  if(P.hp<=0){
    if(ST.revive>0&&!run.revived){run.revived=true; SND.play('revive'); P.hp=ST.maxHp*(.2+.1*ST.revive); P.inv=2; floater(P.x,P.y-50,'불굴의 의지!','#5fd39a',22); if(!SIM.on) burst(P.x,P.y,'#5fd39a',24,16); return;}
    P.hp=0; run.dead=true; run.deadT=1; SND.play('die'); SND.mood('calm'); if(!SIM.on) burst(P.x,P.y,'#ffc21a',20,14);
  }
}

/* ---------- 봇 (자동 시뮬레이션용) ---------- */
function botInput(){
  // 사람처럼 플레이: 가까운 적은 피하고, 공격 범위 밖이면 다가가며 원을 그리듯 이동
  let fx=0,fy=0,near=null,nd=1e18;
  const danger=ST.range*.55;
  for(const e of run.enemies){
    const dx=P.x-e.x, dy=P.y-e.y, d2=dx*dx+dy*dy;
    if(d2<nd){nd=d2; near=e;}
    const lim=e.boss?(e.mode==='chase'?e.r+90:e.r+170):(danger+e.r); if(d2<lim*lim&&d2>1){const w=(e.boss?5:1)/d2; fx+=dx*w; fy+=dy*w;}
  }
  for(const f of run.fx) if(f.type==='stink'){const d=Math.hypot(P.x-f.x,P.y-f.y); if(Math.abs(d-f.r)<60){fx+=(P.x-f.x)/d*.02; fy+=(P.y-f.y)/d*.02;}}
  let x=0,y=0;
  const l=Math.hypot(fx,fy);
  if(l>1e-7){ x=fx/l; y=fy/l; const tx=-y, ty=x; x=x*.75+tx*.5; y=y*.75+ty*.5; }
  else if(run.items.length||run.crates.length){ // 안전할 때는 상자·아이템을 주우러 감
    let best=null,bd=1e18; for(const o of run.items){const d=(o.x-P.x)**2+(o.y-P.y)**2-(o.kind==='chest'?2e5:0); if(d<bd){bd=d;best=o;}}
    for(const o of run.crates){const d=(o.x-P.x)**2+(o.y-P.y)**2; if(d<bd&&d<450*450){bd=d;best=o;}}
    if(best){const d=Math.hypot(best.x-P.x,best.y-P.y)||1; x=(best.x-P.x)/d; y=(best.y-P.y)/d;}
  }
  if(!x&&!y&&near&&Math.sqrt(nd)>ST.range*.8){ const d=Math.sqrt(nd); x=(near.x-P.x)/d; y=(near.y-P.y)/d; }
  if(!x&&!y){ const a=run.t*.6; x=Math.cos(a)*.4; y=Math.sin(a)*.4; }
  const m=Math.hypot(x,y)||1; return {x:x/m,y:y/m};
}

   11. 업데이트
   ===================================================================== */
function update(dt){
  ST=stats();
  if(!SIM.on) SND.danger(P.hp/ST.maxHp);
  run.t+=dt;
  if(run.banner){run.banner.t-=dt; if(run.banner.t<=0) run.banner=null;}
  run.shake=Math.max(0,run.shake-dt*30);
  if(run.dead){ run.deadT-=dt; updateFx(dt); if(run.deadT<=0) showDead(); return; }

  let ix=0,iy=0;
  if(SIM.bot){const b=botInput(); ix=b.x; iy=b.y;}
  else{
    if(keys.has('a')||keys.has('arrowleft')) ix-=1;
    if(keys.has('d')||keys.has('arrowright')) ix+=1;
    if(keys.has('w')||keys.has('arrowup')) iy-=1;
    if(keys.has('s')||keys.has('arrowdown')) iy+=1;
    if(joy.id!==null){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,d=Math.hypot(dx,dy); if(d>6){const m=Math.min(1,d/50); ix=dx/d*m; iy=dy/d*m;}}
  }
  const il=Math.hypot(ix,iy); if(il>1){ix/=il; iy/=il;}
  P.moving=il>.05;
  P.x+=ix*ST.speed*dt; P.y+=iy*ST.speed*dt;
  if(P.moving){P.walk+=dt*12; if(Math.abs(ix)>.1&&P.throwT<=0) P.face=ix>0?1:-1;}
  P.inv=Math.max(0,P.inv-dt); P.throwT=Math.max(0,P.throwT-dt);
  if(ST.regen>0&&P.hp<ST.maxHp) P.hp=Math.min(ST.maxHp,P.hp+ST.maxHp*ST.regen*dt);
  if(P.hp>ST.maxHp) P.hp=ST.maxHp;
  if(!SIM.on){P.bubbleT-=dt; if(P.bubbleT<=0){P.bubbleT=rand(1.2,2.4); run.fx.push({type:'breath',x:P.x+P.face*8,y:P.y-30,t:0,life:1.6});}}

  if(!run.ending){ P.atk-=dt; if(P.atk<=0) P.atk=fire()?ST.cd:.05; }
  if(ST.shield>0&&!P.shield){ P.shieldT-=dt; if(P.shieldT<=0) P.shield=true; }
  if(run.comboT>0){ run.comboT-=dt; if(run.comboT<=0) run.combo=0; }
  if(run.freezeT>0) run.freezeT-=dt;
  // 낙뢰 호출
  if(ST.bolt>0&&!run.ending){ run.boltT-=dt; if(run.boltT<=0){ run.boltT=3.5-.2*ST.bolt;
    const c=nearestK(6,ST.range); const t=c[Math.floor(Math.random()*c.length)];
    if(t){ SND.play('bolt'); for(const e of enemiesNear(t.x,t.y,45)) damage(e,ST.dmg*(1+.25*ST.bolt),false,'bolt'); if(!SIM.on) run.fx.push({type:'strike',x:t.x,y:t.y,t:0,life:.3}); } } }
  // 정예 몬스터 / 보급 상자
  if(!run.ending){
    run.eliteT-=dt; if(run.eliteT<=0){ run.eliteT=CFG.ELITE_EVERY; spawnElite(); }
    run.crateT-=dt; if(run.crateT<=0){ run.crateT=CFG.CRATE_EVERY/ST.crateMul; spawnCrate(); }
  }
  for(const c of run.crates){ c.t+=dt; if((c.x-P.x)**2+(c.y-P.y)**2<(c.r+CFG.PLAYER_R)**2) breakCrate(c); if(Math.hypot(c.x-P.x,c.y-P.y)>spawnRadius()*1.8) c.dead=true; }
  for(const it of run.items){
    it.t+=dt; const dx=P.x-it.x, dy=P.y-it.y, d=Math.hypot(dx,dy)||1;
    if(it.pull||d<70){ const sp=it.pull?700:260; it.x+=dx/d*Math.min(d,sp*dt); it.y+=dy/d*Math.min(d,sp*dt); }
    if(d<CFG.PLAYER_R+14){ it.dead=true; collectItem(it); if(state!=='play') break; }
  }
  run.crates=run.crates.filter(c=>!c.dead); run.items=run.items.filter(i=>!i.dead);
  // 보스 투사체
  for(const b of run.eshots){ b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt; if((b.x-P.x)**2+(b.y-P.y)**2<(b.r+CFG.PLAYER_R*.8)**2){ b.life=0; hurtPlayer(b.dmg); } }
  run.eshots=run.eshots.filter(b=>b.life>0);
  if(run.dead) return;

  if(!run.ending){
    const prog=run.boss?Math.min(1,run.t/60):run.t/run.duration;
    const rate=(CFG.SPAWN_BASE+run.stage*CFG.SPAWN_PER_STAGE)*(1+prog)*(run.boss?.7:1);
    run.spawnAcc+=rate*dt;
    while(run.spawnAcc>=1){run.spawnAcc-=1; spawnEnemy(pickType());}
    run.waveT-=dt;
    if(run.waveT<=2&&!run.waveWarned){ run.waveWarned=true; toast('포위 경보','물고기 떼가 사방에서 몰려옵니다','#ff9d84'); }
    if(run.waveT<=0){run.waveT=15; run.waveWarned=false; spawnWave();}
  }

  const R=spawnRadius();
  grid.clear();
  for(const e of run.enemies){
    if(e.dead) continue;
    e.flash=Math.max(0,e.flash-dt); e.orbitCd=Math.max(0,e.orbitCd-dt);
    if(e.dotT>0){e.dotT-=dt; run.dmg.magic=(run.dmg.magic||0)+Math.min(e.dotDps*dt,Math.max(0,e.hp)); e.hp-=e.dotDps*dt; if(e.hp<=0){killEnemy(e); continue;}}
    let slow=e.slowT>0?.55:1; if(e.slowT>0) e.slowT-=dt;
    if(run.freezeT>0) slow=e.boss?.5:0;
    if(e.boss){updateBoss(e,dt*slow); continue;}
    const dx=P.x-e.x, dy=P.y-e.y, d=Math.hypot(dx,dy)||1;
    if(ST.aura>0&&d<130) slow*=1-ST.aura;
    if(d>R*1.7){const a=Math.atan2(dy,dx)+rand(-.6,.6); e.x=P.x+Math.cos(a)*R; e.y=P.y+Math.sin(a)*R; continue;}
    e.wob+=dt*(e.f.kind==='plankton'?3:8)*slow;
    const ux=dx/d, uy=dy/d, w=Math.sin(e.wob*.5)*.22;
    const vx=(ux-uy*w)*e.spd*slow, vy=(uy+ux*w)*e.spd*slow;
    e.x+=vx*dt; e.y+=vy*dt; e.ang=Math.atan2(vy,vx);
    const key=gk(Math.floor(e.x/64),Math.floor(e.y/64));
    let c=grid.get(key); if(!c){c=[]; grid.set(key,c);} c.push(e);
  }
  for(const [key,cell] of grid){
    const cx=key>>16, cy=(key<<16)>>16;
    for(let ox=-1;ox<=1;ox++)for(let oy=-1;oy<=1;oy++){
      const other=grid.get(gk(cx+ox,cy+oy)); if(!other) continue;
      for(const a of cell){let n=0; for(const b of other){ if(a===b||n>6) continue;
        const dx=b.x-a.x,dy=b.y-a.y,min=(a.r+b.r)*.8,d2=dx*dx+dy*dy;
        if(d2<min*min&&d2>.01){const d=Math.sqrt(d2),p=(min-d)*.25; a.x-=dx/d*p; a.y-=dy/d*p; n++;}}}
    }
  }
  for(const e of run.enemies){
    if(e.dead) continue;
    const rr2=e.r*(e.boss?.75:.8)+CFG.PLAYER_R;
    if((e.x-P.x)**2+(e.y-P.y)**2<rr2*rr2){ hurtPlayer(e.boss&&e.mode==='dash'?Math.round(e.dmg*1.5):e.dmg); if(run.dead) return; }
  }
  // 회전 배관
  if(ST.orbit>0){
    P.orbitA+=dt*ST.orbitSpd;
    const orR=orbitRadius();
    for(let i=0;i<ST.orbit;i++){const a=P.orbitA+i/ST.orbit*TAU, ox=P.x+Math.cos(a)*orR, oy=P.y+Math.sin(a)*orR;
      for(const e of enemiesNear(ox,oy,CFG.ORBIT_HIT_R)) if(e.orbitCd<=0){e.orbitCd=CFG.ORBIT_HIT_CD; damage(e,ST.dmg*ST.orbitMul,false,'orbit'); SND.play('orbit');
        if(!e.dead&&!e.boss){const kx=e.x-P.x, ky=e.y-P.y, kd=Math.hypot(kx,ky)||1, kn=e.elite?CFG.ORBIT_KNOCK*.4:CFG.ORBIT_KNOCK; e.x+=kx/kd*kn; e.y+=ky/kd*kn;}
        if(!SIM.on&&run.fx.length<260) run.fx.push({type:'spark',x:e.x,y:e.y,t:0,life:.22,a:a+Math.PI/2});}
      for(const c of run.crates) if((c.x-ox)**2+(c.y-oy)**2<(c.r+12)**2) breakCrate(c);}
  }
  // 파이프
  const boss=run.bossRef&&!run.bossRef.dead?run.bossRef:null;
  for(let si=0;si<run.shots.length;si++){
    const s=run.shots[si];
    if(!SIM.on&&(s.kind==='bounce'||s.kind==='pipe'&&ST.wdef.magic!=='rust')){s.trail.push(s.x,s.y); if(s.trail.length>10) s.trail.splice(0,2);}
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.rot+=dt*14; s.life-=dt;
    if(s.life<=0) continue;
    let hitE=null;
    const cx=Math.floor(s.x/64), cy=Math.floor(s.y/64);
    outer: for(let ox=-1;ox<=1;ox++)for(let oy=-1;oy<=1;oy++){
      const cell=grid.get(gk(cx+ox,cy+oy)); if(!cell) continue;
      for(const e of cell){ if(e.dead||s.hit.has(e)) continue; const r=e.r+s.r; if((e.x-s.x)**2+(e.y-s.y)**2<r*r){hitE=e; break outer;} }
    }
    if(!hitE&&boss&&!s.hit.has(boss)){const r=boss.r*.85+s.r; if((boss.x-s.x)**2+(boss.y-s.y)**2<r*r) hitE=boss;}
    if(!hitE) for(const c of run.crates) if(!c.dead&&(c.x-s.x)**2+(c.y-s.y)**2<(c.r+s.r)**2){ c.hp--; c.flash=.1; if(c.hp<=0) breakCrate(c); s.life=0; break; }
    if(hitE){
      s.hit.add(hitE); onPipeHit(hitE,s);
      if(s.pierce>0) s.pierce--;
      else if(s.bounce>0){
        s.bounce--; const nx=nearestK(1,220,s.x,s.y,s.hit)[0];
        if(nx){const a=Math.atan2(nx.y-s.y,nx.x-s.x), sp=Math.hypot(s.vx,s.vy); s.vx=Math.cos(a)*sp; s.vy=Math.sin(a)*sp; s.life=.6; s.dmg=ST.magicDmg; s.kind='bounce';}
        else s.life=0;
      } else s.life=0;
    }
  }
  run.shots=run.shots.filter(s=>s.life>0);
  run.enemies=run.enemies.filter(e=>!e.dead);
  updateFx(dt);

  if(!run.boss&&!run.ending&&run.t>=run.duration){
    run.ending=true; run.endT=1.4;
    for(const e of run.enemies){e.dead=true; if(!SIM.on) burst(e.x,e.y,'#bfefff',3,e.r);}
    run.enemies=[];
    run.banner={title:'공정 완료',sub:'현장을 정리합니다',t:1.4};
  }
  if(run.ending){ run.endT-=dt; if(run.endT<=0){ for(const it of run.items) if(it.kind!=='chest') collectItem(it); run.items=[]; stageCleared(); } }
}
function orbitRadius(){ return CFG.ORBIT_R_BASE+ST.range*CFG.ORBIT_R_RANGE; }
function updateBoss(b,dt){
  const dx=P.x-b.x, dy=P.y-b.y, d=Math.hypot(dx,dy)||1;
  b.wob+=dt;
  if(b.mode==='chase'){
    b.x+=dx/d*b.spd*dt; b.y+=dy/d*b.spd*dt; b.ang=Math.atan2(dy,dx);
    b.cd-=dt; if(b.cd<=0){SND.play('bossWind'); b.mode='wind'; b.tm=.85; b.dx=dx/d; b.dy=dy/d; b.ang=Math.atan2(dy,dx);}
  }else if(b.mode==='wind'){ b.tm-=dt; if(b.tm<=0){b.mode='dash'; b.tm=.7;} }
  else{ b.x+=b.dx*b.spd*4.4*dt; b.y+=b.dy*b.spd*4.4*dt; b.tm-=dt;
    if(b.tm<=0){ // 대왕 홍어(7등급)부터 연속 돌진
      if(b.def.k>=7&&!b.second){ b.second=true; b.mode='wind'; b.tm=.4; b.dx=dx/d; b.dy=dy/d; b.ang=Math.atan2(dy,dx); }
      else { b.second=false; b.mode='chase'; b.cd=rand(3,4.4)-b.def.k*.12; } } }
  const k=b.def.k;
  b.stinkCd-=dt;
  if(b.stinkCd<=0){b.stinkCd=7-Math.min(3,k*.3);
    SND.play('stink'); const n=k>=9?2:1; for(let i=0;i<n;i++) run.fx.push({type:'stink',x:b.x,y:b.y,r:b.r*.6-i*120,maxR:b.r+260,hit:false,dmg:Math.round(b.dmg*.7),t:0,life:9});}
  if(k>=3){ b.summonCd=(b.summonCd??8)-dt; if(b.summonCd<=0){ b.summonCd=12; SND.play('summon'); const n=6+k; for(let i=0;i<n;i++){const a=i/n*TAU; spawnEnemy(run.tier,0); const e=run.enemies[run.enemies.length-1]; if(e){e.x=b.x+Math.cos(a)*(b.r+30); e.y=b.y+Math.sin(a)*(b.r+30);}} if(!SIM.on) run.fx.push({type:'ring',x:b.x,y:b.y,t:0,life:.5,r:b.r+60,color:'#d77bff'}); } }
  if(k>=5){ // 가시 발사: 부채꼴 예고선을 먼저 보여 주고(SPIKE_WARN초) 그 방향으로 발사 — 피할 수 있는 패턴
    if(b.spikeWarn>0){ b.spikeWarn-=dt; if(b.spikeWarn<=0){ const n=b.spikeN, a0=b.spikeA;
      for(let i=0;i<n;i++){const a=a0+(i-(n-1)/2)*.22; run.eshots.push({x:b.x+Math.cos(a)*b.r*.8,y:b.y+Math.sin(a)*b.r*.8,vx:Math.cos(a)*260,vy:Math.sin(a)*260,r:7,life:2.6,dmg:Math.round(b.dmg*.6),k});} } }
    else{ b.spikeCd=(b.spikeCd??4)-dt; if(b.spikeCd<=0){ b.spikeCd=Math.max(3,6-k*.25); b.spikeN=5+(k-5); b.spikeA=Math.atan2(dy,dx); b.spikeWarn=CFG.SPIKE_WARN; SND.play('spike'); } } }
  if(d>spawnRadius()*1.6){b.x=P.x-dx/d*spawnRadius(); b.y=P.y-dy/d*spawnRadius();}
}
function updateFx(dt){
  for(const f of run.fx){
    f.t+=dt;
    if(f.type==='bub'){f.x+=f.vx*dt; f.y+=f.vy*dt; f.vx*=.92; f.vy=f.vy*.92-30*dt;}
    else if(f.type==='breath'){f.y-=40*dt; f.x+=Math.sin(f.t*6)*10*dt;}
    else if(f.type==='stink'){
      f.r+=240*dt;
      if(!f.hit&&!run.ending&&f.r>0){const d=Math.hypot(P.x-f.x,P.y-f.y); if(Math.abs(d-f.r)<16){f.hit=true; hurtPlayer(f.dmg);}}
      if(f.r>=f.maxR) f.t=f.life;
    }
  }
  run.fx=run.fx.filter(f=>f.t<f.life);
  for(const fl of run.floaters){fl.t+=dt; fl.y-=28*dt;}
  run.floaters=run.floaters.filter(f=>f.t<f.life);
  for(const t of toasts) t.t+=dt;
  for(let i=toasts.length-1;i>=0;i--) if(toasts[i].t>toasts[i].life) toasts.splice(i,1);
}

function drawBackground(cx,cy,time){
  ctx.setTransform(V.dpr,0,0,V.dpr,0,0);

  const z=V.zoom;
  ctx.setTransform(V.dpr*z,0,0,V.dpr*z,V.dpr*(V.w/2-cx*z),V.dpr*(V.h/2-cy*z));
  const hw=V.w/2/z, hh=V.h/2/z;
  const x0=Math.floor((cx-hw)/TILE), x1=Math.floor((cx+hw)/TILE), y0=Math.floor((cy-hh)/TILE), y1=Math.floor((cy+hh)/TILE);
  ctx.imageSmoothingEnabled=true; tileBudget=2;
  for(let tx=x0;tx<=x1;tx++)for(let ty=y0;ty<=y1;ty++){ const tl=getTile(tx,ty); if(tl) ctx.drawImage(tl,tx*TILE,ty*TILE,TILE+1,TILE+1); else { ctx.fillStyle='#0e2129'; ctx.fillRect(tx*TILE,ty*TILE,TILE+1,TILE+1); } }
  drawCaustics(cx,cy,time);
  // 살아 움직이는 해저 생물: 말미잘, 바다나리, 발광 생물
  const CS=300, a0=Math.floor((cx-hw)/CS)-1, a1=Math.floor((cx+hw)/CS)+1, b0=Math.floor((cy-hh)/CS)-1, b1=Math.floor((cy+hh)/CS)+1;
  for(let gx=a0;gx<=a1;gx++)for(let gy=b0;gy<=b1;gy++){
    const h=hash2(gx+999,gy-777), t=h%20, px=gx*CS+(h>>>8)%CS, py=gy*CS+(h>>>16)%CS;
    if(t<2){ // 말미잘
      ctx.fillStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(px+4,py+4,14,6,0,0,TAU); ctx.fill();
      const col=t?'rgba(255,140,170,':'rgba(255,190,120,';
      ctx.lineCap='round';
      for(let i=0;i<14;i++){const a=i/14*TAU, sw=Math.sin(time*1.6+i+gx)*.25, l=16+(i%3)*4;
        ctx.strokeStyle=col+'.8)'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(px,py);
        ctx.quadraticCurveTo(px+Math.cos(a+sw)*l*.6,py+Math.sin(a+sw)*l*.6,px+Math.cos(a+sw*1.6)*l,py+Math.sin(a+sw*1.6)*l); ctx.stroke();
        ctx.fillStyle=col+'1)'; ctx.beginPath(); ctx.arc(px+Math.cos(a+sw*1.6)*l,py+Math.sin(a+sw*1.6)*l,2,0,TAU); ctx.fill();}
      ctx.fillStyle=col+'1)'; ctx.beginPath(); ctx.arc(px,py,6,0,TAU); ctx.fill();
    }else if(t<4){ // 바다나리 / 해초
      ctx.strokeStyle='rgba(70,140,120,.6)'; ctx.lineWidth=3.5; ctx.lineCap='round';
      for(let k=0;k<4;k++){ctx.beginPath(); ctx.moveTo(px+k*7,py); for(let s=1;s<=7;s++) ctx.lineTo(px+k*7+Math.sin(time*1.2+s*.7+k+gx)*s*1.6,py-s*11-k*4); ctx.stroke();}
    }else if(t<9){ // 발광 생물 점들
      ctx.save(); ctx.globalCompositeOperation='lighter';
      for(let k=0;k<4;k++){const hx=px+((h>>>(k*3))%90)-45, hy=py+((h>>>(k*4+2))%90)-45, p=.5+.5*Math.sin(time*(1.3+k*.4)+k*2+gx);
        ctx.fillStyle=`rgba(${k%2?'90,220,255':'120,255,200'},${.12+.35*p})`; ctx.beginPath(); ctx.arc(hx,hy,2+p*2,0,TAU); ctx.fill();}
      ctx.restore();
    }
  }
}

function updateCoins(dt){

      const s=Math.min(1,f.t*4), y=f.y-Math.min(30,f.t*60);
      ctx.save(); ctx.translate(f.x,y); ctx.scale(s,s); ctx.globalAlpha=t>.8?(1-t)*5:1;
      ctx.fillStyle=`rgba(255,216,74,${.25+.15*Math.sin(f.t*12)})`; ctx.beginPath(); ctx.arc(0,-6,46,0,TAU); ctx.fill();
      ctx.fillStyle='#8a4b1f'; ctx.fillRect(-26,-10,52,30); ctx.fillStyle='#ffc21a'; ctx.fillRect(-26,-2,52,5); ctx.fillRect(-4,-10,8,30);
      ctx.save(); ctx.translate(-26,-10); ctx.rotate(-Math.min(1.2,f.t*3)); ctx.fillStyle='#a35a26'; ctx.fillRect(0,-14,52,14); ctx.fillStyle='#ffc21a'; ctx.fillRect(0,-4,52,4); ctx.restore();
      ctx.restore(); ctx.globalAlpha=1;
    }
  }
  // 어둠 (심해) + 빛줄기
  ctx.setTransform(V.dpr,0,0,V.dpr,0,0);
  ctx.fillStyle=dark; ctx.fillRect(0,0,V.w,V.h);
  drawRays(time);
  drawSnow(dt,time,P.x,P.y);
  if(P.inv>ST.iframe*.6){ctx.fillStyle='rgba(240,60,40,.12)'; ctx.fillRect(0,0,V.w,V.h);}
  for(const f of run.fx) if(f.type==='flash'){ctx.fillStyle=`rgba(255,220,180,${.6*(1-f.t/f.life)})`; ctx.fillRect(0,0,V.w,V.h);}
  if(run.freezeT>0){ctx.fillStyle='rgba(140,210,255,.08)'; ctx.fillRect(0,0,V.w,V.h);}
  ctx.setTransform(V.dpr*z,0,0,V.dpr*z,V.dpr*(V.w/2-cx*z),V.dpr*(V.h/2-cy*z));
  drawHpBars(vis);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const fl of run.floaters){
    ctx.globalAlpha=1-Math.max(0,(fl.t/fl.life-.6)/.4);
    ctx.font=`${fl.size}px ${FD}`; ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,.65)';
    ctx.strokeText(fl.text,fl.x,fl.y); ctx.fillStyle=fl.color; ctx.fillText(fl.text,fl.x,fl.y);
  }
  ctx.globalAlpha=1;
  drawOffscreen(time); drawHUD(time); drawCoins();
  if(joy.id!==null&&state==='play'){
    const r=wrap.getBoundingClientRect(), ox=joy.ox-r.left, oy=joy.oy-r.top;
    let dx=joy.x-joy.ox, dy=joy.y-joy.oy; const d=Math.hypot(dx,dy); if(d>50){dx=dx/d*50; dy=dy/d*50;}
    ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(ox,oy,50,0,TAU); ctx.stroke();
    ctx.fillStyle='rgba(255,194,26,.6)'; ctx.beginPath(); ctx.arc(ox+dx,oy+dy,20,0,TAU); ctx.fill();
  }
}
