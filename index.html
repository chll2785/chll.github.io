}
function updateCoins(dt){
  goldPulse=Math.max(0,goldPulse-dt*3);
  displayGold+=(save.gold-displayGold)*Math.min(1,dt*8); if(Math.abs(save.gold-displayGold)<.5) displayGold=save.gold;
  for(const c of coins){ if(c.delay>0){c.delay-=dt; continue;} c.t+=dt; if(c.t>=c.dur&&!c.done){c.done=true; goldPulse=Math.min(1,goldPulse+.25);} }
  for(let i=coins.length-1;i>=0;i--) if(coins[i].done) coins.splice(i,1);
}
function drawCoins(){
  ctx.setTransform(V.dpr,0,0,V.dpr,0,0);
  for(const c of coins){ if(c.delay>0) continue;
    const t=clamp(c.t/c.dur,0,1), e=t*t*(3-2*t), mx=(c.sx+hud.goldX)/2+c.arc, my=Math.min(c.sy,hud.goldY)-80;
    drawCoinIcon((1-e)*(1-e)*c.sx+2*(1-e)*e*mx+e*e*hud.goldX,(1-e)*(1-e)*c.sy+2*(1-e)*e*my+e*e*hud.goldY,6); }
}
function drawSnow(dt,time,px,py){
  ctx.setTransform(V.dpr,0,0,V.dpr,0,0);
  for(const s of snow){
    s.y+=dt*.012*s.z; s.ph+=dt;
    let x=((s.x*V.w-px*s.z*V.zoom*.6)%V.w+V.w)%V.w, y=((s.y*V.h-py*s.z*V.zoom*.6)%V.h+V.h)%V.h;
    x+=Math.sin(s.ph*.7)*3;
    ctx.fillStyle=`rgba(200,225,235,${.12+.25*s.z})`; ctx.fillRect(x,y,s.s*s.z,s.s*s.z);
  }
}
function drawRays(time){
  ctx.setTransform(V.dpr,0,0,V.dpr,0,0);
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(let i=0;i<4;i++){const x=V.w*(.12+i*.26)+Math.sin(time*.15+i*1.7)*70;
    const g=ctx.createLinearGradient(0,0,0,V.h); g.addColorStop(0,`rgba(80,160,200,${.05+.02*Math.sin(time*.4+i)})`); g.addColorStop(1,'rgba(80,160,200,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(x-25,0); ctx.lineTo(x+45,0); ctx.lineTo(x+220,V.h); ctx.lineTo(x-60,V.h); ctx.fill();}
  ctx.restore();
}

let lastRenderT=0;
function render(dt,time){
  updateCoins(dt);
  if(!run){
    const cx=Math.sin(time*.04)*500, cy=time*22;
    drawBackground(cx,cy,time); drawRays(time);
    ctx.setTransform(V.dpr,0,0,V.dpr,0,0); ctx.fillStyle=dark; ctx.fillRect(0,0,V.w,V.h);
    drawSnow(dt,time,cx,cy); return;
  }
  const sh=run.shake, sx=sh?rand(-sh,sh)*.5:0, sy=sh?rand(-sh,sh)*.5:0;
  const cx=P.x-sx, cy=P.y-sy;
  drawBackground(cx,cy,time);
  drawSilhouette(time,state==='play'?dt:0);
  const z=V.zoom;
  ctx.setTransform(V.dpr*z,0,0,V.dpr*z,V.dpr*(V.w/2-cx*z),V.dpr*(V.h/2-cy*z));
  const hw=V.w/2/z+80, hh=V.h/2/z+80, vis=(x,y,m)=>Math.abs(x-P.x)<hw+m&&Math.abs(y-P.y)<hh+m;
  // 공격 범위
  ctx.strokeStyle='rgba(255,194,26,.18)'; ctx.lineWidth=2/z; ctx.setLineDash([10,10]); ctx.lineDashOffset=-time*20;
  ctx.beginPath(); ctx.arc(P.x,P.y,ST.range,0,TAU); ctx.stroke(); ctx.setLineDash([]);
  for(const f of run.fx) if(f.type==='stink'){
    const a=1-f.r/f.maxR;
    ctx.strokeStyle=`rgba(190,230,90,${.55*a+.1})`; ctx.lineWidth=14; ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,TAU); ctx.stroke();
    ctx.strokeStyle=`rgba(150,90,180,${.4*a})`; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(f.x,f.y,f.r-10,0,TAU); ctx.stroke();
  }
  for(const c of run.crates) if(vis(c.x,c.y,30)) drawCrate(c);
  for(const it of run.items) if(vis(it.x,it.y,30)) drawItem(it,time);
  for(const e of run.enemies) if(!e.boss&&vis(e.x,e.y,e.r*2)) drawFishEnemy(e);
  const b=run.bossRef;
  if(b&&!b.dead){
    if(b.mode==='wind'){ctx.save(); ctx.strokeStyle=`rgba(255,80,60,${.4+.4*Math.sin(time*30)})`; ctx.lineWidth=b.r*.9; ctx.lineCap='round'; ctx.setLineDash([18,14]); ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(b.x+b.dx*b.spd*3.1,b.y+b.dy*b.spd*3.1); ctx.stroke(); ctx.restore();}
    if(b.spikeWarn>0){ const p=1-b.spikeWarn/CFG.SPIKE_WARN, n=b.spikeN; ctx.save(); ctx.lineCap='round'; // 가시 발사 예고선
      for(let i=0;i<n;i++){const a=b.spikeA+(i-(n-1)/2)*.22, r0=b.r*.8, r1=r0+120+420*p; ctx.strokeStyle=`rgba(255,${b.def.k>=8?110:200},90,${.18+.5*p})`; ctx.lineWidth=3+5*p; ctx.setLineDash([12,10]); ctx.beginPath(); ctx.moveTo(b.x+Math.cos(a)*r0,b.y+Math.sin(a)*r0); ctx.lineTo(b.x+Math.cos(a)*r1,b.y+Math.sin(a)*r1); ctx.stroke();}
      ctx.restore(); }
    ctx.save(); ctx.translate(b.x+(b.mode==='wind'?rand(-2,2):0),b.y); drawRay(ctx,b,time); ctx.restore();
    if(b.slowT>0){ctx.fillStyle='rgba(150,220,255,.2)'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU); ctx.fill();}
  }
  if(ST.orbit>0){ const orR=orbitRadius(); // 회전 배관: 궤도 잔상 + 파이프
    ctx.save(); ctx.lineCap='round'; ctx.strokeStyle=ST.wdef.color; ctx.lineWidth=7;
    for(let i=0;i<ST.orbit;i++){const a=P.orbitA+i/ST.orbit*TAU; for(let k=1;k<=3;k++){ctx.globalAlpha=.16/k; ctx.beginPath(); ctx.arc(P.x,P.y,orR,a-.13*k,a-.13*(k-1)); ctx.stroke();}}
    ctx.restore();
    for(let i=0;i<ST.orbit;i++){const a=P.orbitA+i/ST.orbit*TAU; ctx.save(); ctx.translate(P.x+Math.cos(a)*orR,P.y+Math.sin(a)*orR); ctx.rotate(a+Math.PI/2); drawPipeArt(ctx,ST.weapon.type,ST.weapon.plus,13,4,time,false); ctx.restore();} }
  for(const s of run.shots) drawShot(s,time);
  for(const b of run.eshots){ ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(Math.atan2(b.vy,b.vx)); ctx.fillStyle=b.k>=10?'#5ae6ff':b.k>=8?'#d24dff':'#f1e3d0'; ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(-6,-4); ctx.lineTo(-3,0); ctx.lineTo(-6,4); ctx.fill(); ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.lineWidth=1; ctx.stroke(); ctx.restore(); }
  if(P.shield){ ctx.strokeStyle=`rgba(159,232,255,${.45+.2*Math.sin(time*4)})`; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(P.x,P.y-4,34,0,TAU); ctx.stroke(); }
  if(!run.dead||run.deadT>.7) drawPlayer(time);
  // 헤드램프
  ctx.save(); ctx.globalCompositeOperation='lighter';
  const lx=P.x+P.face*11*CFG.PLAYER_SCALE, ly=P.y-26*CFG.PLAYER_SCALE, lg=ctx.createRadialGradient(lx,ly,1,lx+P.face*40,ly+10,110);
  lg.addColorStop(0,'rgba(255,240,200,.22)'); lg.addColorStop(1,'rgba(255,240,200,0)'); ctx.fillStyle=lg; ctx.beginPath(); ctx.arc(lx+P.face*40,ly+10,110,0,TAU); ctx.fill(); ctx.restore();
  for(const f of run.fx){
    const t=f.t/f.life;
    if(f.type==='bub'||f.type==='breath'){ctx.globalAlpha=1-t; ctx.strokeStyle=f.type==='breath'?'rgba(210,240,255,.8)':f.color; ctx.lineWidth=1.3; ctx.beginPath(); ctx.arc(f.x,f.y,(f.r||2.5)*(1+t),0,TAU); ctx.stroke(); ctx.globalAlpha=1;}
    else if(f.type==='xp'){const e2=t*t; const x=f.sx+(P.x-f.sx)*e2, y=f.sy+(P.y-10-f.sy)*e2; ctx.fillStyle=`rgba(120,220,255,${1-t*.5})`; ctx.beginPath(); ctx.arc(x,y,2.6,0,TAU); ctx.fill();}
    else if(f.type==='bolt'){ctx.strokeStyle=`rgba(240,250,140,${1-t})`; ctx.lineWidth=2.2; ctx.beginPath(); ctx.moveTo(f.x1,f.y1); for(let i=1;i<6;i++){const k=i/6; ctx.lineTo(f.x1+(f.x2-f.x1)*k+rand(-8,8),f.y1+(f.y2-f.y1)*k+rand(-8,8));} ctx.lineTo(f.x2,f.y2); ctx.stroke();}
    else if(f.type==='ring'){ctx.strokeStyle=f.color; ctx.globalAlpha=1-t; ctx.lineWidth=5*(1-t)+1; ctx.beginPath(); ctx.arc(f.x,f.y,f.r*Math.sqrt(t),0,TAU); ctx.stroke(); ctx.globalAlpha=1;}
    else if(f.type==='strike'){ctx.strokeStyle=`rgba(200,210,255,${1-t})`; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(f.x+rand(-10,10),f.y-260); for(let i=1;i<=6;i++) ctx.lineTo(f.x+rand(-14,14),f.y-260+i*43); ctx.stroke(); ctx.fillStyle=`rgba(200,210,255,${.4*(1-t)})`; ctx.beginPath(); ctx.arc(f.x,f.y,45,0,TAU); ctx.fill();}
    else if(f.type==='spark'){ctx.strokeStyle=`rgba(255,240,190,${1-t})`; ctx.lineWidth=2; for(let k=-1;k<=1;k++){const a=f.a+k*.5, r0=4+t*6, r1=10+t*16; ctx.beginPath(); ctx.moveTo(f.x+Math.cos(a)*r0,f.y+Math.sin(a)*r0); ctx.lineTo(f.x+Math.cos(a)*r1,f.y+Math.sin(a)*r1); ctx.stroke();}}
    else if(f.type==='boom'){ctx.strokeStyle=`rgba(95,240,255,${1-t})`; ctx.lineWidth=6*(1-t)+1; ctx.beginPath(); ctx.arc(f.x,f.y,80*Math.sqrt(t),0,TAU); ctx.stroke(); ctx.fillStyle=`rgba(95,240,255,${.25*(1-t)})`; ctx.fill();}
    else if(f.type==='chest'){
      const s=Math.min(1,f.t*4), y=f.y-Math.min(30,f.t*60);
      ctx.save(); ctx.translate(f.x,y); ctx.scale(s,s); ctx.globalAlpha=t>.8?(1-t)*5:1;
      ctx.fillStyle=`rgba(255,216,74,${.25+.15*Math.sin(f.t*12)})`; ctx.beginPath(); ctx.arc(0,-6,46,0,TAU); ctx.fill();
      ctx.fillStyle='#8a4b1f'; ctx.fillRect(-26,-10,52,30); ctx.fillStyle='#ffc21a'; ctx.fillRect(-26,-2,52,5); ctx.fillRect(-4,-10,8,30);
      ctx.save(); ctx.translate(-26,-10); ctx.rotate(-Math.min(1.2,f.t*3)); ctx.fillStyle='#a35a26'; ctx.fillRect(0,-14,52,14); ctx.fillStyle='#ffc21a'; ctx.fillRect(0,-4,52,4); ctx.restore();
      ctx.restore(); ctx.globalAlpha=1;
    }
  }
  // 어둠 (심해) + 빛줄기
  ctx.setTransform(V.dpr,0,0,V.dpr,0,0);
  ctx.fillStyle=dark; ctx.fillRect(0,0,V.w,V.h);
  drawRays(time);
  drawSnow(dt,time,P.x,P.y);
  if(P.inv>ST.iframe*.6){ctx.fillStyle='rgba(240,60,40,.12)'; ctx.fillRect(0,0,V.w,V.h);}
  for(const f of run.fx) if(f.type==='flash'){ctx.fillStyle=`rgba(255,220,180,${.6*(1-f.t/f.life)})`; ctx.fillRect(0,0,V.w,V.h);}
  if(run.freezeT>0){ctx.fillStyle='rgba(140,210,255,.08)'; ctx.fillRect(0,0,V.w,V.h);}
  ctx.setTransform(V.dpr*z,0,0,V.dpr*z,V.dpr*(V.w/2-cx*z),V.dpr*(V.h/2-cy*z));

  }
}

function avatarCanvas(rank,w,h,scale){
  const c=document.createElement('canvas'); c.width=w*2; c.height=h*2; c.style.width=w+'px'; c.style.height=h+'px';
  const x=c.getContext('2d'); x.scale(2,2); x.translate(w/2,h*.6); x.scale(scale,scale);
  drawWorker(x,rank,{moving:false,face:1,throwT:0,t:0,weapon:{type:'scrap',plus:0}}); return c;

  const x=canvas.getContext('2d'); x.setTransform(1,0,0,1,0,0); x.clearRect(0,0,canvas.width,canvas.height);
  x.translate(canvas.width/2,canvas.height*.6); x.scale(canvas.width/48,canvas.width/48);
  drawWorker(x,rank,{moving:false,face:1,throwT:0,t:0,weapon:weapon||equipped()});
}
function pipeCanvas(type,plus,w,h){
  const c=document.createElement('canvas'); c.width=w*2; c.height=h*2; c.style.width=w+'px'; c.style.height=h+'px';
  const x=c.getContext('2d'); x.scale(2,2); x.translate(w/2,h/2); const l=w*.36; drawPipeArt(x,type,plus,l,l*.3,1,false); return c;
}

$('#btnSignup').onclick=async()=>{
  if(!Store.ready) return;
  setBusy(true); authMsg('계정을 만드는 중…');
  try{ const wasGuest=guest; const a=await signup($('#inId').value.trim(),$('#inPw').value); useAccount(a); $('#inPw').value='';
    authMsg(''); openOffice(); toastOffice(wasGuest?'계정을 만들고 체험 진행을 저장했습니다.':'계정을 만들었습니다. 진행은 자동 저장됩니다.'); }
  catch(err){ authMsg(err.message||'계정을 만들지 못했습니다.','err'); }
  setBusy(false);
};
$('#btnGuest').onclick=()=>{ if(!guest) save=freshSave(); session=null; guest=true; testMode=false; openOffice(); };
$('#btnDev').onclick=()=>{
  const st=clamp(parseInt($('#devStage').value)||1,1,100), lv=clamp(parseInt($('#devLevel').value)||1,1,CFG.MAX_LEVEL);
  save=testSave(st,lv); session=null; guest=false; testMode=true; startStage(st);
};
function testSave(stage,lv){
  const s=freshSave(); s.level=lv; s.maxCleared=stage-1; s.sp=lv-1; s.stage=stage;
  const prev=save; save=s; while(s.rank<RANKS.length-1&&meetsRank(RANKS[s.rank+1])) s.rank++;
  autoSkills(); const best=[...WEAPONS].reverse().find(w=>w.req<=lv);
  if(best&&best.id!=='scrap'){const it=addWeapon(best.id,Math.min(6,Math.floor(lv/50))); s.equip.weapon=it.uid;}
  save=prev; return s;
}
// 자동 분배 순서 (테스트 모드·시뮬레이션용): [스킬, 목표 레벨]을 앞에서부터 채움
const SKILL_PLAN=[['a1',5],['r1',3],['a2',4],['s1',5],['a2',8],['a3',1],['a1',10],['a4',1],['s2',3],['g1',5],['m1',4],['r1',5],['r2',5],['r3',1],['a3',2],['a7',2],
  ['s1',8],['s3',4],['a4',2],['a5',5],['g2',4],['g4',2],['f1',5],['f3',5],['s2',6],['s4',1],['a1',15],['a3',3],['r3',2],['r4',4],['g1',8],['g3',2],['g5',3],['a6',5],
  ['m2',3],['m3',4],['s6',2],['s3',8],['s5',3],['f2',3],['f4',2],['f5',4],['m1',8],['m4',4],['r5',3],['a2',15],['a1',20],['a5',10],['a6',10],['a7',8],['r1',15],['r3',4],['r4',8],
  ['g1',15],['g5',8],['g4',6],['s1',20],['s3',15],['s2',10],['s4',3],['s6',6],['m3',10]];
function autoSkills(){
  for(const [id,lv] of SKILL_PLAN){ while(save.sp>0&&sk(id)<lv&&canLearn(SKILL[id])) learnSkill(id); }
  let guard=0; while(save.sp>0&&guard++<400){ const any=SKILLS.find(x=>canLearn(x)); if(!any) break; learnSkill(any.id); }
}

/* ---------- 현장 사무소 ---------- */
let tab='skills', selSkill='a1', selItem=null, enhItem=null, enhResult='';
let officeToastT=null;
function toastOffice(t){ const el=$('#saveInfo'); el.textContent=t; clearTimeout(officeToastT); officeToastT=setTimeout(updateSaveInfo,4000); }
function updateSaveInfo(){
  const el=$('#saveInfo'); if(!el) return;
  if(testMode) el.textContent='테스트 모드: 저장 안 됨';
  else if(guest) el.textContent='체험 중: 저장 안 됨 · 로그아웃 후 계정을 만들면 지금 진행을 저장합니다';
  else if(saveError) el.textContent=saveError;
  else if(saving||pendingSave) el.textContent='저장 중…';
  else if(lastSaved) el.textContent=`저장됨 ${new Date(lastSaved).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}${Store.mode==='cloud'?' · 온라인':' · 이 브라우저'}`;
  else el.textContent=Store.mode==='cloud'?'온라인 저장 사용 중':'이 브라우저에 저장 중';
}
function openOffice(){
  state='office'; run=null; $('#btnPause').hidden=true; keys.clear();
  show('#office'); refreshOffice(); renderTab();
}
function refreshOffice(){
  $('#ofName').textContent=(session?session.id:guest?'체험 계정':'테스트')+' · '+RANKS[save.rank].name;
  $('#ofSub').textContent=`Lv ${save.level} · 최고 클리어 STAGE ${save.maxCleared} · 처치 ${fmt(save.totalKills)}`;
  $('#ofGold').textContent=fmt(save.gold); $('#ofSp').textContent=save.sp;
  const b=$('#spBadge'); b.hidden=!save.sp; b.textContent=save.sp;
  const next=save.stage;
  $('#btnGo').textContent=`STAGE ${next} 출근하기`;
  $('#goInfo').innerHTML=isBossStage(next)?`보스 <b style="color:#ff9d84">${BOSS_NAMES[next/10-1]}</b> 출현 공정입니다.`:`${FISH[tierOf(next)].name} 구간 · ${stageDuration(next)}초 버티기`+(save.sp?` · 스킬 포인트 ${save.sp}개를 먼저 사용하세요`:'');
  paintAvatar($('#officeAvatar'),save.rank);
  updateSaveInfo();
}
$('#btnGo').onclick=()=>startStage(save.stage);
$('#btnLogout').onclick=()=>{ persist(); if(Store.mode==='firebase'&&Store.fb&&session){ const f=()=>{ if(saving||pendingSave) return setTimeout(f,300); Store.fb.auth.signOut().catch(()=>{}); }; f(); } session=null; testMode=false; state='login'; show('#login'); authMsg(guest?'체험 진행은 이 화면을 닫기 전까지 유지됩니다. 계정을 만들면 그대로 저장됩니다.':''); };
$$('.tabs button').forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; $$('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b?'true':'false')); renderTab(); });
function renderTab(){
  const body=$('#tabBody');
  if(tab==='skills') renderSkills(body);
  else if(tab==='inv') renderInv(body);
  else if(tab==='enh') renderEnh(body);

  else renderRanks(body);

/* 스킬 트리 (마인드맵) */
function nodePos(s){ const b=BRANCHES[s.br], rad=[0,128,232,332,428][s.d], a=(b.angle*Math.PI/180)+s.off; return {x:500+Math.cos(a)*rad,y:500+Math.sin(a)*rad}; }
let skillView=null; // 'list' | 'map' (처음엔 화면 폭으로 결정)
function skillHead(){
  const spent=SKILLS.reduce((a,x)=>a+sk(x.id),0), total=SKILLS.reduce((a,x)=>a+x.max,0), v=skillView||(innerWidth<700?'list':'map');
  return `<div class="skillhead"><div class="viewtoggle" role="group" aria-label="보기 방식"><button type="button" data-view="list" aria-pressed="${v==='list'}">목록</button><button type="button" data-view="map" aria-pressed="${v==='map'}">마인드맵</button></div>
    <span class="spsum">남은 포인트 <b>${save.sp}</b> · 습득 ${spent} / ${total}</span></div>`;
}
function bindSkillHead(body){ body.querySelectorAll('.viewtoggle button').forEach(b=>b.onclick=()=>{ skillView=b.dataset.view; renderSkills(body); }); }
function renderSkillList(body){
  let h=skillHead();
  for(const k in BRANCHES){
    const b=BRANCHES[k], list=SKILLS.filter(x=>x.br===k);
    // 부모 바로 아래에 자식이 오도록 트리 순서로 정렬
    const ordered=[], walk=pid=>{ for(const x of list.filter(y=>(y.req?y.req[0]:null)===pid)){ ordered.push(x); walk(x.id); } }; walk(null);
    h+=`<section class="skgroup"><h4 style="color:${b.color}">${b.name}</h4>`;
    for(const x of ordered){
      const lv=sk(x.id), open=skillUnlocked(x), can=canLearn(x), max=lv>=x.max;
      const eff=max?`${x.eff(lv)} · 최대`:open?(lv?`${x.eff(lv)} → <span>${x.eff(lv+1)}</span>`:`배우면 <span>${x.eff(1)}</span>`):`${SKILL[x.req[0]].name} Lv ${x.req[1]} 이상 필요 (현재 ${sk(x.req[0])})`;
      h+=`<div class="skrow${open?'':' locked'}${max?' maxed':''}" data-d="${x.d}" style="--c:${b.color}">
        <div class="skinfo"><div class="sktop"><b>${x.name}</b><span class="sklv">${open?`Lv ${lv} / ${x.max}`:'잠김'}</span></div>${pips(lv,x.max)}<div class="skeff">${eff}</div></div>
        <div class="skbtns"><button class="btn small" type="button" data-learn="${x.id}" data-n="1" aria-label="${x.name} 1번 배우기" ${can?'':'disabled'}>+1</button><button class="btn ghost small" type="button" data-learn="${x.id}" data-n="5" aria-label="${x.name} 5번 배우기" ${can?'':'disabled'}>+5</button></div></div>`;
    }
    h+='</section>';
  }
  h+=`<button class="linkbtn" type="button" id="btnReset">스킬 초기화 (포인트 전부 돌려받기)</button>`;
  body.innerHTML=h; bindSkillHead(body);
  body.querySelectorAll('[data-learn]').forEach(btn=>btn.onclick=()=>{
    let ok=false; for(let i=0;i<+btn.dataset.n;i++) if(learnSkill(btn.dataset.learn)) ok=true;
    if(ok){ persist(); const st=body.scrollTop; refreshOffice(); renderSkillList(body); body.scrollTop=st; }
  });
  let armed=false; $('#btnReset').onclick=e=>{ if(!armed){armed=true; e.target.textContent='한 번 더 누르면 초기화됩니다'; return;} resetSkills(); persist(); refreshOffice(); renderSkillList(body); };
}
function renderSkills(body){
  if((skillView||(innerWidth<700?'list':'map'))==='list') return renderSkillList(body);
  let svg=`<svg viewBox="0 0 1000 1000" role="group" aria-label="스킬 트리">`;
  for(const k in BRANCHES){const b=BRANCHES[k], a=b.angle*Math.PI/180; svg+=`<text x="${500+Math.cos(a)*485}" y="${500+Math.sin(a)*485+5}" text-anchor="middle" font-size="13" font-weight="700" fill="${b.color}" opacity=".85">${b.name}</text>`;}
  for(const s of SKILLS){
    const p=nodePos(s), par=s.req?nodePos(SKILL[s.req[0]]):{x:500,y:500}, col=BRANCHES[s.br].color, open=skillUnlocked(s);
    const mx=(p.x+par.x)/2+(p.y-par.y)*.12, my=(p.y+par.y)/2-(p.x-par.x)*.12;
    svg+=`<path d="M${par.x},${par.y} Q${mx},${my} ${p.x},${p.y}" fill="none" stroke="${col}" stroke-width="${open?3:1.5}" stroke-opacity="${open?.75:.25}" ${open?'':'stroke-dasharray="5 6"'}/>`;
    if(s.req) svg+=`<text x="${mx}" y="${my-4}" text-anchor="middle" font-size="10" fill="${col}" opacity=".8">Lv${s.req[1]}</text>`;
  }
  svg+=`<circle cx="500" cy="500" r="60" fill="#0a1b29" stroke="#ffc21a" stroke-width="3"/><text x="500" y="488" text-anchor="middle" font-size="15" fill="#e9f2f7" font-weight="700">${esc(RANKS[save.rank].name)}</text><text x="500" y="516" text-anchor="middle" font-size="24" fill="#5fd39a" font-weight="900">SP ${save.sp}</text><text x="500" y="538" text-anchor="middle" font-size="12" fill="#8fb0c4">${SKILLS.reduce((a,x)=>a+sk(x.id),0)} / ${SKILLS.reduce((a,x)=>a+x.max,0)}</text>`;
  for(const s of SKILLS){
    const p=nodePos(s), col=BRANCHES[s.br].color, lv=sk(s.id), open=skillUnlocked(s), can=canLearn(s), max=lv>=s.max, sel=selSkill===s.id;
    const name=s.name.length>4?[s.name.slice(0,Math.ceil(s.name.length/2)),s.name.slice(Math.ceil(s.name.length/2))]:[s.name];
    svg+=`<g class="node" tabindex="0" role="button" data-id="${s.id}" aria-label="${s.name} ${lv}/${s.max}${open?'':' 잠김'}">
      ${can?`<circle cx="${p.x}" cy="${p.y}" r="50" fill="none" stroke="${col}" stroke-width="2" opacity=".6"><animate attributeName="r" values="46;52;46" dur="1.6s" repeatCount="indefinite"/></circle>`:''}
      <circle cx="${p.x}" cy="${p.y}" r="42" fill="${max?col:'#0c2131'}" fill-opacity="${max?.9:1}" stroke="${sel?'#ffffff':col}" stroke-width="${sel?4:2.5}" stroke-opacity="${open?1:.35}"/>
      ${lv>0&&!max?`<circle cx="${p.x}" cy="${p.y}" r="42" fill="none" stroke="${col}" stroke-width="6" stroke-dasharray="${(lv/s.max)*263.9} 300" transform="rotate(-90 ${p.x} ${p.y})"/>`:''}
      ${name.map((t,i)=>`<text x="${p.x}" y="${p.y-6+(i-(name.length-1)/2)*17}" text-anchor="middle" font-size="15" font-weight="700" fill="${max?'#0a1b29':open?'#e9f2f7':'#6f8a9b'}">${t}</text>`).join('')}
      <text x="${p.x}" y="${p.y+(name.length>1?26:16)}" text-anchor="middle" font-size="13" fill="${max?'#0a1b29':open?col:'#6f8a9b'}">${open?`${lv}/${s.max}`:'잠김'}</text>
    </g>`;
  }
  svg+='</svg>';
  const s=SKILL[selSkill], lv=sk(s.id), open=skillUnlocked(s);
  body.innerHTML=`${skillHead()}<div class="skillwrap"><div class="mapbox" id="mapbox">${svg}</div>
    <div class="skilldetail">
      <div class="eyebrow" style="color:${BRANCHES[s.br].color}">${BRANCHES[s.br].name} 계열 · ${['','1단계 (하위)','2단계','3단계','4단계 (최상위)'][s.d]} 스킬</div>
      <h3>${s.name}</h3><div class="lvl">레벨 ${lv} / ${s.max}</div>${pips(lv,s.max)}
      <div class="effect">현재: ${lv?s.eff(lv):'미습득'}<br>${lv<s.max?`다음: <span>${s.eff(lv+1)}</span>`:'최대 레벨입니다.'}</div>
      ${s.req?`<div class="req"><ul><li><span class="chk ${open?'on':''}">${open?'✓':''}</span>${SKILL[s.req[0]].name} Lv ${s.req[1]} 이상 (현재 ${sk(s.req[0])})</li></ul></div>`:''}
      ${(()=>{const kids=SKILLS.filter(x=>x.req&&x.req[0]===s.id); return kids.length?`<p style="font-size:13px">이 스킬을 올리면 열리는 상위 스킬: ${kids.map(k=>`${k.name}(Lv${k.req[1]})`).join(', ')}</p>`:'';})()}
      <div class="row"><button class="btn" type="button" id="btnLearn" ${canLearn(s)?'':'disabled'}>배우기 (SP 1)</button>
      <button class="btn ghost small" type="button" id="btnLearn5" ${canLearn(s)?'':'disabled'}>5번 배우기</button></div>
      <p style="font-size:12px">${save.sp?`남은 스킬 포인트 ${save.sp}`:'레벨이 오를 때마다 스킬 포인트 1을 받습니다.'}</p>
      <button class="linkbtn" type="button" id="btnReset">스킬 초기화 (포인트 전부 돌려받기)</button>
    </div></div>`;
  bindSkillHead(body);
  const mb=$('#mapbox'); if(mb.scrollWidth>mb.clientWidth) mb.scrollLeft=(mb.scrollWidth-mb.clientWidth)/2;
  body.querySelectorAll('.node').forEach(n=>{ const pick=()=>{selSkill=n.dataset.id; const sl=mb.scrollLeft; renderSkills(body); $('#mapbox').scrollLeft=sl;}; n.addEventListener('click',pick); n.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault(); pick();}}); });
  const learnN=n=>{ let ok=false; for(let i=0;i<n;i++) if(learnSkill(selSkill)) ok=true; if(ok){ persist(); const sl=mb.scrollLeft, st=mb.scrollTop; refreshOffice(); renderSkills(body); $('#mapbox').scrollLeft=sl; $('#mapbox').scrollTop=st; } };
  $('#btnLearn').onclick=()=>learnN(1); $('#btnLearn5').onclick=()=>learnN(5);
  let armed=false; $('#btnReset').onclick=e=>{ if(!armed){armed=true; e.target.textContent='한 번 더 누르면 초기화됩니다'; return;} resetSkills(); persist(); refreshOffice(); renderSkills(body); };
}

/* 인벤토리 · 장비 */
function itemStats(it){
  const w=WEAPON[it.type], st=stats();
  const base=CFG.BASE_DMG*(1+CFG.DMG_PER_LEVEL*(save.level-1))*(1+rankBonus().dmg)*(1+.03*sk('a1'));
  return {coef:wCoef(it), magicP:Math.round(wMagic(it)*(1+.05*sk('g1'))*100), atk:base*wCoef(it)};
}

      <div class="idetail"><div class="eyebrow">선택한 무기</div>

          <dt>공격력 계수</dt><dd>×${s.coef.toFixed(2)}</dd><dt>예상 공격력</dt><dd>${s.atk.toFixed(1)}</dd>

      <div class="grid" id="invGrid"></div>

/* 무기 강화 */
function renderEnh(body){
  if(!enhItem||!save.inv.find(i=>i.uid===enhItem)) enhItem=equipped().uid;
  const it=save.inv.find(i=>i.uid===enhItem), w=WEAPON[it.type], maxed=it.plus>=MAX_PLUS;
  const cost=maxed?0:enhCost(it), rate=maxed?0:ENH_RATE[it.plus];
  const next=maxed?null:{...it,plus:it.plus+1};
  body.innerHTML=`<div class="invwrap">
    <div class="idetail"><div class="eyebrow">강화할 무기</div><div id="enhIcon"></div>
      <h3>${w.name} <span style="color:var(--hazard)">+${it.plus}</span></h3>
      ${maxed?'<p>최대 강화(+10)에 도달했습니다.</p>':`
      <dl class="stats"><dt>공격력 계수</dt><dd>×${wCoef(it).toFixed(2)} → <b style="color:var(--ok)">×${wCoef(next).toFixed(2)}</b></dd>
        <dt>추가 마법</dt><dd>${Math.round(wMagic(it)*100)}% → <b style="color:var(--ok)">${Math.round(wMagic(next)*100)}%</b></dd>
        <dt>성공 확률</dt><dd><span class="rate">${Math.round(rate*100)}%</span></dd>
        <dt>비용</dt><dd style="color:${save.gold>=cost?'#ffd84a':'#ff9d84'}">${fmt(cost)} G (보유 ${fmt(save.gold)} G)</dd></dl>
      <p style="font-size:12px">실패해도 무기는 파괴되지 않고 강화 단계도 내려가지 않습니다. 골드만 소모됩니다.</p>`}
      <button class="btn" type="button" id="btnEnh" ${maxed||save.gold<cost?'disabled':''}>${maxed?'최대 강화':'강화하기'}</button>
      <div class="result ${enhResult.startsWith('성공')?'ok':enhResult?'fail':''}" role="status">${enhResult}</div>
    </div>
    <div class="list"><h3>무기 선택</h3><div class="grid" id="enhGrid"></div>
      <div class="note">강화 확률: ${ENH_RATE.map((r,i)=>`+${i+1} ${Math.round(r*100)}%`).join(' · ')}</div></div></div>`;
  $('#enhIcon').appendChild(pipeCanvas(it.type,it.plus,220,64));
  const g=$('#enhGrid'), eq=equipped();
  for(const x of [...save.inv].sort((a,b)=>WEAPON[b.type].req-WEAPON[a.type].req||b.plus-a.plus)){
    const b=document.createElement('button'); b.type='button'; b.className='item'+(x.uid===enhItem?' sel':'')+(x.uid===eq.uid?' eq':'');
    b.appendChild(pipeCanvas(x.type,x.plus,96,32)); b.insertAdjacentHTML('beforeend',`<span class="nm">${WEAPON[x.type].name} +${x.plus}</span><span class="sub">${x.uid===eq.uid?'장착 중':'Lv '+WEAPON[x.type].req+(isJunk(x,eq)?' · 하위':'')}</span>`);
    b.onclick=()=>{enhItem=x.uid; enhResult=''; renderEnh(body);}; g.appendChild(b);
  }
  $('#btnEnh').onclick=()=>{
    if(maxed||save.gold<cost) return;
    save.gold-=cost;
    if(Math.random()<rate){ it.plus++; enhResult=`성공! ${w.name} +${it.plus}`; } else enhResult=`실패. +${it.plus} 유지 (골드 ${fmt(cost)} 소모)`;
    persist(); refreshOffice(); renderEnh(body);
  };
}

/* 세이브 코드 (기기·사이트 간 진행 옮기기) */
function renderCode(body){
  const code=exportCode();
  body.innerHTML=`<div class="two">
    <div class="list"><h3>내보내기</h3>
      <p style="font-size:13px">지금 진행(${RANKS[save.rank].name} · Lv ${save.level} · STAGE ${save.maxCleared} 클리어 · 골드 ${fmt(save.gold)})을 코드로 만듭니다. 다른 기기나 웹사이트에서 '가져오기'에 붙여넣으면 이어서 할 수 있습니다.</p>
      <textarea class="codebox" id="codeOut" readonly aria-label="내 세이브 코드">${code}</textarea>
      <div class="row"><button class="btn small" type="button" id="btnCopyCode">코드 복사</button><span class="msg" id="copyMsg" role="status"></span></div>
    </div>
    <div class="list"><h3>가져오기</h3>
      <p style="font-size:13px">다른 곳에서 복사한 코드를 붙여넣으세요. ${session?`<b style="color:var(--ink)">${esc(session.id)}</b> 계정의 현재 진행이 코드 내용으로 바뀝니다.`:guest?'체험 계정에 불러온 뒤, 로그아웃하고 계정을 만들면 그대로 저장됩니다.':'테스트 모드라 저장되지 않습니다.'}</p>
      <textarea class="codebox" id="codeIn" placeholder="JOGONG3-…" aria-label="가져올 세이브 코드" spellcheck="false" autocapitalize="off"></textarea>
      <div class="row"><button class="btn small" type="button" id="btnImport">가져오기</button><span class="msg" id="importMsg" role="status"></span></div>
    </div></div>`;
  const out=$('#codeOut');
  out.onfocus=()=>out.select();
  $('#btnCopyCode').onclick=()=>{
    const ok=()=>{$('#copyMsg').textContent='복사했습니다.'; $('#copyMsg').className='msg ok';};
    const fallback=()=>{ out.focus(); out.select(); $('#copyMsg').textContent='코드를 선택했습니다. 길게 눌러 복사하세요.'; $('#copyMsg').className='msg'; };
    try{ navigator.clipboard.writeText(code).then(ok,fallback); }catch(e){ fallback(); }
  };
  let pending=null;
  $('#btnImport').onclick=e=>{
    const msg=$('#importMsg');
    try{
      if(!pending){ pending=importCode($('#codeIn').value);
        e.target.textContent='한 번 더 누르면 덮어씁니다';
        msg.textContent=`불러올 진행: ${RANKS[pending.rank]?RANKS[pending.rank].name:''} · Lv ${pending.level} · STAGE ${pending.maxCleared} 클리어 · 골드 ${fmt(pending.gold)}`; msg.className='msg'; return; }
      save=pending; pending=null; persist(); refreshOffice(); renderCode(body);
      toastOffice('세이브 코드를 불러왔습니다.');
      $('#importMsg').textContent='불러왔습니다.'; $('#importMsg').className='msg ok';
    }catch(err){ pending=null; e.target.textContent='가져오기'; msg.textContent=err.message; msg.className='msg err'; }
  };
  $('#codeIn').oninput=()=>{ pending=null; $('#btnImport').textContent='가져오기'; $('#importMsg').textContent=''; };
}

/* 직급 · 복장 */
function renderRanks(body){
  const nx=RANKS[save.rank+1];
  body.innerHTML=`${nx?`<div class="req" style="margin-bottom:14px"><h3>다음 승진: ${nx.name}</h3>${reqList(nx)}</div>`:'<div class="note" style="margin-bottom:14px">최고 직급 PM에 도달했습니다.</div>'}
    <div class="ladder" id="ladder"></div>`;
  const L=$('#ladder');
  RANKS.forEach((r,i)=>{
    const d=document.createElement('div'); d.className='rankcard'+(i===save.rank?' cur':'')+(i>save.rank?' lock':'');
    d.appendChild(avatarCanvas(i,70,74,1.35));
    d.insertAdjacentHTML('beforeend',`<b>${r.name}</b><small>${OUTFITS[i].desc}</small><small>${i===0?'시작 직급':`Lv ${r.minLevel} · STAGE ${r.minStage} 클리어`}</small>
      <span class="tag ${i<save.rank?'done':i===save.rank?'now':''}">${i<save.rank?'완료':i===save.rank?'현재':'예정'}</span>`);
    L.appendChild(d);
  });
}
function reqList(r){
  const items=[[save.level>=r.minLevel,`레벨 ${r.minLevel} 달성 (현재 ${save.level})`],[save.maxCleared>=r.minStage,`스테이지 ${r.minStage} 클리어 (최고 ${save.maxCleared})`],...r.conditions.map(c=>[c.check(save),c.label])];
  return `<ul>${items.map(([ok,t])=>`<li><span class="chk ${ok?'on':''}">${ok?'✓':''}</span>${t}</li>`).join('')}</ul>`;
}

/* ---------- 현장 지원 (정예 상자) ---------- */
function openBoon(){
  const pool=[...BOONS]; for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]];}
  const opts=pool.slice(0,3);
  if(SIM.on){ applyBoon(opts[0].id); return; }
  state='boon'; keys.clear(); joy.id=null;
  $('#boonBody').innerHTML=`<div class="eyebrow">현장 지원 상자</div><h2>이번 공정에만 적용할 지원을 고르세요</h2>
    <div class="cards">${opts.map((b,i)=>`<button class="card" type="button" data-id="${b.id}"><span class="key">${i+1}번</span><span class="nm">${b.name}</span><span class="ds">${b.desc}</span>${run.boons[b.id]?`<span class="st">현재 ${run.boons[b.id]}단계 중첩</span>`:''}</button>`).join('')}</div>`;
  show('#boon');
  $$('#boonBody .card').forEach(c=>c.onclick=()=>{ applyBoon(c.dataset.id); hideAll(); state='play'; });
  setTimeout(()=>{const c=$('#boonBody .card'); if(c) c.focus({preventScroll:true});},30);
}
function applyBoon(id){
  const before=stats().maxHp; run.boons[id]=(run.boons[id]||0)+1; ST=stats();
  if(id==='heal') P.hp=ST.maxHp; else if(ST.maxHp>before) P.hp+=ST.maxHp-before;
  toast(`현장 지원 · ${BOONS.find(b=>b.id===id).name}`,BOONS.find(b=>b.id===id).desc,'#5fd39a');
}

/* ---------- 클리어 / 사고 / 일시정지 ---------- */
function stageCleared(){
  state='clear';
  const cleared=run.stage;
  save.maxCleared=Math.max(save.maxCleared,cleared);
  const promos=checkPromotion(), last=cleared>=CFG.MAX_STAGE;
  save.stage=last?CFG.MAX_STAGE:cleared+1;
  persist();
  if(SIM.on){ SIM.result={cleared:true,stage:cleared,t:run.t,kills:run.kills,xp:run.xpEarned,level:save.level,promos:promos.length}; return; }
  showClear(cleared,promos,last);
}
/* 작업일보 '피해 기여' — 어떤 공격이 얼마나 활약했는지 보여 줘 스킬 선택을 돕는다 */
function dmgReport(){
  const d=run&&run.dmg; if(!d) return '';
  const w=WEAPON[equipped().type];
  const L={pipe:['파이프 투척','#ffc21a'],magic:[`무기 마법 · ${w.mName}`,w.color],orbit:['회전 배관','#4dc3ff'],bolt:['낙뢰 호출','#b9c4ff'],shock:['충격파','#7f8cff'],lvl:['레벨업 충격파','#ffd84a'],item:['발파 신호탄','#ff5d4d']};
  const rows=Object.entries(d).filter(([k,v])=>v>=1&&L[k]).sort((a,b)=>b[1]-a[1]);
  const tot=rows.reduce((a,r)=>a+r[1],0); if(!tot) return '';
  return `<div class="dmgrep"><div class="eyebrow" style="color:var(--muted)">피해 기여 · 총 ${fmt(tot)} · 초당 ${fmt(tot/Math.max(1,run.t))}</div>${rows.map(([k,v])=>{const p=v/tot*100;
    return `<div class="dmgrow"><span>${L[k][0]}</span><i><b style="width:${Math.max(1.5,p).toFixed(1)}%;background:${L[k][1]}"></b></i><em>${p<1?'<1':Math.round(p)}%</em></div>`;}).join('')}</div>`;
}
function showClear(cleared,promos,last){
  $('#btnPause').hidden=true;
  const next=save.stage, nextRank=RANKS[save.rank+1];
  let promo='';
  if(promos.length){
    const to=promos[promos.length-1], from=to-promos.length, b=promos.reduce((a,i)=>({dmg:a.dmg+RANKS[i].bonus.dmg,hp:a.hp+RANKS[i].bonus.hp}),{dmg:0,hp:0});
    promo=`<div class="promo" id="promoBox"><div><div class="eyebrow">인사 발령</div><div class="big">${RANKS[from].name} → ${RANKS[to].name}</div>
      <p>복장 변경: ${OUTFITS[to].desc}<br>승진 보너스: 파이프 대미지 +${Math.round(b.dmg*100)}%, 최대 체력 +${b.hp}</p></div></div>`;
  }
  const found=run.weaponsFound.length?`<div class="note">획득한 무기: ${run.weaponsFound.map(w=>`${WEAPON[w.type].name}`).join(', ')} · 사무소 인벤토리에서 장착하세요.</div>`:'';
  $('#clearBody').innerHTML=`
    <div class="eyebrow">작업일보 · STAGE ${cleared}${run.boss?' · 보스 처치':''}</div>
    <h2>${last?'준공 완료. 모든 공정을 마쳤습니다':`STAGE ${cleared} 공정 완료`}</h2>
    <div class="report"><div><small>작업 시간</small><b>${fmtTime(run.t)}</b></div><div><small>처치 수</small><b>${fmt(run.kills)}</b></div>
      <div><small>골드</small><b>+${fmt(run.goldEarned)}</b></div><div><small>레벨</small><b>Lv ${save.level}${run.levelsGained?` <span style="font-size:13px;color:var(--ok)">+${run.levelsGained}</span>`:''}</b></div></div>
    <p style="font-size:13px">최고 콤보 ${run.bestCombo} · 정예 처치 ${run.elitesKilled}${Object.keys(run.boons).length?` · 받은 현장 지원 ${Object.values(run.boons).reduce((a,b)=>a+b,0)}개`:''}</p>
    ${dmgReport()}
    ${promo}${found}
    ${run.levelsGained?`<div class="note">스킬 포인트 ${run.levelsGained}개를 얻었습니다. 현장 사무소의 스킬 트리에서 사용하세요. (보유 ${save.sp})</div>`:''}
    ${nextRank?`<div class="req"><h3>다음 승진: ${nextRank.name}</h3>${reqList(nextRank)}</div>`:''}
    ${(!last&&isBossStage(next))?`<div class="warnline">다음 공정 STAGE ${next}에 보스 <b>${BOSS_NAMES[next/10-1]}</b>가 출현합니다.</div>`:''}
    <div class="row">${last?'':`<button class="btn" id="btnNext" type="button">STAGE ${next} 출근</button>`}
      <button class="btn ghost" id="btnOffice1" type="button">현장 사무소 (스킬·장비·강화)</button></div>`;
  show('#clear');
  if(promos.length) $('#promoBox').prepend(avatarCanvas(promos[promos.length-1],64,70,1.3));
  const bn=$('#btnNext'); if(bn){bn.onclick=()=>startStage(next); bn.focus({preventScroll:true});}
  $('#btnOffice1').onclick=openOffice;
}
function showDead(){
  state='dead'; persist();
  if(SIM.on){ SIM.result={cleared:false,stage:run.stage,t:run.t,kills:run.kills,xp:run.xpEarned,level:save.level}; return; }
  $('#btnPause').hidden=true;
  $('#deadBody').innerHTML=`
    <div class="eyebrow" style="color:var(--rust)">안전사고 발생</div><h2>STAGE ${run.stage} 작업 중단</h2>
    <div class="report"><div><small>버틴 시간</small><b>${fmtTime(run.t)}</b></div><div><small>처치 수</small><b>${fmt(run.kills)}</b></div>
      <div><small>골드</small><b>+${fmt(run.goldEarned)}</b></div><div><small>레벨</small><b>Lv ${save.level}</b></div></div>
    ${dmgReport()}
    <p>레벨, 스킬 포인트, 골드, 얻은 무기는 그대로 유지됩니다. 사무소에서 스킬을 찍고 장비를 정비한 뒤 다시 도전하세요.</p>
    <div class="row"><button class="btn" id="btnRetry" type="button">STAGE ${run.stage} 다시 도전</button>
      <button class="btn ghost" id="btnOffice2" type="button">현장 사무소</button></div>`;
  show('#dead');
  const n=run.stage; $('#btnRetry').onclick=()=>startStage(n); $('#btnRetry').focus({preventScroll:true});
  $('#btnOffice2').onclick=openOffice;
}
function togglePause(){
  if(state==='play'){
    state='pause'; keys.clear(); joy.id=null;
    const st=stats(), w=st.weapon;
    $('#pauseBody').innerHTML=`<div class="eyebrow">현장 대기 · STAGE ${run.stage}</div><h2>${RANKS[save.rank].name} · Lv ${save.level}</h2>
      <div class="report"><div><small>체력</small><b>${Math.ceil(P.hp)}/${st.maxHp}</b></div><div><small>공격력</small><b>${st.dmg.toFixed(1)}</b></div>
        <div><small>공격 범위</small><b>${Math.round(st.range)}</b></div><div><small>골드</small><b>${fmt(save.gold)}</b></div></div>
      <div class="slot"><span id="pIcon"></span><div class="meta"><small>장착 무기</small><b>${WEAPON[w.type].name} +${w.plus}</b><small>${WEAPON[w.type].mName}: ${WEAPON[w.type].mDesc(Math.round(st.magicDmg/st.dmg*100))}</small></div></div>
      ${save.sp?`<div class="note">사용하지 않은 스킬 포인트 ${save.sp}개가 있습니다. 스테이지를 마친 뒤 사무소에서 사용하세요.</div>`:''}
      <div class="row"><button class="btn" id="btnResume" type="button">계속하기</button>
        <button class="btn ghost" id="btnQuit" type="button">사무소로 (이번 스테이지 포기)</button></div>`;
    show('#pause'); $('#pIcon').appendChild(pipeCanvas(w.type,w.plus,72,28));
    $('#btnResume').onclick=togglePause; $('#btnResume').focus({preventScroll:true});
    let armed=false; $('#btnQuit').onclick=e=>{ if(!armed){armed=true; e.target.textContent='한 번 더 누르면 포기합니다'; return;} persist(); openOffice(); };
  }else if(state==='pause'){ hideAll(); state='play'; }
}
$('#btnPause').onclick=()=>togglePause();

/* =====================================================================
   14. 메인 루프 + 시뮬레이션 훅
   ===================================================================== */
let last=performance.now(), clock=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; clock+=dt;
  if(!SIM.on){ if(state==='play'&&run) update(dt); render(dt,clock); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
Store.init().then(async()=>{
  modeLine();
  // Firebase 버전: 이전에 로그인한 기기라면 바로 이어하기
  if(Store.mode==='firebase'&&Store.fb.auth.currentUser&&state==='login'){
    const u=Store.fb.auth.currentUser, id=(u.email||'').replace(FB_DOMAIN,'');
    try{ const a=await fbLoadSave(u,id); if(state==='login'){ useAccount(a); openOffice(); toastOffice(`${a.id} 계정으로 자동 로그인했습니다.`); } }catch(e){}
  }
});
modeLine();

// 자동 플레이 시뮬레이션 (밸런스 측정용): window.__JOGONG_SIM__
Object.defineProperty(window,'__JOGONG_SIM__',{value:{
  reset(){ SIM.on=true; SIM.bot=true; save=freshSave(); session=null; guest=true; testMode=true; },
  play(stage,maxSec){
    SIM.on=true; SIM.bot=true; SIM.result=null; startStage(stage); hideAll();
    const dt=1/30; let n=0; const lim=(maxSec||200)*30;
    while(!SIM.result&&n++<lim) update(dt);
    const r=SIM.result||{cleared:false,timeout:true,stage,level:save.level}; r.elites=run.elitesKilled; r.combo=run.bestCombo; r.goldRun=run.goldEarned;
    r.src=Object.fromEntries(Object.entries(run.dmg).map(([k,v])=>[k,Math.round(v)])); r.lvAfter=save.level; r.gold=save.gold; r.sp=save.sp; r.spent=SKILLS.reduce((a,x)=>a+sk(x.id),0); r.weapon=equipped().type+'+'+equipped().plus; r.hp=P?Math.round(P.hp):0; r.maxHp=stats().maxHp;
    return r;
  },
  spendAndGear(){
    autoSkills();
    const best=[...save.inv].filter(it=>WEAPON[it.type].req<=save.level).sort((a,b)=>tierIdx(b.type)-tierIdx(a.type)||b.plus-a.plus)[0]; if(best) save.equip.weapon=best.uid;
    let g=0; while(g++<40){const it=equipped(); if(it.plus>=MAX_PLUS||save.gold<enhCost(it)*1.5) break; save.gold-=enhCost(it); if(Math.random()<ENH_RATE[it.plus]) it.plus++;}
  },
  drawRay, bossDef, save:()=>save, stats:()=>stats(), xpToNext, CFG, XPC, FISH, setXPC(o){Object.assign(XPC,o);}, setCFG(o){Object.assign(CFG,o);},
  stop(){ SIM.on=false; SIM.bot=false; run=null; state='login'; show('#login'); },
}});

})();
</script>
