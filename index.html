/* 스킬 트리 (마인드맵) */
function nodePos(s){ const b=BRANCHES[s.br], rad=[0,128,232,332,428][s.d], a=(b.angle*Math.PI/180)+s.off; return {x:500+Math.cos(a)*rad,y:500+Math.sin(a)*rad}; }
let skillView=null; // 'list' | 'map' (처음엔 화면 폭으로 결정)
function skillHead(){
  const spent=SKILLS.reduce((a,x)=>a+sk(x.id),0), total=SKILLS.reduce((a,x)=>a+x.max,0), v=skillView||(innerWidth<700?'list':'map');
  return `<div class="skillhead"><div class="viewtoggle" role="group" aria-label="보기 방식"><button type="button" data-view="list" aria-pressed="${v==='list'}">목록</button><button type="button" data-view="map" aria-pressed="${v==='map'}">마인드맵</button></div>
    <span class="spsum">남은 포인트 <b>${save.sp}</b> · 습득 ${spent} / ${total}</span>
    <button class="btn small" type="button" id="btnAutoSp" ${save.sp&&SKILLS.some(canLearn)?'':'disabled'} title="공격·투척·생존을 고르게 키우는 추천 순서대로 남은 포인트를 한 번에 배분합니다">추천 자동 배분</button></div>`;
}
/* 추천 자동 배분: 포인트가 많이 쌓였을 때(특히 모바일) 한 번에 찍기. 두 번 눌러 확인, 이미 찍은 스킬은 그대로 둔다 */
function autoSpend(){ const before=save.sp; autoSkills(); const used=before-save.sp; if(used>0){ SND.play('learn'); persist(); } return used; }
function bindSkillHead(body){ body.querySelectorAll('.viewtoggle button').forEach(b=>b.onclick=()=>{ skillView=b.dataset.view; renderSkills(body); });
  const a=body.querySelector('#btnAutoSp'); if(a){ let arm=false; a.onclick=()=>{ if(!arm){ arm=true; a.textContent=`한 번 더 누르면 SP ${save.sp} 배분`; return; } const n=autoSpend(); refreshOffice(); renderSkills(body); toastOffice(n?`추천 순서대로 스킬 포인트 ${n}개를 배분했습니다.`:'배울 수 있는 스킬이 없습니다.'); }; } }
function renderSkillList(body){
  let h=skillHead();
  for(const k in BRANCHES){
    const b=BRANCHES[k], list=SKILLS.filter(x=>x.br===k);
    // 부모 바로 아래에 자식이 오도록 트리 순서로 정렬
    const ordered=[], walk=pid=>{ for(const x of list.filter(y=>(y.req?y.req[0]:null)===pid)){ ordered.push(x); walk(x.id); } }; walk(null);
    h+=`<section class="skgroup"><h4 style="color:${b.color}">${b.name}</h4>`;
    for(const x of ordered){
      const lv=sk(x.id), open=skillUnlocked(x), can=canLearn(x), max=lv>=x.max;
      const eff=max?`${x.eff(lv)} · 최대`:open?(lv?`${x.eff(lv)} → <span>${x.eff(lv+1)}</span>`:`배우면 <span>${x.eff(1)}</span>`):`${SKILL[x.req[0]].name} Lv ${x.req[1]} 이상 필요 (현재 ${sk(x.req[0])})`;
      h+=`<div class="skrow${open?'':' locked'}${max?' maxed':''}" data-d="${x.d}" style="--c:${b.color}">
        <div class="skinfo"><div class="sktop"><b>${x.name}</b><span class="sklv">${open?`Lv ${lv} / ${x.max}`:'잠김'}</span></div>${pips(lv,x.max)}<div class="skeff">${eff}</div></div>
        <div class="skbtns"><button class="btn small" type="button" data-learn="${x.id}" data-n="1" aria-label="${x.name} 1번 배우기" ${can?'':'disabled'}>+1</button><button class="btn ghost small" type="button" data-learn="${x.id}" data-n="5" aria-label="${x.name} 5번 배우기" ${can?'':'disabled'}>+5</button></div></div>`;
    }
    h+='</section>';
  }
  h+=`<button class="linkbtn" type="button" id="btnReset">스킬 초기화 (포인트 전부 돌려받기)</button>`;
  body.innerHTML=h; bindSkillHead(body);
  body.querySelectorAll('[data-learn]').forEach(btn=>btn.onclick=()=>{
    let ok=false; for(let i=0;i<+btn.dataset.n;i++) if(learnSkill(btn.dataset.learn)) ok=true; if(ok) SND.play('learn');
    if(ok){ persist(); const st=body.scrollTop; refreshOffice(); renderSkillList(body); body.scrollTop=st; }
  });
  let armed=false; $('#btnReset').onclick=e=>{ if(!armed){armed=true; e.target.textContent='한 번 더 누르면 초기화됩니다'; return;} resetSkills(); persist(); refreshOffice(); renderSkillList(body); };
}
function renderSkills(body){
  if((skillView||(innerWidth<700?'list':'map'))==='list') return renderSkillList(body);
  let svg=`<svg viewBox="0 0 1000 1000" role="group" aria-label="스킬 트리">`;
  for(const k in BRANCHES){const b=BRANCHES[k], a=b.angle*Math.PI/180; svg+=`<text x="${500+Math.cos(a)*485}" y="${500+Math.sin(a)*485+5}" text-anchor="middle" font-size="13" font-weight="700" fill="${b.color}" opacity=".85">${b.name}</text>`;}
  for(const s of SKILLS){
    const p=nodePos(s), par=s.req?nodePos(SKILL[s.req[0]]):{x:500,y:500}, col=BRANCHES[s.br].color, open=skillUnlocked(s);
    const mx=(p.x+par.x)/2+(p.y-par.y)*.12, my=(p.y+par.y)/2-(p.x-par.x)*.12;
    svg+=`<path d="M${par.x},${par.y} Q${mx},${my} ${p.x},${p.y}" fill="none" stroke="${col}" stroke-width="${open?3:1.5}" stroke-opacity="${open?.75:.25}" ${open?'':'stroke-dasharray="5 6"'}/>`;
    if(s.req) svg+=`<text x="${mx}" y="${my-4}" text-anchor="middle" font-size="10" fill="${col}" opacity=".8">Lv${s.req[1]}</text>`;
  }
  svg+=`<circle cx="500" cy="500" r="60" fill="#0a1b29" stroke="#ffc21a" stroke-width="3"/><text x="500" y="488" text-anchor="middle" font-size="15" fill="#e9f2f7" font-weight="700">${esc(RANKS[save.rank].name)}</text><text x="500" y="516" text-anchor="middle" font-size="24" fill="#5fd39a" font-weight="900">SP ${save.sp}</text><text x="500" y="538" text-anchor="middle" font-size="12" fill="#8fb0c4">${SKILLS.reduce((a,x)=>a+sk(x.id),0)} / ${SKILLS.reduce((a,x)=>a+x.max,0)}</text>`;
  for(const s of SKILLS){
    const p=nodePos(s), col=BRANCHES[s.br].color, lv=sk(s.id), open=skillUnlocked(s), can=canLearn(s), max=lv>=s.max, sel=selSkill===s.id;
    const name=s.name.length>4?[s.name.slice(0,Math.ceil(s.name.length/2)),s.name.slice(Math.ceil(s.name.length/2))]:[s.name];
    svg+=`<g class="node" tabindex="0" role="button" data-id="${s.id}" aria-label="${s.name} ${lv}/${s.max}${open?'':' 잠김'}">
      ${can?`<circle cx="${p.x}" cy="${p.y}" r="50" fill="none" stroke="${col}" stroke-width="2" opacity=".6"><animate attributeName="r" values="46;52;46" dur="1.6s" repeatCount="indefinite"/></circle>`:''}
      <circle cx="${p.x}" cy="${p.y}" r="42" fill="${max?col:'#0c2131'}" fill-opacity="${max?.9:1}" stroke="${sel?'#ffffff':col}" stroke-width="${sel?4:2.5}" stroke-opacity="${open?1:.35}"/>
      ${lv>0&&!max?`<circle cx="${p.x}" cy="${p.y}" r="42" fill="none" stroke="${col}" stroke-width="6" stroke-dasharray="${(lv/s.max)*263.9} 300" transform="rotate(-90 ${p.x} ${p.y})"/>`:''}
      ${name.map((t,i)=>`<text x="${p.x}" y="${p.y-6+(i-(name.length-1)/2)*17}" text-anchor="middle" font-size="15" font-weight="700" fill="${max?'#0a1b29':open?'#e9f2f7':'#6f8a9b'}">${t}</text>`).join('')}
      <text x="${p.x}" y="${p.y+(name.length>1?26:16)}" text-anchor="middle" font-size="13" fill="${max?'#0a1b29':open?col:'#6f8a9b'}">${open?`${lv}/${s.max}`:'잠김'}</text>
    </g>`;
  }
  svg+='</svg>';
  const s=SKILL[selSkill], lv=sk(s.id), open=skillUnlocked(s);
  body.innerHTML=`${skillHead()}<div class="skillwrap"><div class="mapbox" id="mapbox">${svg}</div>
    <div class="skilldetail">
      <div class="eyebrow" style="color:${BRANCHES[s.br].color}">${BRANCHES[s.br].name} 계열 · ${['','1단계 (하위)','2단계','3단계','4단계 (최상위)'][s.d]} 스킬</div>
      <h3>${s.name}</h3><div class="lvl">레벨 ${lv} / ${s.max}</div>${pips(lv,s.max)}

/* ---------- 현장 지원 (정예 상자) ---------- */
function openBoon(){
  const pool=[...BOONS]; for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]];}
  const opts=pool.slice(0,3);
  if(SIM.on){ applyBoon(opts[0].id); return; }
  SND.duck(true);
  state='boon'; keys.clear(); joy.id=null;
  $('#boonBody').innerHTML=`<div class="eyebrow">현장 지원 상자</div><h2>이번 공정에만 적용할 지원을 고르세요</h2>
    <div class="cards">${opts.map((b,i)=>`<button class="card" type="button" data-id="${b.id}"><span class="key">${i+1}번</span><span class="nm">${b.name}</span><span class="ds">${b.desc}</span>${run.boons[b.id]?`<span class="st">현재 ${run.boons[b.id]}단계 중첩</span>`:''}</button>`).join('')}</div>`;
  show('#boon');
  $$('#boonBody .card').forEach(c=>c.onclick=()=>{ applyBoon(c.dataset.id); SND.play('boon'); SND.duck(false); hideAll(); state='play'; });
  setTimeout(()=>{const c=$('#boonBody .card'); if(c) c.focus({preventScroll:true});},30);
}
function applyBoon(id){
  const before=stats().maxHp; run.boons[id]=(run.boons[id]||0)+1; ST=stats();
  if(id==='heal') P.hp=ST.maxHp; else if(ST.maxHp>before) P.hp+=ST.maxHp-before;
  toast(`현장 지원 · ${BOONS.find(b=>b.id===id).name}`,BOONS.find(b=>b.id===id).desc,'#5fd39a');
}

/* ---------- 클리어 / 사고 / 일시정지 ---------- */
function stageCleared(){
  state='clear';
  const cleared=run.stage;
  save.maxCleared=Math.max(save.maxCleared,cleared);
  const promos=checkPromotion(), last=cleared>=CFG.MAX_STAGE;
  save.stage=last?CFG.MAX_STAGE:cleared+1;
  persist();
  if(SIM.on){ SIM.result={cleared:true,stage:cleared,t:run.t,kills:run.kills,xp:run.xpEarned,level:save.level,promos:promos.length}; return; }
  SND.mood('calm'); SND.play('clear'); if(promos.length) SND.play('promo');
  showClear(cleared,promos,last);
}
/* 작업일보 '피해 기여' — 어떤 공격이 얼마나 활약했는지 보여 줘 스킬 선택을 돕는다 */
function dmgReport(){
  const d=run&&run.dmg; if(!d) return '';
  const w=WEAPON[equipped().type];
  const L={pipe:['파이프 투척','#ffc21a'],magic:[`무기 마법 · ${w.mName}`,w.color],orbit:['회전 배관','#4dc3ff'],bolt:['낙뢰 호출','#b9c4ff'],shock:['충격파','#7f8cff'],lvl:['레벨업 충격파','#ffd84a'],item:['발파 신호탄','#ff5d4d']};
  const rows=Object.entries(d).filter(([k,v])=>v>=1&&L[k]).sort((a,b)=>b[1]-a[1]);
  const tot=rows.reduce((a,r)=>a+r[1],0); if(!tot) return '';
  return `<div class="dmgrep"><div class="eyebrow" style="color:var(--muted)">피해 기여 · 총 ${fmt(tot)} · 초당 ${fmt(tot/Math.max(1,run.t))}</div>${rows.map(([k,v])=>{const p=v/tot*100;
    return `<div class="dmgrow"><span>${L[k][0]}</span><i><b style="width:${Math.max(1.5,p).toFixed(1)}%;background:${L[k][1]}"></b></i><em>${p<1?'<1':Math.round(p)}%</em></div>`;}).join('')}</div>`;
}

    const to=promos[promos.length-1], from=to-promos.length, b=promos.reduce((a,i)=>({dmg:a.dmg+RANKS[i].bonus.dmg,hp:a.hp+RANKS[i].bonus.hp}),{dmg:0,hp:0});
    promo=`<div class="promo" id="promoBox"><div><div class="eyebrow">인사 발령</div><div class="big">${RANKS[from].name} → ${RANKS[to].name}</div>
      <p>복장 변경: ${OUTFITS[to].desc}<br>승진 보너스: 파이프 대미지 +${Math.round(b.dmg*100)}%, 최대 체력 +${b.hp}</p></div></div>`;
  }
  const found=run.weaponsFound.length?`<div class="note">획득한 무기: ${run.weaponsFound.map(w=>`${WEAPON[w.type].name}`).join(', ')} · 사무소 인벤토리에서 장착하세요.</div>`:'';
  $('#clearBody').innerHTML=`
    <div class="eyebrow">작업일보 · STAGE ${cleared}${run.boss?' · 보스 처치':''}</div>
    <h2>${last?'준공 완료. 모든 공정을 마쳤습니다':`STAGE ${cleared} 공정 완료`}</h2>
    <div class="report"><div><small>작업 시간</small><b>${fmtTime(run.t)}</b></div><div><small>처치 수</small><b>${fmt(run.kills)}</b></div>
      <div><small>골드</small><b>+${fmt(run.goldEarned)}</b></div><div><small>레벨</small><b>Lv ${save.level}${run.levelsGained?` <span style="font-size:13px;color:var(--ok)">+${run.levelsGained}</span>`:''}</b></div></div>
    <p style="font-size:13px">최고 콤보 ${run.bestCombo} · 정예 처치 ${run.elitesKilled}${Object.keys(run.boons).length?` · 받은 현장 지원 ${Object.values(run.boons).reduce((a,b)=>a+b,0)}개`:''}</p>
    ${dmgReport()}
    ${promo}${found}
    ${run.levelsGained?`<div class="note">스킬 포인트 ${run.levelsGained}개를 얻었습니다. 현장 사무소의 스킬 트리에서 사용하세요. (보유 ${save.sp})</div>`:''}
    ${(save.sp&&SKILLS.some(canLearn))||betterWeapon()?`<div class="row" id="quickPrep">${save.sp&&SKILLS.some(canLearn)?`<button class="btn ghost small" type="button" id="btnQuickSp">SP ${save.sp} 추천 자동 배분</button>`:''}${betterWeapon()?`<button class="btn ghost small" type="button" id="btnQuickW">${WEAPON[betterWeapon().type].name} +${betterWeapon().plus} 장착</button>`:''}<span class="msg ok" id="quickMsg" role="status"></span></div>`:''}
    ${nextRank?`<div class="req"><h3>다음 승진: ${nextRank.name}</h3>${reqList(nextRank)}</div>`:''}
    ${(!last&&isBossStage(next))?`<div class="warnline">다음 공정 STAGE ${next}에 보스 <b>${BOSS_NAMES[next/10-1]}</b>가 출현합니다.</div>`:''}
    <div class="row">${last?'':`<button class="btn" id="btnNext" type="button">STAGE ${next} 출근</button>`}
      <button class="btn ghost" id="btnOffice1" type="button">현장 사무소 (스킬·장비·강화)</button></div>`;
  show('#clear');
  if(promos.length) $('#promoBox').prepend(avatarCanvas(promos[promos.length-1],64,70,1.3));
  const bn=$('#btnNext'); if(bn){bn.onclick=()=>startStage(next); bn.focus({preventScroll:true});}
  $('#btnOffice1').onclick=openOffice;
  // 클리어 화면에서 바로 정비: 추천 배분 / 더 좋은 무기 장착 후 곧장 다음 공정으로
  const qs=$('#btnQuickSp'); if(qs) qs.onclick=()=>{ const n=autoSpend(); qs.disabled=true; qs.textContent=n?`스킬 ${n}개 배분 완료`:'배울 스킬 없음'; };
  const qw=$('#btnQuickW'); if(qw) qw.onclick=()=>{ const b=betterWeapon(); if(b){ save.equip.weapon=b.uid; SND.play('weapon'); persist(); } qw.disabled=true; qw.textContent='장착 완료'; };
}
function showDead(){
  state='dead'; persist();
  if(SIM.on){ SIM.result={cleared:false,stage:run.stage,t:run.t,kills:run.kills,xp:run.xpEarned,level:save.level}; return; }
  $('#btnPause').hidden=true;
  $('#deadBody').innerHTML=`
    <div class="eyebrow" style="color:var(--rust)">안전사고 발생</div><h2>STAGE ${run.stage} 작업 중단</h2>
    <div class="report"><div><small>버틴 시간</small><b>${fmtTime(run.t)}</b></div><div><small>처치 수</small><b>${fmt(run.kills)}</b></div>
      <div><small>골드</small><b>+${fmt(run.goldEarned)}</b></div><div><small>레벨</small><b>Lv ${save.level}</b></div></div>
    ${dmgReport()}
    <p>레벨, 스킬 포인트, 골드, 얻은 무기는 그대로 유지됩니다. 사무소에서 스킬을 찍고 장비를 정비한 뒤 다시 도전하세요.</p>
    <div class="row"><button class="btn" id="btnRetry" type="button">STAGE ${run.stage} 다시 도전</button>
      <button class="btn ghost" id="btnOffice2" type="button">현장 사무소</button></div>`;
  show('#dead');
  const n=run.stage; $('#btnRetry').onclick=()=>startStage(n); $('#btnRetry').focus({preventScroll:true});
  $('#btnOffice2').onclick=openOffice;
}
function togglePause(){
  if(state==='play'){
    state='pause'; keys.clear(); joy.id=null;
    const st=stats(), w=st.weapon;
    $('#pauseBody').innerHTML=`<div class="eyebrow">현장 대기 · STAGE ${run.stage}</div><h2>${RANKS[save.rank].name} · Lv ${save.level}</h2>
      <div class="report"><div><small>체력</small><b>${Math.ceil(P.hp)}/${st.maxHp}</b></div><div><small>공격력</small><b>${st.dmg.toFixed(1)}</b></div>
        <div><small>공격 범위</small><b>${Math.round(st.range)}</b></div><div><small>골드</small><b>${fmt(save.gold)}</b></div></div>
      <div class="slot"><span id="pIcon"></span><div class="meta"><small>장착 무기</small><b>${WEAPON[w.type].name} +${w.plus}</b><small>${WEAPON[w.type].mName}: ${WEAPON[w.type].mDesc(Math.round(st.magicDmg/st.dmg*100))}</small></div></div>
      ${save.sp?`<div class="note">사용하지 않은 스킬 포인트 ${save.sp}개가 있습니다. 스테이지를 마친 뒤 사무소에서 사용하세요.</div>`:''}
      <label class="vol" style="grid-template-columns:auto 1fr;cursor:pointer"><input type="checkbox" id="optDmgNum" ${UIP.dmgNum?'checked':''} style="width:18px;height:18px;margin:0"><span>타격 피해 숫자 표시 (치명타 숫자는 항상 표시)</span></label>
      <div class="row"><button class="btn" id="btnResume" type="button">계속하기</button>
        <button class="btn ghost" id="btnQuit" type="button">사무소로 (이번 스테이지 포기)</button></div>
      ${volHtml()}`;
    show('#pause'); bindVol($('#pauseBody')); $('#optDmgNum').onchange=e=>{ UIP.dmgNum=e.target.checked; saveUIP(); }; SND.duck(true); $('#pIcon').appendChild(pipeCanvas(w.type,w.plus,72,28));
    $('#btnResume').onclick=togglePause; $('#btnResume').focus({preventScroll:true});
    let armed=false; $('#btnQuit').onclick=e=>{ if(!armed){armed=true; e.target.textContent='한 번 더 누르면 포기합니다'; return;} persist(); openOffice(); };
  }else if(state==='pause'){ hideAll(); state='play'; SND.duck(false); }
}
$('#btnPause').onclick=()=>togglePause();
/* 소리 설정: 게임 중 스피커 버튼·사무소 버튼은 전체 끄기/켜기, 일시정지 화면에서 배경음·효과음 크기 조절 */
function volHtml(){ const p=SND.pref; return `<div class="vol" role="group" aria-label="소리 크기">
  <label for="volBgm">배경음</label><input id="volBgm" type="range" min="0" max="100" step="5" value="${Math.round(p.bgm*100)}"><output id="volBgmV">${Math.round(p.bgm*100)}</output>
  <label for="volSfx">효과음</label><input id="volSfx" type="range" min="0" max="100" step="5" value="${Math.round(p.sfx*100)}"><output id="volSfxV">${Math.round(p.sfx*100)}</output></div>`; }
function bindVol(root){
  const b=root.querySelector('#volBgm'), f=root.querySelector('#volSfx'); if(!b) return;
  b.oninput=()=>{ SND.set({bgm:b.value/100,mute:false}); root.querySelector('#volBgmV').textContent=b.value; syncSnd(); };
  f.oninput=()=>{ SND.set({sfx:f.value/100,mute:false}); root.querySelector('#volSfxV').textContent=f.value; syncSnd(); };
  f.onchange=()=>SND.play('coin');
}
function syncSnd(){ const m=SND.pref.mute; for(const id of ['#btnSound','#btnOfSnd']){ const el=$(id); el.classList.toggle('muted',m); el.setAttribute('aria-label',m?'소리 켜기':'소리 끄기'); el.title=m?'소리 켜기':'소리 끄기'; } }
$('#btnSound').onclick=e=>{ SND.toggleMute(); syncSnd(); e.currentTarget.blur(); };
$('#btnOfSnd').onclick=()=>{ SND.toggleMute(); syncSnd(); };
syncSnd();
document.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b&&!b.closest('#boonBody')&&b.id!=='btnSound'&&b.id!=='btnOfSnd'&&!b.dataset.learn) SND.play('click'); },true);

/* =====================================================================
   14. 메인 루프 + 시뮬레이션 훅
   ===================================================================== */
let last=performance.now(), clock=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; clock+=dt;
  if(!SIM.on){
    let gdt=dt; // 보스·정예 처치 순간 잠깐 느려졌다가 부드럽게 정상 속도로 (화면 연출 전용, 시뮬레이션에는 영향 없음)
    if(state==='play'&&run&&run.slowmo>0){ const k=run.slowmo; run.slowmo=Math.max(0,k-dt); gdt=dt*(k>.25?.3:.3+.7*(1-k/.25)); }
    try{ if(state==='play'&&run) update(gdt); render(gdt,clock); }
    catch(err){ if(!frame.warned){ frame.warned=true; console.error('프레임 오류(계속 진행):',err); } try{ ctx.setLineDash([]); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; }catch(e){} } }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
Store.init().then(async()=>{
  modeLine();
  // Firebase 버전: 이전에 로그인한 기기라면 바로 이어하기
  if(Store.mode==='firebase'&&Store.fb.auth.currentUser&&state==='login'){
    const u=Store.fb.auth.currentUser, id=(u.email||'').replace(FB_DOMAIN,'');
    try{ const a=await fbLoadSave(u,id); if(state==='login'){ useAccount(a); openOffice(); toastOffice(`${a.id} 계정으로 자동 로그인했습니다.`); } }catch(e){}
  }
});
modeLine();

// 자동 플레이 시뮬레이션 (밸런스 측정용): window.__JOGONG_SIM__
Object.defineProperty(window,'__JOGONG_SIM__',{value:{
  reset(){ SIM.on=true; SIM.bot=true; save=freshSave(); session=null; guest=true; testMode=true; },
  play(stage,maxSec){
    SIM.on=true; SIM.bot=true; SIM.result=null; startStage(stage); hideAll();
    const dt=1/30; let n=0; const lim=(maxSec||200)*30;
    while(!SIM.result&&n++<lim) update(dt);
    const r=SIM.result||{cleared:false,timeout:true,stage,level:save.level}; r.elites=run.elitesKilled; r.combo=run.bestCombo; r.goldRun=run.goldEarned;
    r.src=Object.fromEntries(Object.entries(run.dmg).map(([k,v])=>[k,Math.round(v)])); r.lvAfter=save.level; r.gold=save.gold; r.sp=save.sp; r.spent=SKILLS.reduce((a,x)=>a+sk(x.id),0); r.weapon=equipped().type+'+'+equipped().plus; r.hp=P?Math.round(P.hp):0; r.maxHp=stats().maxHp;
    return r;
  },
  spendAndGear(){
    autoSkills();
    const best=[...save.inv].filter(it=>WEAPON[it.type].req<=save.level).sort((a,b)=>tierIdx(b.type)-tierIdx(a.type)||b.plus-a.plus)[0]; if(best) save.equip.weapon=best.uid;
    let g=0; while(g++<40){const it=equipped(); if(it.plus>=MAX_PLUS||save.gold<enhCost(it)*1.5) break; save.gold-=enhCost(it); if(Math.random()<ENH_RATE[it.plus]) it.plus++;}
  },
  drawRay, bossDef, save:()=>save, stats:()=>stats(), xpToNext, CFG, XPC, FISH, setXPC(o){Object.assign(XPC,o);}, setCFG(o){Object.assign(CFG,o);},
  stop(){ SIM.on=false; SIM.bot=false; run=null; state='login'; show('#login'); },
}});

})();
</script>
