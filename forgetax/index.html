<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ForgeTax · 용의 대장간</title>
<!-- 웹사이트(GitHub)에서는 조공 게임과 같은 Firebase 설정을 불러옴. 파일로 열면 없어도 됨 -->
<script src="../firebase-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 어둡고 뜨거운 대장간, 짧고 위협적인 용의 말투
   IDEA: 1인칭 대장간 — 모루·용광로·조공 창구를 둘러보는 시선
   PICTURE: 캔버스 전체가 대장간 방, 모루 클로즈업, 철창 너머 용의 눈
   COLOUR and TYPE: 숯검정 바탕, 불씨 주황, 황동, 뼈색 글자 / Gowun Batang + Noto Sans KR
   LAYOUT: 화면 꽉 찬 캔버스 위에 상단 HUD, 하단 시선 이동 바, 모달 패널 */
:root{--bg:#0b0806;--ink:#efe3cf;--dim:#a8977f;--ember:#ff7a2a;--brass:#c9a25c;--red:#ff4a3a;--panel:rgba(20,14,10,.94);--line:rgba(201,162,92,.28)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans KR",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#gl,canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block}canvas#cv{cursor:crosshair}
#touch{position:fixed;inset:0;pointer-events:none}#joy{position:fixed;left:18px;bottom:22px;width:124px;height:124px;border-radius:50%;border:2px solid rgba(201,162,92,.45);background:rgba(10,7,5,.35);pointer-events:auto;touch-action:none}#knob{position:absolute;left:37px;top:37px;width:50px;height:50px;border-radius:50%;background:rgba(255,160,90,.55)}#useBtn{position:fixed;right:18px;bottom:34px;width:84px;height:84px;border-radius:50%;pointer-events:auto;font-size:17px;font-weight:700}
.menuBtn{margin-top:6px;min-height:32px;padding:3px 10px;font-size:12px}
.hide{display:none!important}
button{font:inherit;color:var(--ink);background:#2a1d14;border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:40px;cursor:pointer}
button:hover{background:#3a281a;border-color:var(--brass)}
button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
button.hot{background:#7a2e10;border-color:var(--ember)}
button.hot:hover{background:#9a3a14}
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;gap:10px;padding:10px 14px;pointer-events:none;font-size:14px;text-shadow:0 1px 3px #000}
#hud .box{background:rgba(10,7,5,.62);border:1px solid var(--line);border-radius:10px;padding:8px 12px;pointer-events:auto}
#hud b{color:var(--brass);font-weight:700}
.big{font-size:18px;font-weight:900;color:var(--ink)}
.anger{display:inline-flex;gap:4px;vertical-align:middle;margin-left:6px}
.anger i{width:12px;height:12px;transform:rotate(45deg);border:1px solid #ff6a4a;display:inline-block}
.anger i.on{background:#ff3b2a;box-shadow:0 0 8px #ff3b2a}
#shelfbar{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;max-width:300px}
.chip{font-size:11px;padding:2px 6px;border-radius:6px;border:1px solid var(--line);background:#1c140e;cursor:pointer;pointer-events:auto;white-space:nowrap}
.r-C{border-color:#8f8f8f}.r-R{border-color:#4aa3ff;color:#bfe0ff}.r-L{border-color:#ffb02e;color:#ffe2a6}
#hint{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:rgba(10,7,5,.7);border:1px solid var(--line);border-radius:20px;padding:6px 16px;font-size:14px;pointer-events:none;white-space:nowrap}
#hand{position:fixed;right:14px;bottom:76px;background:rgba(10,7,5,.72);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;max-width:240px;pointer-events:none}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:10px;flex-wrap:wrap;background:linear-gradient(transparent,rgba(0,0,0,.7))}
#nav button{min-height:44px;font-size:13px;padding:6px 10px}
#nav button.cur{border-color:var(--ember);color:#ffd2b0}
#anvilui{position:fixed;left:0;right:0;bottom:0;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;background:linear-gradient(transparent,rgba(0,0,0,.75))}
#anvilui .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#anvilui .cons button{font-size:12px;padding:6px 10px}
#anvilui .cons button.sel{border-color:var(--brass)}
#anvilui .cons button.arm{background:#5a3a0e;border-color:#ffc04a}
#anvilui small{color:var(--dim);text-align:center}
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:30}
#toast div{background:rgba(25,15,8,.92);border:1px solid var(--brass);border-radius:8px;padding:6px 14px;font-size:14px;animation:tf 2.8s forwards}
@keyframes tf{0%{opacity:0;transform:translateY(-6px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#dlg{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:min(720px,94vw);background:var(--panel);border:1px solid var(--brass);border-radius:12px;padding:16px 20px;z-index:40;cursor:pointer}
#dlg b{font-family:"Gowun Batang",serif;color:var(--ember);font-size:17px}
#dlg p{margin:6px 0 4px;font-family:"Gowun Batang",serif;font-size:18px;line-height:1.6}
#dlg small{color:var(--dim)}
#panel{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:35;padding:12px}
.pbox{width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--brass);border-radius:14px;padding:16px 18px;user-select:text}
.pbox header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.pbox h2{margin:0;font-family:"Gowun Batang",serif;font-size:24px;color:#ffd9b0}
.pbox h3{margin:14px 0 6px;font-size:14px;color:var(--brass);font-weight:700}
.sw{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-left-width:6px;border-radius:8px;margin:5px 0;background:#18110c}
.sw .t{flex:1}
.sw .n{font-weight:700}
.sw .m{font-size:12px;color:var(--dim)}
.sw .v{font-weight:900;color:#ffd27a;white-space:nowrap;text-align:right}
.sw.sel{background:#33200e;border-color:var(--ember)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.card{border:1px solid var(--line);border-radius:10px;padding:10px;background:#18110c;display:flex;flex-direction:column;gap:6px}
.card .n{font-weight:900;font-size:16px}
.card .d{font-size:13px;color:#d8c9b2;flex:1}
.card.sold{opacity:.35}
.shelf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.slot{border:1px dashed var(--line);border-radius:8px;min-height:54px;padding:6px;font-size:12px;cursor:pointer}
.slot.f{border-style:solid;background:#1c140e}
.slot.sel{border-color:var(--ember);background:#33200e}
.sum{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:10px;border-radius:10px;background:#20160f;border:1px solid var(--line);margin:8px 0;font-size:15px}
.ok{color:#8fe08a}.bad{color:#ff7a6a}
.muted{color:var(--dim);font-size:13px}
#screen{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at 50% 70%,rgba(120,40,10,.35),rgba(0,0,0,.92) 70%)}
.sbox{width:min(620px,100%);max-height:94vh;overflow:auto;text-align:center;user-select:text}
.sbox h1{font-family:"Gowun Batang",serif;font-size:clamp(40px,9vw,72px);line-height:1.05;margin:0 0 6px;color:#ffcf9a;text-shadow:0 0 30px rgba(255,110,30,.55);letter-spacing:.02em}
.sbox h2{font-family:"Gowun Batang",serif;font-size:30px;margin:0 0 10px;color:#ffcf9a}
.sbox p{color:#d8c9b2}
.sbox .btns{display:flex;flex-direction:column;gap:8px;max-width:320px;margin:18px auto}
.sbox .btns button{min-height:48px;font-size:16px}
.help{text-align:left;font-size:14px;background:#140e0a;border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.help dt{color:var(--brass);font-weight:700;margin-top:6px}
.help dd{margin:0 0 4px 0}
input.acc{width:100%;min-height:46px;font:16px "Noto Sans KR",sans-serif;color:var(--ink);background:#120c08;border:1px solid var(--line);border-radius:8px;padding:10px 12px;user-select:text}input.acc:focus{outline:2px solid var(--ember);outline-offset:1px}
.accbox{max-width:320px;margin:18px auto 0;display:flex;flex-direction:column;gap:8px;text-align:left}.accmsg{min-height:20px;font-size:13px;color:#ff8a7a;text-align:center}
#hSave.ok{color:#8fe08a}#hSave.err{color:#ff7a6a}
textarea{width:100%;min-height:90px;background:#120c08;color:var(--ink);border:1px solid var(--line);border-radius:8px;font:12px monospace;padding:8px}
#hint{bottom:40px}#hand{bottom:24px}@media(pointer:coarse){#hint{bottom:160px}#hand{bottom:160px}}@media(max-width:600px){#hud{font-size:12px;padding:6px}#hud .box{padding:6px 8px}.big{font-size:15px}#hint{font-size:12px}#hand{font-size:12px;max-width:170px}#shelfbar{max-width:170px}}
</style>
</head>
<body>
<canvas id="gl"></canvas><canvas id="cv"></canvas>
<div id="hud" class="hide">
  <div class="box" id="hl"></div>
  <div class="box" id="hr" style="text-align:right"></div>
</div>
<div id="hint" class="hide"></div>
<div id="hand" class="hide"></div>
<div id="touch" class="hide"><div id="joy"><div id="knob"></div></div><button id="useBtn" class="hot">사용</button></div>
<div id="anvilui" class="hide">
  <div class="row cons" id="cons"></div>
  <div class="row" id="atouch">
    <button id="bStrike" class="hot" style="min-width:130px">타격 (누르고 있기)</button>
    <button id="bLeave">내려두고 나가기</button>
    <button id="bTake">검 들고 나가기</button>
  </div>
  <small>좌클릭 누르고 있기: 연속 타격 · 우클릭: 휘두르는 중 취소 / 내려두고 나가기 · E: 검 들기 · R: 되감기 · 1~5 선택 후 Q 사용</small>
</div>
<div id="fightui" class="hide" style="position:fixed;left:0;right:0;bottom:0;padding:12px;display:flex;justify-content:center;gap:10px">
  <button id="fAtk" class="hot" style="min-width:120px;min-height:52px">공격 (좌클릭)</button>
  <button id="fBlk" style="min-width:120px;min-height:52px">방어 (Space/우클릭 유지)</button>
</div>
<div id="toast"></div>
<div id="dlg" class="hide"><b id="dwho"></b><p id="dtxt"></p><small id="dhint">Space · 클릭으로 계속</small></div>
<div id="panel" class="hide"><div class="pbox"><header><h2 id="ptitle"></h2><button id="pclose">닫기 (Esc)</button></header><div id="pbody"></div></div></div>
<div id="screen"></div>

<script>
{
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,T=0;
const TOUCH=matchMedia('(hover: none) and (pointer: coarse)').matches;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);const g=$('gl'),k=Math.min(DPR,TOUCH?1.25:1.5);g.width=Math.round(W*k);g.height=Math.round(H*k)}
addEventListener('resize',resize);resize();
const fmt=n=>Math.round(n).toLocaleString('ko-KR');
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const wrap180=d=>((d%360)+540)%360-180;
const FONT='"Noto Sans KR",sans-serif',SERIF='"Gowun Batang",serif';

/* ---------- 소리 ---------- */
let AC=null,OUT=null,REV=null;
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();const c=AC.createDynamicsCompressor();c.threshold.value=-14;c.ratio.value=4;c.connect(AC.destination);OUT=AC.createGain();OUT.gain.value=.9;OUT.connect(c);
 const len=AC.sampleRate*1.8,ir=AC.createBuffer(2,len,AC.sampleRate);for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2)}REV=AC.createConvolver();REV.buffer=ir;const wet=AC.createGain();wet.gain.value=.28;REV.connect(wet);wet.connect(c)}catch(e){}}
 if(AC&&AC.state==='suspended')AC.resume();return AC}
function env(g,t,a,v,d){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
function osc(f,d,v,type='sine',dl=0,rev=.6,slide=0){const a=au();if(!a)return;const t=a.currentTime+dl,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+d);env(g,t,.002,v,d);o.connect(g);g.connect(OUT);if(rev&&REV){const s=a.createGain();s.gain.value=rev;g.connect(s);s.connect(REV)}o.start(t);o.stop(t+d+.05)}
function nz(d,v,lo,hi,dl=0,rev=.4){const a=au();if(!a)return;const t=a.currentTime+dl,b=a.createBuffer(1,Math.floor(a.sampleRate*d)+1,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;
 const s=a.createBufferSource();s.buffer=b;const h=a.createBiquadFilter();h.type='highpass';h.frequency.value=lo;const l=a.createBiquadFilter();l.type='lowpass';l.frequency.value=hi;const g=a.createGain();env(g,t,.001,v,d);s.connect(h);h.connect(l);l.connect(g);g.connect(OUT);if(rev&&REV){const r=a.createGain();r.gain.value=rev;g.connect(r);r.connect(REV)}s.start(t)}
const SFX={
 anvil(p=1,v=1){const f=rnd(830,900)*p;[[1,1.6,.11],[2.76,1.1,.06],[5.4,.7,.04],[8.93,.45,.025],[13.3,.3,.015]].forEach(([r,d,a])=>osc(f*r,d,a*v,'sine',0,.7));osc(f*1.006,1.4,.05*v,'triangle',0,.5);nz(.05,.35*v,2500,9000);osc(95,.18,.3*v,'sine',0,.1,.45);nz(.12,.18*v,60,400,0,.1)},
 clang(p=1){SFX.anvil(p,1)},
 great(){SFX.anvil(1.12,1.25);[0,4,7,12,16].forEach((sm,i)=>osc(660*Math.pow(2,sm/12),1.3,.045,'sine',.06+i*.055,.9));nz(.5,.06,4000,12000,.05,.8)},
 hold(){osc(rnd(500,560),.35,.06,'triangle',0,.4);osc(1220,.2,.02,'sine',0,.4);nz(.04,.15,1200,5000);osc(80,.15,.22,'sine',0,0,.5)},
 dmg(){osc(210,.5,.08,'sawtooth',0,.3,.6);osc(330,.3,.05,'square',0,.2,.7);nz(.3,.22,200,1500,0,.3);osc(70,.25,.3,'sine',0,0,.5)},
 brk(){nz(1.1,.45,500,9000,0,.8);nz(.25,.5,60,500,0,.2);for(let i=0;i<14;i++)osc(rnd(2200,6500),rnd(.08,.4),.03,'sine',rnd(0,.35),.9);osc(140,.9,.12,'sawtooth',0,.4,.3);osc(55,.6,.4,'sine',0,0,.6)},
 whoosh(){nz(.16,.05,300,1800,0,0)},
 bell(){[1,2.01,2.92,4.1,5.4].forEach((r,i)=>osc(392*r,2.6-i*.35,.12/(i+1),'sine',0,.9))},
 coin(){osc(1320,.12,.05,'square',0,.3);osc(1760,.16,.05,'square',.07,.3)},
 fire(){nz(.5,.07,200,2000)},
 frenzy(){osc(110,.9,.12,'sawtooth',0,.6,5);nz(.8,.2,300,5000,0,.6);osc(55,1,.3,'sine',0,.2,2)},
 roar(){nz(1.6,.35,60,900,0,.6);osc(70,1.5,.2,'sawtooth',0,.5,.55);osc(105,1.3,.12,'sawtooth',.05,.5,.5)},
 click(){osc(900,.04,.03,'square',0,0)}};

/* ---------- 규칙 데이터 ---------- */
const BREAK_P=[0,1.8,5.9,12.9,24.8,29.7,34.7,38.3,41.8,44.3,46.7,49.1,50.5,51.9,53.2,54.5,55.8,57.6,59.4,61.2,63.0,63.9,64.8,65.7,66.6,67.5,68.4,69.3,70.2,71.1,72.0];
const breakW=g=>{const p=BREAK_P[Math.min(Math.max(g,0),30)]/100;return 21*p/(1-p)};
const quotaBase=d=>{const v=1800*Math.pow(1.3,d-1)*Math.pow(1.011,(d-1)*(d-1)),p=Math.pow(10,Math.floor(Math.log10(v))-2);return Math.round(v/p)*p};
const dateOf=d=>{const x=new Date(2026,3,14+d);return `${x.getMonth()+1}월 ${x.getDate()}일`};
const PILES=['B','D','H','S','G'];
const PN={B:'파괴',D:'손상',H:'유지',S:'성공',G:'대성공'};
const PC={B:'#ff3b3b',D:'#ff9a3c',H:'#9aa0a8',S:'#6fdc7a',G:'#ffd24a'};
const FAMS=['citadel','holy','saw','fang','rune','split'];
const FAMN={basic:'기본',citadel:'성채',holy:'성검',saw:'톱날',fang:'용아',rune:'룬검',split:'분열검',tree:'세계수',fish:'어검',funeral:'장례검'};
const SHARED=['낡은 검','다듬은 검','쓸만한 철검'];
const LANE6=['두꺼운 철검','성난 쇳덩이','마력의 파편'],LANE8=['휴대용 철문','물어뜯는 칼날','깨어나는 칼날'];
const FORMS={
 citadel:['뭔가 이상한 대검','이중 장갑 대검','경첩째 뜯어낸 성문','손잡이 달린 요새','산을 부수는 성채','대륙을 가르는 철의 성채'],
 holy:['빛에 묶인 은검','축복받은 검','여명검','자격 있는 왕의 검','약속된 새벽의 검','엑스칼리버'],
 saw:['톱이야 검이야?','갑옷을 씹는 톱날','맞물린 강철 톱날','강철 분쇄기','산을 자르는 톱','멈추지 않는 파멸의 톱니'],
 fang:['어린 용의 송곳니','용비늘 검','곤두선 용검','날개 돋친 와이번검','용왕의 숨결검','마검 드래곤슬레이어'],
 rune:['룬이 새겨진 검','각성하는 룬검','과충전된 검','대마법사의 비전 엔진','현실을 깨는 검','창세의 검 아카샤'],

 async init(){const cfg=window.JOGONG_FIREBASE;if(!(cfg&&cfg.apiKey))return;

function fbError(e){const c=(e&&e.code)||'';
 if(c.includes('email-already-in-use'))return '이미 있는 아이디예요. 조공 게임·홀덤 계정이면 그 아이디로 바로 로그인하세요.';
 if(c.includes('weak-password'))return '비밀번호는 6자 이상이어야 해요.';
 if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found')||c.includes('invalid-login'))return '아이디 또는 비밀번호가 맞지 않아요.';
 if(c.includes('too-many-requests'))return '시도가 너무 많아요. 잠시 후 다시 해 주세요.';if(c.includes('network'))return '인터넷 연결을 확인해 주세요.';
 if(c.includes('permission-denied'))return '저장 권한이 없어요. Firestore 보안 규칙에 forgetax_saves를 추가했는지 확인하세요.';
 return '처리하지 못했어요. ('+(c||(e&&e.message)||'unknown')+')'}
async function openSession(user,idHint){let d=null;try{const snap=await Acc.fb.fs.collection(FB_COL).doc(user.uid).get();d=snap.exists?snap.data():null}catch(e){if(String(e&&e.code).includes('permission'))throw e}
 SESSION={id:(d&&d.id)||idHint||String(user.email||'').split('@')[0],uid:user.uid,created:(d&&d.created)||Date.now()};GUEST=false;
 let m={};try{m=d&&d.meta?JSON.parse(d.meta):{}}catch(_){}CLOUD={save:d&&d.save||null,meta:m};
 const g=localGet(SK);if(!CLOUD.save&&g){CLOUD.save=g;try{CLOUD.meta=Object.assign(JSON.parse(localGet(MK)||'{}'),CLOUD.meta)}catch(_){}cloudPush(true);toast('이 브라우저의 게스트 진행을 계정으로 옮겼어요')}}

 const em=id.toLowerCase()+FB_DOMAIN;let cred;try{cred=make?await Acc.fb.auth.createUserWithEmailAndPassword(em,pw):await Acc.fb.auth.signInWithEmailAndPassword(em,pw)}catch(e){throw new Error(fbError(e))}
 try{await openSession(cred.user,id)}catch(e){throw new Error(fbError(e))}if(make)cloudPush(true)}
async function accLogout(){await flushPush();try{await Acc.fb.auth.signOut()}catch(_){}SESSION=null;CLOUD={save:null,meta:{}};G=null}

const slot=()=>SESSION?SK+'_'+SESSION.uid:SK;

function clearSave(){try{localStorage.removeItem(slot())}catch(e){}if(SESSION){CLOUD.save=null;cloudPush(true)}}

let pushT=null,pending=false,pushing=null,saveState='';
function setSaveState(t){saveState=t;const el=document.getElementById('hSave');if(el){el.textContent=t==='ok'?'· 저장됨':t==='busy'?'· 저장 중':t==='err'?'· 저장 실패':'';el.className=t}}
function cloudPush(now){if(!SESSION||Acc.mode!=='firebase')return;pending=true;setSaveState('busy');if(pushT)clearTimeout(pushT);pushT=setTimeout(doPush,now?0:2500)}
async function doPush(){pushT=null;if(!pending||!SESSION)return;pending=false;const s=SESSION;
 pushing=Acc.fb.fs.collection(FB_COL).doc(s.uid).set({id:s.id,save:CLOUD.save,meta:JSON.stringify(CLOUD.meta||{}),created:s.created,updated:Date.now()}).then(()=>{if(!pending)setSaveState('ok')},e=>{setSaveState('err');console.warn(e);toast(fbError(e))});await pushing;pushing=null}

/* ---------- 검 ---------- */
function newSword(line='basic',lane=null,grade=0){
 G.sid++;
 return {id:G.sid,line,lane:lane==null?Math.floor(Math.random()*3):lane,branch:Math.random()<.5?0:1,grade,maxGrade:grade,base:line==='basic'?320:640,baseAdd:0,mult:1,flat:0,heated:false,charge:has('holysword')?3:0,loc:'floor',extraS:0,scorched:0,heart:0,wind:0,cSG:0,cH:0,last:null,same:0,firstDone:false,corner:false,phoenix:false,damaged:false,best:0,die:0,f:{}};
}
const famKey=s=>s.line!=='basic'?s.line:FAMS[s.lane*2+s.branch];
const shapeKey=s=>s.line!=='basic'?s.line:(s.maxGrade>=10?famKey(s):'basic');
function formName(s){const g=s.maxGrade;
 if(s.line!=='basic')return FORMS[s.line][Math.min(10,Math.floor(g/2))];
 if(g<6)return SHARED[Math.floor(g/2)];if(g<8)return LANE6[s.lane];if(g<10)return LANE8[s.lane];
 return FORMS[famKey(s)][Math.min(5,Math.floor((g-10)/2))]}
function swordColor(s){const k=shapeKey(s);if(k==='basic'&&s.maxGrade>=6)return LANEC[s.lane];return COL[k].b}
function baseOf(s){let b=s.base+s.baseAdd;if(has('charcoal'))b+=80;if(has('hearth'))b+=20*G.fullPays;return b}
const coreAt=(s,g)=>baseOf(s)*Math.pow(1.5,g)*s.mult;
function val(s){let v=coreAt(s,s.grade)+s.flat;if(has('apron'))v+=250;let m=1;
 if(has('signet'))m*=1.15;if(has('thorn'))m*=1.1;if(has('blackstone')&&s.grade>=8)m*=1.3;if(has('dsignet')&&s.grade>=12)m*=1.5;if(has('kingseal')&&s.grade>=15)m*=1.25;if(has('oath')&&!s.damaged&&s.grade>=10)m*=1.3;if(has('lifetime'))m*=1.2;
 return Math.round(v*m)}
function isHot(){return true}

/* ---------- 덱 ---------- */
function deckOf(s,fr,arm){arm=arm||{};const f=s.f||{};
 let w=has('sickle')?{B:5,D:5,H:5,S:5,G:5}:{B:breakW(s.grade),D:2,H:5,S:12,G:2};
 const mv=(a,b,n)=>{const m=Math.min(n,w[a]);w[a]-=m;w[b]+=m};
 if(has('bentnail'))w.S+=4;if(has('luckycoal'))w.G+=2;if(has('sealstone'))w.H+=2;if(has('patient'))w.H+=3;
 if(has('whetstone'))mv('H','S',2);if(has('mallet'))mv('D','S',1);if(has('ashsieve'))mv('D','H',1);if(has('thorn'))mv('H','D',3);
 if(has('splice'))w.D+=2;if(has('molar')&&s.grade<=4)w.D=0;
 if(has('goldnail')&&s.grade>=10)w.S+=3;if(has('blinddie'))w.S+=s.die||0;
 w.S+=s.extraS||0;if(f.eye)w.S+=4;
 if(has('butter')){w.B*=1.3;w.G+=5}
 if(has('ironhoop'))w.B*=7/9;
 if(fr&&has('manacore'))w.G+=6;if(fr&&has('crackedbell'))w.D=0;
 if(f.grudge)w.G*=2;if(arm.chalk)w.G*=2;
 const tot=PILES.reduce((a,k)=>a+w[k],0),p={};PILES.forEach(k=>p[k]=w[k]/tot);
 let bm=1;if(has('blackknot'))bm*=.9;if(has('tongs')&&s.grade>=6)bm*=.75;if(has('splice'))bm*=.85;if(f.red)bm*=.8;if(f.light)bm*=.6;bm*=1-(s.scorched||0);
 if(fr||arm.scale||(has('brand')&&!s.firstDone))bm=0;
 const nb=p.B*bm,freed=p.B-nb,rest=1-p.B;p.B=nb;
 if(rest>0)['D','H','S','G'].forEach(k=>p[k]+=freed*p[k]/rest);else p.H+=freed;
 if(arm.powder&&!fr){const g=p.S+p.G;p.B=p.B+p.D+p.H;p.D=0;p.H=0;p.S=0;p.G=g}
 const raw=PILES.map(k=>p[k]*1000),fl=raw.map(Math.floor);let left=1000-fl.reduce((a,b)=>a+b,0);
 const ord=raw.map((r,i)=>[r-fl[i],i]).sort((a,b)=>b[0]-a[0]);for(let i=0;i<left;i++)fl[ord[i%5][1]]++;
 const out={};PILES.forEach((k,i)=>out[k]=fl[i]);return out}
function ticketRes(d,t){let a=0;for(const k of PILES){a+=d[k];if(t<a)return k}return 'G'}

/* ---------- 진행 ---------- */
function quota(){let q=quotaBase(G.day);if(has('rebate'))q*=.9;q=Math.max(0,q-G.credit);return Math.round(q)}
function newRun(){
 G={day:1,gold:0,fails:0,fullPays:0,extPays:0,credit:0,relics:[],swords:[],sid:0,items:{scale:0,regret:0,chalk:0,powder:0,star:0},shop:null,merch:null,wireUsed:false,freeRoll:0,incenseUsed:false,contract:false,deliverExtra:0,thrown:false,stats:{best:0,bestG:0,breaks:0,strikes:0},nextTicket:Math.floor(Math.random()*1000),over:false};
 resetPlayer();resetAnvilUI();startDay();
}
function resetAnvilUI(){UI.frenzy=false;UI.swing=null;UI.armed={};UI.snap=null;UI.hold=false;UI.heating=null}
function startDay(){
 G.wireUsed=false;G.freeRoll=has('voucher')?1:0;
 const n=3+(has('twins')?1:0)+G.deliverExtra;G.deliverExtra=0;
 const lanes=shuffle([0,1,2]);
 for(let i=0;i<n;i++){const s=newSword('basic',i<3?lanes[i]:null);store(s);G.swords.push(s)}
 G.shop={offers:[],rolls:0,starter:G.day===1};rollShop();
 G.merch=G.day%3===0?makeMerch():null;
 save();setMode('room');
 const L=[];
 if(G.day===1)L.push(...TUT);
 else{
  let m=`${dateOf(G.day)}, ${G.day}일차. 해치로 검 ${n}자루가 들어왔다.`;
  if(G.thrown)m=`${dateOf(G.day)}, ${G.day}일차. 오늘 검 ${n}자루는 철창 너머에서 내던져졌다. 용이 화가 나 있다.`;
  L.push(['',m]);
  if(G.merch)L.push(['','창고 구석에서 푸른 등불이 흔들린다. 유령 상인이 왔다.']);
  if(G.day===2)L.push(['','유물 기계가 덜컹거린다. 이제부터는 검을 먹여야 유물을 내준다.']);
 }
 G.thrown=false;
 say(L);
}
function nextDay(){G.day++;startDay()}

/* ---------- 유물 기계 ---------- */
function rollShop(){
 const sh=G.shop;
 if(sh.starter){const pool=shuffle(RELICS.filter(r=>r.start&&!has(r.id))).slice(0,3);sh.offers=pool.map(r=>({id:r.id,cost:0}));return}
 const d=G.day,odds=d<=3?[85,15,0]:d<=5?[75,22,3]:d<=9?[70,25,5]:[60,30,10];
 const taken=[];sh.offers=[];
 for(let i=0;i<3;i++){
  const x=Math.random()*100;let rar=x<odds[0]?'C':x<odds[0]+odds[1]?'R':'L';
  let pool=RELICS.filter(r=>r.r===rar&&r.d<=d&&!has(r.id)&&!taken.includes(r.id));
  if(!pool.length)pool=RELICS.filter(r=>r.d<=d&&!has(r.id)&&!taken.includes(r.id));
  if(!pool.length){sh.offers.push(null);continue}
  const r=pick(pool);taken.push(r.id);sh.offers.push({id:r.id,cost:RCOST[r.r]});
 }
}
const rerollCost=()=>Math.round(Math.max(150,.15*quotaBase(G.day))*Math.pow(2.5,G.shop.rolls));

function makeMerch(){const q=quotaBase(G.day),d=G.day,items=[];
 items.push({k:'sword',n:'평범한 검 +0',desc:'해치로 들어오는 것과 같은 일반 검',p:Math.max(700,Math.round(q*.4)),b:0});
 const line=pick(['tree','fish','funeral']),sg=d>=15?4:d>=9?2:0;
 items.push({k:'special',line,g:sg,n:`${FORMS[line][Math.floor(sg/2)]} +${sg}`,desc:`${FAMN[line]} 계열 · 유령 상인 전용, 기본 가치 2배 (640 G)`,p:Math.round(Math.max(1100,1.1375*q)*(sg===4?2.4:sg===2?1.6:1)),b:0});
 for(const c of CONS)if(d>=c.d&&(c.k!=='incense'||(G.fails>0&&!G.incenseUsed)))items.push({k:c.k,n:c.n,desc:c.desc,p:Math.round(c.p*Math.pow(q/quotaBase(c.d),.6)),b:0});
 return{items}}

   h+=`<div class="cards">${sh.offers.map((o,i)=>{if(!o)return `<div class="card sold"><div class="n">빈 상자</div></div>`;if(o.sold)return `<div class="card sold"><div class="n">${RB[o.id].n}</div><div class="d">팔림</div></div>`;const r=RB[o.id];return `<div class="card"><div class="n r-${r.r}" style="border:0">${r.n}</div><div class="muted">${RNAME[r.r]}</div><div class="d">${r.desc}</div><button data-a="buy:${i}" class="hot" ${G.relics.length>=8?'disabled':''}>${sh.starter?'받기':`검 ${o.cost}자루 투입`}</button></div>`}).join('')}</div>`;
   if(!sh.starter){const free=G.freeRoll>0;h+=`<div style="margin-top:10px"><button data-a="reroll" ${!free&&G.gold<rerollCost()?'disabled':''}>새로고침 · ${free?'무료 (쿠폰)':fmt(rerollCost())+' G'}</button> <span class="muted">보유 ${fmt(G.gold)} G</span></div>`}

   h+=`<h3>선반 (${G.relics.length}/8)</h3><div class="shelf">${Array.from({length:8},(_,i)=>{const id=G.relics[i];return id?`<div class="slot f ${UI.shelfSel===i?'sel':''}" data-a="shelf:${i}"><b class="r-${RB[id].r}" style="border:0">${RB[id].n}</b></div>`:`<div class="slot"></div>`}).join('')}</div>`;
   if(UI.shelfSel>=0&&G.relics[UI.shelfSel]){const r=RB[G.relics[UI.shelfSel]];h+=`<div class="sum"><span><b>${r.n}</b> · ${RNAME[r.r]} — ${r.desc}</span><button data-a="discard">버리기 (X) · 환불 없음</button></div>`}

 b.innerHTML=h}
$('pbody').addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;SFX.click();const [a,v]=el.dataset.a.split(':'),id=+v,s=G.swords.find(x=>x.id===id);
 if(a==='take'&&s){const h=inHand();if(h)store(h);s.loc='hand';if(h&&s.loc==='hand'&&rackN()>3)h.loc='floor'}
 else if(a==='drop'){const h=inHand();if(h)store(h)}
 else if(a==='on'&&s)s.loc='counter';
 else if(a==='off'&&s){if(!inHand())s.loc='hand';else store(s)}
 else if(a==='bell'){const c=G.swords.filter(x=>x.loc==='counter');let t=c.reduce((q,x)=>q+val(x),0)*(has('cup')&&c.length>=3?1.15:1);if(t<quota()){UI.confirmBell=true}else return ringBell()}
 else if(a==='bellgo')return ringBell();
 else if(a==='bellno')UI.confirmBell=false;
 else if(a==='fight'){closePanel();return fightPick()}
 else if(a==='buy'){const o=G.shop.offers[id];if(!o||G.relics.length>=8)return;
  if(G.shop.starter){G.relics.push(o.id);G.shop.starter=false;G.shop.offers=[];toast(`${RB[o.id].n}을(를) 받았다`);SFX.coin();closePanel();save();return}
  UI.buy={i:id,sel:[]}}
 else if(a==='feed'){const i=UI.buy.sel.indexOf(id),need=G.shop.offers[UI.buy.i].cost;if(i>=0)UI.buy.sel.splice(i,1);else if(UI.buy.sel.length<need)UI.buy.sel.push(id)}
 else if(a==='feedok'){const o=G.shop.offers[UI.buy.i];G.swords=G.swords.filter(x=>!UI.buy.sel.includes(x.id));G.relics.push(o.id);o.sold=true;UI.buy=null;SFX.coin();toast(`${RB[o.id].n} 획득`)}
 else if(a==='feedno')UI.buy=null;
 else if(a==='reroll'){if(G.freeRoll>0)G.freeRoll--;else{const c=rerollCost();if(G.gold<c)return;G.gold-=c;G.shop.rolls++}rollShop();SFX.coin()}
 else if(a==='shelf')UI.shelfSel=UI.shelfSel===id?-1:id;
 else if(a==='discard')discardRelic();
 else if(a==='m'){const it=G.merch.items[id],pr=mPrice(it);if(G.gold<pr)return;G.gold-=pr;it.b++;SFX.coin();
  if(it.k==='sword'){const n=newSword('basic');store(n);G.swords.push(n);toast('검을 샀다 — 거치대/바닥에 있다')}
  else if(it.k==='special'){const n=newSword(it.line,null,it.g);store(n);G.swords.push(n);toast(`${formName(n)} +${n.grade} 구입`)}
  else if(it.k==='note'){G.deliverExtra+=2;toast('내일 배달에 검 2자루가 추가된다')}
  else if(it.k==='incense'){G.fails=Math.max(0,G.fails-1);G.incenseUsed=true;G.merch.items.splice(id,1);toast('향이 피어오른다. 용의 분노가 가라앉았다')}
  else{G.items[it.k]++;toast(`${it.n} 구입`)}}
 save();refreshHUD();renderPanel()});
function discardRelic(){const i=UI.shelfSel;if(i<0||!G.relics[i])return;const n=RB[G.relics[i]].n;G.relics.splice(i,1);UI.shelfSel=-1;toast(`${n}을(를) 버렸다`);save();refreshHUD();renderPanel()}

const PASS={citadel:'첫 공격 한 번을 자동으로 막는다',holy:'막을 때마다 용에게 최대 체력 5% 피해',saw:'공격 시 20% 확률로 두 번 벤다',fang:'피해 ×1.5',rune:'방어 타이밍이 0.25초 길다',split:'3번째 공격마다 피해 2배',tree:'체력 +1',fish:'공격 속도 2배',funeral:'한 번 쓰러져도 체력 1로 일어난다',basic:'특별한 힘이 없다'};
function fightPick(){const av=G.swords.filter(s=>s.loc!=='counter').sort((a,b)=>val(b)-val(a));
 screen(`<h2>어떤 검을 들 것인가</h2><p class="muted">공격력 = 검 가치 ÷ 1,000. 용의 체력은 1,000. 지면 이번 판은 끝난다.</p><div style="text-align:left">${av.map(s=>{const k=shapeKey(s);return `<div class="sw" style="border-left-color:${swordColor(s)}"><div class="t"><div class="n">${formName(s)} +${s.grade}</div><div class="m">공격력 ${fmt(Math.max(1,Math.round(val(s)/1000)))} · ${PASS[k]}</div></div><div class="v">${fmt(val(s))} G</div><button class="hot" data-s="duel:${s.id}">이 검으로</button></div>`}).join('')||'<p>들 검이 없다.</p>'}</div><div class="btns"><button data-s="${G.day>=21&&!G.contract?'back-clear':'back-room'}">돌아가기</button></div>`)}
function startFight(id){const s=G.swords.find(x=>x.id===id);if(!s)return;const k=shapeKey(s);
 UI.fight={s,k,hp:1000,max:1000,php:k==='tree'?4:3,pmax:k==='tree'?4:3,st:'idle',next:T+2,tele:0,cd:0,hits:0,shield:k==='citadel',revive:k==='funeral',hurt:0,atkAnim:0,blk:0};
 UI.mode='fight';$('screen').classList.add('hide');setMode('fight');SFX.roar()}
function fightAttack(){const F=UI.fight;if(!F||F.st==='end'||T<F.cd||isBlocking())return;
 F.cd=T+(F.k==='fish'?.22:.45);F.hits++;let d=Math.max(1,Math.round(val(F.s)/1000));
 if(F.k==='fang')d=Math.round(d*1.5);if(F.k==='split'&&F.hits%3===0)d*=2;if(F.k==='saw'&&Math.random()<.2)d*=2;
 F.hp=Math.max(0,F.hp-d);F.atkAnim=T;SFX.clang();pop(`-${fmt(d)}`,'#ffd24a',1,-.1);sparks(16,'#ffb060');
 if(F.hp<=0)fightEnd(true)}
const isBlocking=()=>UI.blockKey||UI.blockBtn;
function fightEnd(win){const F=UI.fight;F.st='end';G.over=true;clearSave();
 if(win)setMeta(m=>m.kills=(m.kills||0)+1);
 setTimeout(()=>screen(win?`<h2>용이 쓰러졌다</h2><p style="font-family:${SERIF};font-size:18px">직접 벼린 ${formName(F.s)} +${F.s.grade}이(가) 용의 비늘을 갈랐다. 대장간의 불은 이제 너의 것이다.</p><p class="muted">${G.day}일차 · 최고 등급 +${G.stats.bestG} · 타격 ${fmt(G.stats.strikes)}회</p><div class="btns"><button class="hot" data-s="new">새 계약 시작</button><button data-s="title">타이틀로</button></div>`:`<h2>용의 발톱 아래</h2><p>복수는 다음 대장장이에게 맡겨야겠다.</p><div class="btns"><button class="hot" data-s="new">새 계약 시작</button><button data-s="title">타이틀로</button></div>`),1200)}
function updFight(){const F=UI.fight;if(!F||F.st==='end')return;
 if(F.st==='idle'&&T>F.next){F.st='tele';F.tele=T+.85+(F.k==='rune'?.25:0)}
 else if(F.st==='tele'&&T>F.tele){
  F.hitT=T;if(isBlocking()){SFX.clang();pop('막았다!','#9fd8ff',1.1,.15);F.blk=T;if(F.k==='holy'){const d=Math.round(F.max*.05);F.hp=Math.max(0,F.hp-d);pop(`성광 -${d}`,'#ffe58a',.9,-.1)}}
  else if(F.shield){F.shield=false;SFX.clang();pop('성채가 막았다','#9fb4c8',1,.15)}
  else{F.php--;F.hurt=T;F.hitT=T;UI.shake=.8;UI.flash=.4;SFX.dmg();
   if(F.php<=0){if(F.revive){F.revive=false;F.php=1;pop('무덤에서 일어났다','#b8a3ff',1.1)}else{SFX.roar();return fightEnd(false)}}}
  if(F.hp<=0)return fightEnd(true);
  F.st='idle';F.next=T+rnd(1.1,2.3)}}

 ctx.fillStyle='#ffe0b8';ctx.font=`900 ${Math.max(34,H*.07)}px ${SERIF}`;ctx.fillText(`+${s.grade}`,ix,iy+Math.max(38,H*.07));ctx.fillStyle='#ffd27a';ctx.font=`900 ${Math.max(18,H*.032)}px ${FONT}`;ctx.fillText(`${fmt(val(s))} G`,ix,iy+Math.max(66,H*.115));
 const sg=Object.assign({},s,{grade:s.grade+1}),gg=Object.assign({},s,{grade:s.grade+2,mult:s.mult*2.5/2.25});ctx.fillStyle='#d8c9b2';ctx.font=`${Math.max(11,H*.017)}px ${FONT}`;ctx.fillText(`성공 시 ${fmt(val(sg))} G · 대성공 시 ${fmt(val(gg))} G`,ix,iy+Math.max(88,H*.15));
 const tags=[];if(s.heart)tags.push(`심장 +${s.heart}`);if(s.wind)tags.push(`풍경 +${s.wind}`);if(s.f.red)tags.push('붉은 실');if(s.f.eye)tags.push('제3의 눈');if(s.f.grudge)tags.push('원한');if(s.f.light)tags.push('번개');if(s.scorched)tags.push(`그을림 -${Math.round(s.scorched*100)}%`);
 Object.keys(UI.armed).forEach(k=>{if(UI.armed[k])tags.push(CONS.find(c=>c.k===k).n+' 장전')});if(tags.length){ctx.fillStyle='#ffc890';ctx.fillText(tags.join(' · '),ix,iy+Math.max(108,H*.18))}
 ctx.textAlign='right';ctx.fillStyle='#d8c9b2';ctx.fillText(`${dateOf(G.day)} · 할당량 ${fmt(quota())} G`,W-16,iy);ctx.shadowBlur=0;drawPops()}
function overlayFight(){const F=UI.fight;const bw=Math.min(W*.8,600);ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect((W-bw)/2,18,bw,16);ctx.fillStyle='#d0301a';ctx.fillRect((W-bw)/2,18,bw*F.hp/F.max,16);ctx.fillStyle='#fff';ctx.font=`700 13px ${FONT}`;ctx.textAlign='center';ctx.fillText(`용 ${fmt(F.hp)} / ${fmt(F.max)}`,W/2,31);
 if(F.st==='tele'){ctx.fillStyle='#fff';ctx.shadowColor='#f00';ctx.shadowBlur=20;ctx.font=`900 ${Math.min(W,H)*.06}px ${FONT}`;ctx.fillText('방어!',W/2,H*.7);ctx.shadowBlur=0}
 for(let i=0;i<F.pmax;i++){ctx.fillStyle=i<F.php?'#ff4a3a':'rgba(255,255,255,.15)';ctx.save();ctx.translate(30+i*30,H-100);ctx.rotate(Math.PI/4);ctx.fillRect(-9,-9,18,18);ctx.restore()}
 ctx.fillStyle='#d8c9b2';ctx.font=`13px ${FONT}`;ctx.textAlign='left';ctx.fillText(`${formName(F.s)} +${F.s.grade} · ${PASS[F.k]}`,16,H-128);drawPops()}

/* ================= 메인 루프 ================= */
let last=performance.now()/1000,hudT=0;
function timeScale(){return T<UI.stopUntil?0:T<UI.slowUntil?.3:1}
function frame(){const now=performance.now()/1000,dt=Math.min(.05,now-last);last=now;T=now;const sdt=dt*timeScale();UI.at+=sdt;
 if(G&&!G.over){
  if(UI.mode==='room'){if(!dlgOpen()&&!UI.panel)updPlayer(dt);updFocus()}
  if(UI.mode==='anvil'){if(UI.frenzy&&T>=UI.frenzyEnd)endFrenzy(true);
   const sw=UI.swing;if(sw){if(!sw.hit&&UI.at>=sw.impact){sw.hit=true;doStrike()}if(UI.at>=sw.end)UI.swing=null}
   if(UI.hold&&!UI.swing&&UI.at>=UI.nextReady&&onAnvil()&&!dlgOpen()&&!UI.panel){const sp=curSpeed(),fs=UI.frenzy?.75:1;UI.swing={t0:UI.at,wind:UI.at+.13*fs/sp,impact:UI.at+.2*fs/sp,end:UI.at+.5*fs/sp,hit:false};UI.nextReady=UI.at+.64/sp;SFX.whoosh&&SFX.whoosh()}}
  if(UI.mode==='fight')updFight()}
 UI.shake=Math.max(0,UI.shake-dt*2.6);UI.punch=Math.max(0,UI.punch-dt*5);UI.hitL=Math.max(0,UI.hitL-dt*7);UI.breathL=Math.max(0,(UI.breathL||0)-dt*3);UI.swordJump=Math.max(0,UI.swordJump-sdt*5);UI.flashP=Math.max(0,UI.flashP-dt*2.2);UI.redP=Math.max(0,UI.redP-dt*1.2);
 ambient(dt);updParts(sdt);updFX(sdt);
 try{render3D(dt,sdt)}catch(err){console.error(err)}
 ctx.clearRect(0,0,W,H);if(G&&!G.over){if(UI.mode==='anvil')overlayAnvil();else if(UI.mode==='fight'&&UI.fight)overlayFight();else if(UI.mode==='room')overlayRoom()}
 if(UI.flash>0){ctx.fillStyle=`rgba(255,40,20,${UI.flash})`;ctx.fillRect(0,0,W,H);UI.flash=Math.max(0,UI.flash-dt*1.5)}
 if(UI.mode==='room'&&G){hudT-=dt;const n=UI.focus;$('hint').textContent=hintText(n);$('hint').classList.toggle('hide',!n||dlgOpen()||!!UI.panel);if(hudT<=0){hudT=.5;refreshHUD()}}
 requestAnimationFrame(frame)}
if(!gl){screen(`<h2>WebGL을 쓸 수 없어요</h2><p>이 브라우저나 기기에서 3D 그래픽(WebGL)이 꺼져 있어요. 최신 Chrome·Edge·Safari에서 열어 주세요.</p>`)}
else{try{PM=prog(VS,FS);PP=prog(PVS,PFS);PBUF=gl.createBuffer();initPost();gl.enable(gl.DEPTH_TEST);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.disable(gl.CULL_FACE);
 initTex();initMats();buildScene();{const im=new Image();im.onload=()=>{const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);gl.generateMipmap(gl.TEXTURE_2D);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);TX.dragon=t};im.src=DRAGON_SRC}screen(`<h1>FORGETAX</h1><p class="muted">불러오는 중…</p>`);UI.mode='title';requestAnimationFrame(frame);Acc.init().finally(titleScreen)}catch(err){console.error(err);screen(`<h2>3D 초기화 실패</h2><p class="muted">${String(err).replace(/</g,'&lt;')}</p>`)}}
}
